<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#E53935"/>
      <stop offset="0.55" stop-color="#B71C1C"/>
      <stop offset="1" stop-color="#6D0A0A"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3B0"/>
      <stop offset="0.35" stop-color="#F9C846"/>
      <stop offset="0.7" stop-color="#E09B1A"/>
      <stop offset="1" stop-color="#A86A0C"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9770E"/>
      <stop offset="0.3" stop-color="#F9C846"/>
      <stop offset="0.5" stop-color="#FFF1A8"/>
      <stop offset="0.7" stop-color="#F9C846"/>
      <stop offset="1" stop-color="#B9770E"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE082" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFB300" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF8F00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1B5E20"/>
      <stop offset="1" stop-color="#66BB6A"/>
    </linearGradient>
    <radialGradient id="nut" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#C58B4F"/>
      <stop offset="1" stop-color="#6B3F1D"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD1DC"/>
      <stop offset="1" stop-color="#E91E63"/>
    </linearGradient>
    <g id="leafShape"><path d="M0 0 C -16 -26, -14 -62, 0 -86 C 14 -62, 16 -26, 0 0 Z" fill="url(#leaf)" stroke="#0D3B12" stroke-width="2"/><path d="M0 -4 L0 -80" stroke="#A5D6A7" stroke-width="2" opacity=".7"/></g>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="94" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <rect x="34" y="34" width="444" height="444" rx="82" fill="none" stroke="#F9C846" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round" opacity=".9"/>
  <!-- corner dots (rangoli) -->
  <g fill="#F9C846">
    <circle cx="70" cy="70" r="6"/><circle cx="442" cy="70" r="6"/><circle cx="70" cy="442" r="6"/><circle cx="442" cy="442" r="6"/>
  </g>

  <!-- halo + rays -->
  <circle cx="256" cy="230" r="170" fill="url(#halo)"/>
  <g stroke="#FFE082" stroke-width="3" stroke-linecap="round" opacity=".55">
    <line x1="256" y1="60" x2="256" y2="92"/><line x1="146" y1="98" x2="166" y2="122"/><line x1="366" y1="98" x2="346" y2="122"/>
    <line x1="98" y1="190" x2="128" y2="198"/><line x1="414" y1="190" x2="384" y2="198"/>
  </g>

  <!-- lotus base -->
  <g transform="translate(256 400)">
    <path d="M-168 6 C -150 -50, -100 -70, -60 -40 C -84 -10, -120 6, -168 6 Z" fill="url(#petal)" stroke="#880E4F" stroke-width="2"/>
    <path d="M168 6 C 150 -50, 100 -70, 60 -40 C 84 -10, 120 6, 168 6 Z" fill="url(#petal)" stroke="#880E4F" stroke-width="2"/>
    <path d="M-128 8 C -128 -60, -90 -90, -56 -70 C -60 -30, -84 0, -128 8 Z" fill="url(#petal)" stroke="#880E4F" stroke-width="2"/>
    <path d="M128 8 C 128 -60, 90 -90, 56 -70 C 60 -30, 84 0, 128 8 Z" fill="url(#petal)" stroke="#880E4F" stroke-width="2"/>
    <path d="M0 -2 C -30 -30, -26 -60, 0 -78 C 26 -60, 30 -30, 0 -2 Z" fill="url(#petal)" stroke="#880E4F" stroke-width="2"/>
    <ellipse cx="0" cy="10" rx="172" ry="14" fill="url(#goldH)" stroke="#7A4A06" stroke-width="2"/>
  </g>

  <!-- mango leaves -->
  <g transform="translate(256 236)">
    <use href="#leafShape" transform="rotate(-74) scale(1.25)"/>
    <use href="#leafShape" transform="rotate(74) scale(1.25)"/>
    <use href="#leafShape" transform="rotate(-48) scale(1.35)"/>
    <use href="#leafShape" transform="rotate(48) scale(1.35)"/>
    <use href="#leafShape" transform="rotate(-22) scale(1.3)"/>
    <use href="#leafShape" transform="rotate(22) scale(1.3)"/>
  </g>
  <!-- coconut -->
  <ellipse cx="256" cy="190" rx="36" ry="46" fill="url(#nut)" stroke="#3E2410" stroke-width="2.5"/>
  <path d="M236 168 C 242 158, 250 154, 258 155" stroke="#E2B887" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M248 146 C 252 134, 258 130, 264 134" stroke="#4E2E12" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- kalash body -->
  <path d="M206 250 C 128 276, 124 366, 192 392 L 320 392 C 388 366, 384 276, 306 250 Z" fill="url(#gold)" stroke="#7A4A06" stroke-width="3"/>
  <!-- neck + rim -->
  <path d="M214 232 L 298 232 L 306 252 L 206 252 Z" fill="url(#goldH)" stroke="#7A4A06" stroke-width="2.5"/>
  <ellipse cx="256" cy="230" rx="62" ry="13" fill="url(#goldH)" stroke="#7A4A06" stroke-width="2.5"/>
  <!-- mauli thread -->
  <path d="M190 282 C 230 296, 282 296, 322 282" stroke="#D32F2F" stroke-width="6" fill="none"/>
  <path d="M190 282 C 230 296, 282 296, 322 282" stroke="#FFEB3B" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
  <!-- kalash shine -->
  <path d="M176 300 C 170 330, 176 358, 196 378" stroke="#FFF8D6" stroke-width="7" fill="none" stroke-linecap="round" opacity=".55"/>
  <!-- kumkum swastik -->
  <g transform="translate(256 338)" stroke="#C62828" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 -28 L0 28 M-28 0 L28 0"/>
    <path d="M0 -28 L22 -28 M28 0 L28 22 M0 28 L-22 28 M-28 0 L-28 -22"/>
  </g>
  <g fill="#C62828"><circle cx="242" cy="324" r="4"/><circle cx="270" cy="324" r="4"/><circle cx="242" cy="352" r="4"/><circle cx="270" cy="352" r="4"/></g>
</svg>
