function pay(id){const a=+$('pa').value||0,d=$('pdt').value,m=$('pm').value;if(a<=0)return alert('Enter a valid payment amount.');if(!d||!m)return alert('Select the payment date and clearing month.');const s=st.find(x=>x.id==id),f=s.fee;if(!isA()){RQ.push({id:Date.now(),sid:id,sname:s.name,amount:a,month:m,date:d,by:me().name,byId:SS.id,at:Date.now(),status:'pending'});save();openFee(id);toast('Sent to admin for approval');return}(f.history=f.history||[]).push({id:Date.now(),amount:a,month:m,date:d});f.paid+=a;f.lastDate=d;bal(s);save();openFee(id);V[cur]();toast('Payment recorded')}

function shareCode(){const m=`Activate ${cfg.className} with code: ${CODEV}`;if(navigator.share)navigator.share({text:m}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(m).then(()=>toast('Code copied'))}
function img(e,k){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{tmp[k]=x.target.result;const i=$('im-'+k);i.src=tmp[k];i.hidden=false};r.readAsDataURL(f)}
function saveSet(){Object.assign(cfg,tmp,{className:$('cn').value.trim()||'Mauli Coaching Classes',absentMessage:$('sa').value,feeReminderMessage:$('sf').value,ownerName:$('on1').value.trim(),ownerPhone:d10($('op1').value),asstName:$('an1').value.trim(),asstPhone:d10($('ap1').value)});save();toast('Settings saved')}
V.bak=()=>{$('v').innerHTML=`<div class="card"><h3 style="margin-top:0">Export data</h3><p>Save all students, fees, attendance, tests and settings as a JSON file.</p><button class="btn pri" style="width:100%" onclick="exp()">⬇ Download backup</button></div><div class="card"><h3 style="margin-top:0">Import data</h3><p class="neg">This overwrites your current data.</p><input id="imf" type="file" accept=".json" hidden onchange="imp(event)"><button class="btn" style="width:100%" onclick="$('imf').click()">⬆ Choose backup file</button></div>`};
async function exp(){const f=new File([JSON.stringify({version:'1.0',exportDate:new Date().toISOString(),settings:cfg,students:st,requests:RQ,teachers:TS,batches:BT},null,2)],`MauliCoaching_Backup_${TD}.json`,{type:'application/json'});if(NATUA){try{await nsave(f,f.name,'');return}catch(e){if(/cancel/i.test(String(e&&e.message)))return;return toast('Could not save the backup: '+e.message)}}try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return toast('Backup shared')}}catch(e){if(e.name=='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();toast('Backup downloaded')}
function imp(e){const f=e.target.files[0];if(!f)return;if(!confirm('Importing will REPLACE all students, fees, attendance, tests and settings in the database. Continue?')){e.target.value='';return}const r=new FileReader();r.onload=async x=>{try{const d=JSON.parse(x.target.result);if(!Array.isArray(d.students))throw new Error('x');const o=await api('import',{students:d.students,batches:d.batches||[],settings:d.settings||null});await pull();go('home');toast(`Imported ${o.n} students`)}catch(err){alert('Could not import: the file is invalid or the server is unreachable.')}};r.readAsText(f);e.target.value=''}
document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
if('serviceWorker'in navigator){if(NATUA)navigator.serviceWorker.getRegistrations().then(g=>g.forEach(x=>x.unregister())).catch(()=>{});else addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
(async()=>{if(NATUA)try{await natInit()}catch(e){}let x=null;try{x=JSON.parse(localStorage.getItem(SK))}catch(e){}
if(x&&x.t){TK=x.t;SS={role:x.role,id:x.id};try{await pull();return start()}catch(e){toast(e.message)}}
TK=null;if(x&&x.role=='student'){showLogin.i=1;lr='student'}SS=null;showLogin()})();
