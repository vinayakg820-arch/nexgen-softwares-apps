<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NexGen Softwares</title>
<meta name="theme-color" content="#1e1b4b">
<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bg:#f4f5fb; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e5e7f0;
  --brand:#4f46e5; --brand2:#7c3aed; --brand-soft:#eef2ff; --side:#1e1b4b;
  --ok:#16a34a; --ok-soft:#dcfce7; --warn:#d97706; --warn-soft:#fef3c7;
  --bad:#dc2626; --bad-soft:#fee2e2; --info:#0284c7; --info-soft:#e0f2fe;
  --gray-soft:#f1f5f9; --r:14px; --sh:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- login ---------- */
.login-wrap{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 10% -10%,#c7d2fe 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#ddd6fe 0,transparent 60%),var(--bg)}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(30,27,75,.15);padding:32px 28px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:46px;height:46px;border-radius:12px}
.brand h1{font-size:20px;margin:0;letter-spacing:-.2px}
.brand small{color:var(--muted);font-size:12.5px}
.login-card h2{font-size:17px;margin:26px 0 4px}
.login-card p.sub{margin:0 0 18px;color:var(--muted);font-size:13.5px}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:#334155}
.field label .req{color:var(--bad)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
textarea.inp{min-height:70px;resize:vertical}
.inp-group{display:flex;gap:8px}
.inp-group .inp{flex:1;min-width:0}
.hint{font-size:12px;color:var(--muted)}
.inp::placeholder{text-transform:none;color:#94a3b8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.check input{width:17px;height:17px;accent-color:var(--brand)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer;background:var(--gray-soft);color:var(--ink);white-space:nowrap;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.wa{background:#25d366;color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.icon-btn{border:0;background:transparent;cursor:pointer;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:inherit}
.icon-btn:hover{background:rgba(0,0,0,.06)}

/* ---------- app shell ---------- */
.shell{display:flex;min-height:100%}
.side{width:240px;flex:0 0 240px;background:var(--side);color:#c7d2fe;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{padding:18px 18px 14px;color:#fff}
.side .brand img{width:38px;height:38px;border-radius:10px}
.side .brand h1{font-size:15.5px}
.side .brand small{color:#a5b4fc}
.nav{padding:8px 10px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#c7d2fe;font-weight:500;margin-bottom:2px}
.nav a i{width:18px;text-align:center}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:rgba(255,255,255,.12);color:#fff}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:10px 6px}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px}
.side-foot .who{color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none;align-items:center;gap:10px;padding:10px 12px;background:var(--side);color:#fff;position:sticky;top:0;z-index:20}
.topbar .t{font-weight:700;flex:1}
.page{padding:26px 28px 60px;max-width:1240px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-head h2{margin:0;font-size:22px;letter-spacing:-.3px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.drawer-mask{display:none}
@media(max-width:900px){
  .side{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .drawer-mask.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  .topbar{display:flex}
  .page{padding:18px 14px 70px}
}

/* ---------- cards / tables ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid #eef0f6}
.card-pad{padding:18px}
.card h3{margin:0 0 12px;font-size:15.5px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-head h3{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:18px}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px;gap:10px}.stat .ic{width:36px;height:36px;font-size:15px}.stat .v{font-size:17px}}
.stat{padding:16px 18px;display:flex;gap:14px;align-items:center}
.stat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.4px}
.stat .l{color:var(--muted);font-size:12.5px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfe}
.tbl td{padding:11px 14px;border-bottom:1px solid #f1f2f7;vertical-align:middle}
.tbl td:not(:first-child){white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#fafbff}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty i{font-size:28px;display:block;margin-bottom:8px;opacity:.5}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-active{background:var(--ok-soft);color:#15803d}
.b-trial{background:var(--info-soft);color:#0369a1}
.b-expired{background:var(--bad-soft);color:#b91c1c}
.b-cancelled{background:var(--gray-soft);color:#475569}
.b-upcoming{background:#f3e8ff;color:#7e22ce}
.b-soon{background:var(--warn-soft);color:#b45309}
.b-paid{background:var(--ok-soft);color:#15803d}
.b-pending{background:var(--warn-soft);color:#b45309}
.b-free{background:var(--gray-soft);color:#475569}
.b-blocked{background:var(--bad-soft);color:#b91c1c}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.app-ic{width:34px;height:34px;border-radius:9px;object-fit:cover;flex:0 0 auto;background:var(--gray-soft)}
.app-ic.sm{width:22px;height:22px;border-radius:6px}
.app-ic.lg{width:54px;height:54px;border-radius:14px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar .inp{max-width:280px}
.toolbar select.inp{width:auto}
.seg{display:inline-flex;background:var(--gray-soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---------- software cards ---------- */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.sw-card{padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.sw-card:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c,#4f46e5)}
.sw-card .top{display:flex;gap:12px;align-items:center}
.sw-card h4{margin:0;font-size:15.5px}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prices div{background:#f8fafc;border-radius:10px;padding:8px 10px}
.prices b{display:block;font-size:14.5px}
.prices span{font-size:11.5px;color:var(--muted)}
.sw-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.url{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- wizard ---------- */
.steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--gray-soft);font-size:12px}
.step.on{border-color:var(--brand);color:var(--brand)}
.step.on .n{background:var(--brand);color:#fff}
.step.done{color:var(--ok)}
.step.done .n{background:var(--ok);color:#fff}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:16px}
.pick{border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff;display:flex;gap:12px;align-items:center;transition:border .15s,background .15s}
.pick:hover{border-color:#c7d2fe}
.pick.on{border-color:var(--brand);background:var(--brand-soft)}
.pick .tick{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:11px;flex:0 0 auto}
.pick.on .tick{background:var(--brand);border-color:var(--brand)}
.item{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:#fff}
.item-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.item-head .amt{margin-left:auto;text-align:right}
.item-head .amt b{font-size:18px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
@media(max-width:560px){.plans{grid-template-columns:1fr}}
.plan{border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.plan.on{border-color:var(--brand);background:var(--brand-soft)}
.plan b{display:block}
.plan span{font-size:12.5px;color:var(--muted)}
.coupon-msg{font-size:12.5px;margin-top:6px}
.coupon-msg.good{color:var(--ok)}
.coupon-msg.bad{color:var(--bad)}
.summary{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:0 0 var(--r) var(--r)}
.summary .tot{margin-right:auto}
.summary .tot b{font-size:20px}
.cred{background:linear-gradient(135deg,#1e1b4b,#4338ca);color:#fff;border-radius:16px;padding:20px;margin-bottom:16px}
.cred .k{font-size:12px;color:#c7d2fe;text-transform:uppercase;letter-spacing:.5px}
.cred .v{font-size:18px;font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.cred .grid2>div{margin-bottom:12px}

/* ---------- detail ---------- */
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.avatar{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:0 0 auto}

/* ---------- modal / toast ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto;animation:fade .15s}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .18s}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16.5px}
.modal-body{padding:18px 20px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 32px)}
.toast{background:#0f172a;color:#fff;padding:11px 15px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:pop .2s;max-width:420px}
.toast.err{background:#b91c1c}
.toast.ok i{color:#4ade80}
.spin{width:20px;height:20px;border:3px solid rgba(79,70,229,.2);border-top-color:var(--brand);border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.loading{display:grid;place-items:center;min-height:60vh;gap:12px;color:var(--muted)}
pre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:12px;overflow:auto;font-size:12.5px;line-height:1.5}
.update-bar{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:300;background:#0f172a;color:#fff;border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}

/* ---------- customer launcher ---------- */
.portal{min-height:100%;background:linear-gradient(180deg,#1e1b4b 0,#312e81 260px,var(--bg) 260px)}
.portal-head{max-width:980px;margin:0 auto;padding:22px 18px;display:flex;align-items:center;gap:12px;color:#fff}
.portal-head .brand h1{color:#fff}
.portal-head .brand small{color:#a5b4fc}
.portal-body{max-width:980px;margin:0 auto;padding:10px 18px 60px}
.hello{color:#fff;margin:6px 0 22px}
.hello h2{margin:0;font-size:24px}
.hello p{margin:4px 0 0;color:#c7d2fe}
.launch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.launch{padding:22px;display:flex;flex-direction:column;gap:14px}
.launch .top{display:flex;gap:14px;align-items:center}
.launch h4{margin:0;font-size:17px}
.launch .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px;flex-wrap:wrap}
.opening{position:fixed;inset:0;background:#1e1b4b;color:#fff;display:grid;place-items:center;text-align:center;z-index:500;padding:20px}
.opening img{width:84px;height:84px;border-radius:22px;margin-bottom:16px;background:#fff}
</style>
</head>

<script>
/* =====================================================================
   NexGen Softwares – Super Admin & Customer Portal
   ===================================================================== */
const APP_VERSION = '1.6.0';
const SUPABASE_URL = 'https://nqqbduqqiwpaixmrweef.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eKTOE3ywBI9ye02QFVDmvg_231pdTTJ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'nexgen-portal-auth' }

/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const todayIST = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());
const fmtD = d => d ? String(d).slice(0, 10).split('-').reverse().join('-') : '—';
const fmtDT = d => d ? new Date(d).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000);
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const planLabel = p => ({ monthly: 'Monthly', yearly: 'Yearly', trial: 'Trial' }[p] || p);
const initials = s => (String(s || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('') || '?').toUpperCase();

function toast(msg, type = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<i class="fas ${type === 'err' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), type === 'err' ? 6000 : 3200);

function errMsg(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/Invalid login credentials/i.test(m)) return 'Wrong ID or password';
  if (/banned/i.test(m)) return 'This account is blocked. Please contact NexGen Softwares.';
  if (/duplicate key.*coupons_code/i.test(m)) return 'This coupon code already exists';

async function run(promise) {
  const { data, error } = await promise;
  if (error) throw error;

}
function genPassword(len = 10) {
  const U = 'ABCDEFGHJKLMNPQRSTUVWXYZ', L = 'abcdefghijkmnpqrstuvwxyz', D = '23456789', S = '@#$%&*!';
  const all = U + L + D + S, r = new Uint32Array(len);
  crypto.getRandomValues(r);
  const pick = (set, i) => set[r[i] % set.length];
  const out = [pick(U, 0), pick(L, 1), pick(D, 2), pick(S, 3)];
  for (let i = 4; i < len; i++) out.push(pick(all, i));
  for (let i = out.length - 1; i > 0; i--) { const j = r[i] % (i + 1); [out[i], out[j]] = [out[j], out[i]]; }
  return out.join('');
}
function suggestLoginId(base) {

function openModal({ title, body, foot = '', wide = false, onMount }) {
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog">
    <div class="modal-head"><h3>${title}</h3><button class="icon-btn" data-close aria-label="Close"><i class="fas fa-xmark"></i></button></div>
    <div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div>`;
  const close = () => mask.remove();
  mask.addEventListener('click', e => { if (e.target === mask || e.target.closest('[data-close]')) close(); });
  document.body.appendChild(mask);
  mask.close = close;
  onMount && onMount(mask, close);
  return mask;
}
function confirmBox(message, { okText = 'Yes', danger = false } = {}) {

    m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) res(false); });
  });

function subState(s) {
  const t = todayIST();
  if (s.status === 'cancelled') return 'cancelled';
  if (s.end_date < t) return 'expired';
  if (s.start_date > t) return 'upcoming';
  if (s.plan === 'trial') return 'trial';
  return 'active';
}
function stateBadge(s) {
  const st = subState(s), t = todayIST();
  const left = daysBetween(t, s.end_date);
  const lbl = { active: 'Active', trial: 'Trial', expired: 'Expired', cancelled: 'Cancelled', upcoming: 'Upcoming' }[st];
  let html = `<span class="badge b-${st}">${lbl}</span>`;
  if ((st === 'active' || st === 'trial') && left <= 7) html += ` <span class="badge b-soon">${left === 0 ? 'Ends today' : left + 'd left'}</span>`;
  return html;
}

// read an image file → square PNG/JPEG data URL (max 512px, under ~480 KB)
function readLogo(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Choose an image file (PNG / JPG)'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 512, cv = document.createElement('canvas'); cv.width = cv.height = S;
      const ctx = cv.getContext('2d'), k = Math.min(S / img.width, S / img.height);
      const w = Math.round(img.width * k), h = Math.round(img.height * k);
      ctx.drawImage(img, (S - w) / 2, (S - h) / 2, w, h); URL.revokeObjectURL(url);
      let d = cv.toDataURL('image/png');
      if (d.length > 480000) { const c2 = document.createElement('canvas'); c2.width = c2.height = S; const x = c2.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, S, S); x.drawImage(cv, 0, 0); d = c2.toDataURL('image/jpeg', 0.85); }
      res(d);
    };
    img.onerror = () => rej(new Error('Could not read this image'));
    img.src = url;
  });
}

/* ----- software selection (shared by wizard + "add / renew" for existing customer) ----- */
function blankItem(sw, plan) {
  return { software_id: sw.id, plan: plan || (sw.monthly_price > 0 || sw.yearly_price === 0 ? 'monthly' : 'yearly'), periods: 1, coupon_code: '', quote: null, start_date: '', payment_status: 'paid', payment_mode: 'UPI', payment_ref: '', app_login: '', notes: '' };
}
function itemPrice(it) {
  const sw = swById(it.software_id);
  if (it.quote && it.quote.ok) return it.quote;
  const unit = it.plan === 'trial' ? 0 : it.plan === 'monthly' ? +sw.monthly_price : +sw.yearly_price;
  const per = it.plan === 'trial' ? 1 : it.periods;
  return { list_price: unit * per, discount: 0, final_amount: unit * per, extra_days: 0 };
}
function itemDates(it, customerId) {
  const sw = swById(it.software_id), t = todayIST();
  let start = it.start_date;
  if (!start) {
    const last = customerId ? S.subs.filter(s => s.customer_id === customerId && s.software_id === sw.id && s.status === 'active').map(s => s.end_date).sort().pop() : null;
    start = last && last >= t ? addDays(last, 1) : t;
  }
  const extra = (it.quote && it.quote.ok && it.quote.extra_days) || 0;
  let end;
  if (it.plan === 'trial') end = addDays(start, Math.max(sw.trial_days, 1) - 1);
  else {
    const d = new Date(start + 'T00:00:00Z');
    if (it.plan === 'monthly') d.setUTCMonth(d.getUTCMonth() + it.periods); else d.setUTCFullYear(d.getUTCFullYear() + it.periods);
    end = addDays(d.toISOString().slice(0, 10), -1);
  }
  return { start, end: addDays(end, extra) };
}

function selectionUI(page, { customerId, title, subtitle, items, onBack, onSubmit, submitText, showSteps, skipText, onSkip }) {

    const plan = (k, label, sub) => `<div class="plan ${it.plan === k ? 'on' : ''}" data-plan="${k}"><b>${label}</b><span>${sub}</span></div>`;

    return `<div class="item" data-sw="${sw.id}">
      <div class="item-head"><img class="app-ic" src="${esc(iconSrc(sw.icon))}" alt=""><div><b>${esc(sw.name)}</b><div class="small muted">${fmtD(dt.start)} → ${fmtD(dt.end)}</div></div>
        <div class="amt">${p.discount > 0 ? `<div class="small muted" style="text-decoration:line-through">${money(p.list_price)}</div>` : ''}<b>${money(p.final_amount)}</b></div></div>
      <div class="plans">

        ${plan('yearly', 'Yearly', money(sw.yearly_price) + ' / year')}

      <div class="grid3">
        ${it.plan !== 'trial' ? `<div class="field"><label>Number of ${it.plan === 'monthly' ? 'months' : 'years'}</label><input class="inp" type="number" min="1" max="60" data-f="periods" value="${it.periods}"></div>` : ''}
        <div class="field"><label>Coupon code</label><div class="inp-group"><input class="inp mono" data-f="coupon_code" value="${esc(it.coupon_code)}" placeholder="Optional" style="text-transform:uppercase"><button type="button" class="btn ghost" data-act="apply">Apply</button></div>
          ${q ? `<div class="coupon-msg ${q.ok ? 'good' : 'bad'}">${q.ok ? `<i class="fas fa-check"></i> ${esc(q.coupon_code)} applied${q.discount > 0 ? ' – you save ' + money(q.discount) : ''}${q.extra_days ? ' – +' + q.extra_days + ' extra days' : ''}` : `<i class="fas fa-xmark"></i> ${esc(q.error)}`}</div>` : ''}</div>
        <div class="field"><label>Start date</label><input class="inp" type="date" data-f="start_date" value="${esc(it.start_date || dt.start)}"></div>
      </div>
      ${it.plan !== 'trial' && p.final_amount > 0 ? `<div class="grid3">
        <div class="field"><label>Payment</label><select class="inp" data-f="payment_status"><option value="paid" ${it.payment_status === 'paid' ? 'selected' : ''}>Paid</option><option value="pending" ${it.payment_status === 'pending' ? 'selected' : ''}>Pending</option></select></div>
        <div class="field"><label>Payment mode</label><select class="inp" data-f="payment_mode">${['UPI', 'Cash', 'Bank transfer', 'Cheque', 'Card', 'Other'].map(m => `<option ${it.payment_mode === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
        <div class="field"><label>Reference / UTR</label><input class="inp" data-f="payment_ref" value="${esc(it.payment_ref)}" placeholder="Optional"></div></div>` : ''}
      <div class="grid2">
        <div class="field"><label>Login ID inside this software (optional)</label><input class="inp" data-f="app_login" value="${esc(it.app_login)}" placeholder="Shown to the customer in the portal"></div>
        <div class="field"><label>Note</label><input class="inp" data-f="notes" value="${esc(it.notes)}" placeholder="Optional"></div>
      </div>
    </div>`;
  };
  const draw = () => {
    const sel = Object.values(items);
    const total = sel.reduce((a, it) => a + itemPrice(it).final_amount, 0);
    page.innerHTML = `
    <div class="page-head"><div><h2>${title}</h2><p>${subtitle}</p></div></div>
    ${showSteps ? stepsBar(2) : ''}
    <div class="card">
      <div class="card-pad">
        <h3><i class="fas fa-layer-group" style="color:var(--brand)"></i> Select softwares</h3>
        ${active.length ? `<div class="pick-grid">${active.map(sw => `<div class="pick ${items[sw.id] ? 'on' : ''}" data-pick="${sw.id}"><img class="app-ic" src="${esc(iconSrc(sw.icon))}" alt=""><div><b>${esc(sw.name)}</b><div class="small muted">${money(sw.monthly_price)}/m · ${money(sw.yearly_price)}/y</div></div><span class="tick"><i class="fas fa-check"></i></span></div>`).join('')}</div>`
        : `<div class="empty">No active software. <a href="#/softwares">Add a software</a> first.</div>`}
        ${sel.map(itemCard).join('')}
      </div>
      <div class="summary">
        <div class="tot"><span class="muted small">${sel.length} software${sel.length === 1 ? '' : 's'} selected · Total</span><br><b>${money(total)}</b></div>
        ${onBack ? `<button class="btn ghost" id="selBack"><i class="fas fa-arrow-left"></i> Back</button>` : ''}
        ${onSkip ? `<button class="btn ghost" id="selSkip">${skipText}</button>` : ''}
        <button class="btn primary" id="selGo" ${sel.length ? '' : 'disabled'}><i class="fas fa-check"></i> ${submitText}</button>
      </div>
    </div>`;
    bind();
  };
  const requote = async (it, silent) => {
    const code = (it.coupon_code || '').trim();
    if (!code) { it.quote = null; return; }
    try { it.quote = await run(sb.rpc('quote_subscription', { p_software_id: it.software_id, p_plan: it.plan, p_periods: it.plan === 'trial' ? 1 : it.periods, p_coupon: code })); }
    catch (e) { it.quote = { ok: false, error: errMsg(e) }; }
    if (!silent && it.quote && !it.quote.ok) toast(it.quote.error, 'err');
  };

    $$('[data-pick]', page).forEach(el => el.onclick = () => {

      $$('[data-f]', card).forEach(inp => {

          if (f === 'coupon_code') { v = v.toUpperCase(); it.quote = null; }
          it[f] = v;
          if (f === 'start_date' && v === itemDates({ ...it, start_date: '' }, customerId).start) it.start_date = '';
          if (f === 'periods') await requote(it, true);
          if (f !== 'coupon_code' && f !== 'payment_ref' && f !== 'app_login' && f !== 'notes') draw();
        };

    });
    if (onBack) $('#selBack').onclick = onBack;
    if (onSkip) $('#selSkip').onclick = onSkip;
    $('#selGo').onclick = async () => {
      const sel = Object.values(items);
      for (const it of sel) if ((it.coupon_code || '').trim() && !(it.quote && it.quote.ok)) {
        await requote(it, true);
        if (!it.quote.ok) { draw(); return toast(swById(it.software_id).name + ': ' + it.quote.error, 'err'); }
      }
      const btn = $('#selGo'); btn.disabled = true; btn.innerHTML = '<span class="spin" style="width:16px;height:16px;border-width:2px"></span> Saving…';
      try { await onSubmit(sel.map(it => ({ ...it, coupon_code: (it.coupon_code || '').trim() || null, start_date: it.start_date || null, quote: undefined }))); }
      catch (e) { toast(errMsg(e), 'err'); btn.disabled = false; btn.innerHTML = `<i class="fas fa-check"></i> ${submitText}`; }
    };
  };
  draw();
}

function wizStep2(page) {
  selectionUI(page, {
    customerId: null, title: 'Register new customer', subtitle: `Step 2 of 2 – softwares for <b>${esc(W.cust.company_name || W.cust.name)}</b>`,
    items: W.items, showSteps: true, submitText: 'Register customer',
    onBack: () => { W.step = 1; wizStep1(page); },
    skipText: 'Register without software', onSkip: () => finishWizard(page, []),
    onSubmit: list => finishWizard(page, list)
  });
}
async function finishWizard(page, list) {
  try {
    if (!W.created) {
      const p = { ...W.cust, customer_code: W.cust.customer_code.trim().toUpperCase() };
      W.created = await run(sb.rpc('admin_create_customer', { p, p_password: W.password }));
    }
    if (list.length) W.createdSubs = await run(sb.rpc('admin_add_subscriptions', { p_customer_id: W.created.id, p_items: list }));
  } catch (e) {
    toast(errMsg(e), 'err');
    if (W.created) {   // customer saved but software step failed → let admin retry from the customer page
      await loadAll(); const id = W.created.id; W = null;
      toast('Customer was saved. Add the softwares again from the customer page.', 'err');
      location.hash = '#/add/' + id;
    } else { await loadAll(); wizStep2(page); }
    return;
  }
  await loadAll();
  W.step = 3;
  const createdCust = custById(W.created.id) || W.created;
  showCredentials(page, createdCust, W.password, W.createdSubs, true);
  if (W.createdSubs && W.createdSubs.length) activatedPopup(createdCust, W.createdSubs);
}

function credentialsText(c, password, subs) {
  const lines = [`Welcome to ${S.settings.company_name || 'NexGen Softwares'}!`, '', `Name: ${c.name}`];
  if (c.company_name) lines.push(`Company: ${c.company_name}`);
  lines.push('', `Login link: ${portalUrl()}`, `Login ID: ${c.customer_code}`);
  if (password) lines.push(`Password: ${password}`);
  if (subs && subs.length) {
    lines.push('', 'Your softwares:');
    subs.forEach(s => { const sw = swById(s.software_id); lines.push(`• ${sw ? sw.name : ''} – ${planLabel(s.plan)}, valid till ${fmtD(s.end_date)}`); });
  }
  lines.push('', 'You can also log in with your mobile number.');
  return lines.join('\n');
}
function showCredentials(page, c, password, subs, wizard) {
  const text = credentialsText(c, password, subs);
  page.innerHTML = `
  <div class="page-head"><div><h2>${wizard ? 'Customer registered' : 'Login details'}</h2><p>Share these with the customer</p></div></div>

/* ----- add / renew software for an existing customer ----- */
function viewAddSoftware(id, preselect) {
  const page = $('#page'), c = custById(id);
  if (!c) return page.innerHTML = `<div class="empty">Customer not found</div>`;
  const items = {};
  if (preselect) { const sw = swById(preselect.software_id); if (sw) { items[sw.id] = blankItem(sw, preselect.plan === 'trial' ? 'monthly' : preselect.plan); items[sw.id].app_login = preselect.app_login || ''; } }
  selectionUI(page, {
    customerId: c.id, title: preselect ? 'Renew software' : 'Add / renew software', subtitle: `For <b>${esc(c.company_name || c.name)}</b> (${esc(c.customer_code)}). Renewals start automatically after the current end date.`,
    items, submitText: 'Save', onBack: () => location.hash = '#/customer/' + c.id,
    onSubmit: async list => {
      const subs = await run(sb.rpc('admin_add_subscriptions', { p_customer_id: c.id, p_items: list }));
      await loadAll(); location.hash = '#/customer/' + c.id;
      setTimeout(() => activatedPopup(custById(c.id) || c, subs, { title: preselect ? 'Subscription Renewed & Activated' : 'Subscription Activated' }), 150);
    }
  });
}

async function editCustomer(c) {
  let logo = null, logoChanged = false;
  if (c.has_logo) { try { logo = (await run(sb.from('customers').select('logo').eq('id', c.id).single())).logo; } catch (_) { } }
  const f = (k, l, t = 'text') => `<div class="field"><label>${l}</label><input class="inp" name="${k}" type="${t}" value="${esc(c[k] || '')}"></div>`;
  const m = openModal({
    title: 'Edit customer', wide: true,
    body: `<form id="ecf">${logoPicker('el', logo)}<div class="grid2">${f('name', 'Full name *')}${f('mobile', 'Mobile *', 'tel')}${f('email', 'Email', 'email')}${f('company_name', 'Company name')}${f('city', 'City')}${f('gstin', 'GSTIN')}</div>

      <p class="hint">Login ID (${esc(c.customer_code)}) cannot be changed.</p></form>`,
    foot: `<button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="ecSave">Save</button>`
  });
  bindLogoPicker(m, 'el', d => { logo = d; logoChanged = true; });
  $('#ecSave', m).onclick = async () => {
    const d = Object.fromEntries(new FormData($('#ecf', m)));
    delete d[''];
    if (!d.name.trim() || digits(d.mobile).length < 10) return toast('Name and a valid mobile are required', 'err');
    Object.keys(d).forEach(k => { d[k] = d[k].trim() || null; });
    if (d.gstin) d.gstin = d.gstin.toUpperCase();
    if (logoChanged) d.logo = logo;
    try {
      await run(sb.from('customers').update(d).eq('id', c.id)); m.close(); toast('Saved');
      refresh();
    } catch (e) { toast(errMsg(e), 'err'); }
  };
}

/* =====================================================================
   SUBSCRIPTIONS (all customers)
   ===================================================================== */
let subFilter = { q: '', sw: '', st: 'live' };
function viewSubscriptions(page) {
  page.innerHTML = `
  <div class="page-head"><div><h2>Subscriptions</h2><p>Every plan, trial and renewal</p></div></div>
  <div class="card">
    <div class="toolbar">
      <input class="inp" id="sq" placeholder="Search customer…" value="${esc(subFilter.q)}">
      <select class="inp" id="ssw"><option value="">All softwares</option>${S.softwares.map(s => `<option value="${s.id}" ${subFilter.sw === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
      <div class="seg" id="sst">${[['live', 'Active'], ['trial', 'Trials'], ['soon', 'Ending ≤7d'], ['expired', 'Expired'], ['pending', 'Payment pending'], ['all', 'All']].map(([k, l]) => `<button data-k="${k}" class="${subFilter.st === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    </div><div id="slist"></div></div>`;
  const draw = () => {
    const t = todayIST(), q = subFilter.q.toLowerCase().trim();
    const latestIds = new Set(S.customers.flatMap(c => currentSubs(c.id)).map(s => s.id));
    let rows = S.subs.filter(s => {
      const c = custById(s.customer_id), st = subState(s);
      if (q && ![c?.name, c?.company_name, c?.mobile, c?.customer_code].some(v => String(v || '').toLowerCase().includes(q))) return false;
      if (subFilter.sw && s.software_id !== subFilter.sw) return false;
      switch (subFilter.st) {
        case 'live': return st === 'active' || st === 'trial' || st === 'upcoming';
        case 'trial': return st === 'trial';
        case 'soon': return (st === 'active' || st === 'trial') && daysBetween(t, s.end_date) <= 7 && latestIds.has(s.id);
        case 'expired': return st === 'expired' && latestIds.has(s.id);
        case 'pending': return s.payment_status === 'pending' && s.status !== 'cancelled';
      }
      return true;
    }).sort((a, b) => a.end_date.localeCompare(b.end_date));
    const total = rows.reduce((a, s) => a + +s.final_amount, 0);
    $('#slist').innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Customer</th><th>Software</th><th>Plan</th><th>Valid</th><th>Amount</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody>
      ${rows.map(s => { const c = custById(s.customer_id), sw = swById(s.software_id); return `<tr>
        <td><a href="#/customer/${s.customer_id}"><b>${esc(c?.company_name || c?.name)}</b></a><div class="small muted mono">${esc(c?.customer_code)}</div></td>
        <td><div class="row"><img class="app-ic sm" src="${esc(iconSrc(sw?.icon))}" alt="">${esc(sw?.name)}</div></td>
        <td>${planLabel(s.plan)}${s.plan !== 'trial' ? ' × ' + s.periods : ''}${s.coupon_code ? `<div class="small muted"><i class="fas fa-ticket"></i> ${esc(s.coupon_code)}</div>` : ''}</td>
        <td class="small">${fmtD(s.start_date)} →<br>${fmtD(s.end_date)}</td><td><b>${money(s.final_amount)}</b></td><td>${payBadge(s.payment_status)}</td><td>${stateBadge(s)}</td>
        <td style="white-space:nowrap;text-align:right">${s.payment_status === 'pending' && s.status !== 'cancelled' ? `<button class="btn sm ok" data-paid="${s.id}">Paid</button> ` : ''}<button class="btn sm primary" data-renew="${s.id}" title="Renew"><i class="fas fa-rotate"></i></button> <button class="btn sm ghost" data-edit="${s.id}" title="Edit"><i class="fas fa-pen"></i></button></td></tr>`; }).join('')}
      </tbody></table></div><div class="toolbar" style="border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end"><span class="muted">${rows.length} entries · Total <b>${money(total)}</b></span></div>`
      : `<div class="empty"><i class="fas fa-inbox"></i>Nothing here</div>`;
    $$('[data-paid]').forEach(b => b.onclick = () => markPaid(S.subs.find(s => s.id === b.dataset.paid)));
    $$('[data-edit]').forEach(b => b.onclick = () => editSub(S.subs.find(s => s.id === b.dataset.edit)));
    $$('[data-renew]').forEach(b => b.onclick = () => { const s = S.subs.find(x => x.id === b.dataset.renew); viewAddSoftware(s.customer_id, s); });
  };
  $('#sq').oninput = e => { subFilter.q = e.target.value; draw(); };
  $('#ssw').onchange = e => { subFilter.sw = e.target.value; draw(); };
  $('#sst').onclick = e => { const b = e.target.closest('button'); if (!b) return; subFilter.st = b.dataset.k; $$('#sst button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
  draw();
}

function editSoftware(sw) {

        <div class="field"><label>App URL (where the software is hosted)</label><input class="inp" name="app_url" value="${esc(d.app_url || '')}" placeholder="https://nexgensoftwares.edgeone.dev/&lt;code&gt;/"><span class="hint">Put the software in a folder named after its code inside the website ZIP.</span></div>
        <div class="field"><label>Subdomain</label><input class="inp mono" name="subdomain" value="${esc(d.subdomain || '')}" placeholder="e.g. billing"><span class="hint">${S.settings.base_domain ? `→ https://&lt;subdomain&gt;.${esc(S.settings.base_domain)}` : 'Used once you set your own domain in Settings'}</span></div>

        <div class="field"><label>Yearly price (₹)</label><input class="inp" type="number" min="0" step="1" name="yearly_price" value="${d.yearly_price}"></div>
        <div class="field"><label>Free trial (days)</label><input class="inp" type="number" min="0" step="1" name="trial_days" value="${d.trial_days}"></div>
        <div class="field"><label>Version</label><input class="inp" name="version" value="${esc(d.version || '')}"></div>
        <div class="field"><label>Colour</label><input class="inp" type="color" name="color" value="${esc(d.color)}" style="padding:4px;height:42px"></div>
        <div class="field"><label>Order in lists</label><input class="inp" type="number" name="sort_order" value="${d.sort_order}"></div>
      </div>
      <div class="field"><label>Features (comma separated)</label><input class="inp" name="features" value="${esc((d.features || []).join(', '))}"></div>
      <label class="check"><input type="checkbox" name="is_active" ${d.is_active ? 'checked' : ''}> Active – show in customer registration</label>
    </form>`,
    foot: `${isNew ? '' : '<button class="btn danger" id="swDel" style="margin-right:auto"><i class="fas fa-trash"></i></button>'}<button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="swSave">Save</button>`
  });
  const form = $('#swf', m);
  if (isNew) form.name.oninput = () => { if (!form.code.dataset.touched) form.code.value = form.name.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30); };
  if (isNew) form.code.oninput = () => form.code.dataset.touched = 1;
  $('#swIconFile', m).onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas'); cv.width = cv.height = 128;
      const ctx = cv.getContext('2d'), s = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 128, 128);
      d.icon = cv.toDataURL('image/png'); $('#swIcon', m).src = d.icon; URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
  };
  $('#swSave', m).onclick = async () => {
    const f = Object.fromEntries(new FormData(form));
    const row = {
      name: f.name.trim(), tagline: f.tagline.trim() || null, icon: d.icon || null, color: f.color, app_url: f.app_url.trim() || null,
      subdomain: f.subdomain.trim().toLowerCase() || null, version: f.version.trim() || null, monthly_price: +f.monthly_price || 0,
      yearly_price: +f.yearly_price || 0, trial_days: parseInt(f.trial_days) || 0, sort_order: parseInt(f.sort_order) || 0,
      features: f.features.split(',').map(x => x.trim()).filter(Boolean), is_active: !!form.is_active.checked
    };
    if (!row.name) return toast('Enter software name', 'err');
    if (row.app_url && !/^https?:\/\//i.test(row.app_url)) row.app_url = 'https://' + row.app_url;
    try {
      if (isNew) {
        row.code = f.code.trim().toLowerCase();
        if (!/^[a-z0-9-]{2,30}$/.test(row.code)) return toast('Code: small letters, numbers and dash only', 'err');
        await run(sb.from('softwares').insert(row));
      } else await run(sb.from('softwares').update(row).eq('id', sw.id));
      m.close(); toast('Software saved'); refresh();
    } catch (e) { toast(errMsg(e), 'err'); }
  };
  if (!isNew) $('#swDel', m).onclick = async () => {
    if (S.subs.some(s => s.software_id === sw.id)) return toast('This software has subscriptions – untick “Active” instead of deleting', 'err');
    if (!await confirmBox(`Delete <b>${esc(sw.name)}</b>?`, { danger: true, okText: 'Delete' })) return;
    try { await run(sb.from('softwares').delete().eq('id', sw.id)); m.close(); toast('Deleted'); refresh(); } catch (e) { toast(errMsg(e), 'err'); }
  };
}

/* =====================================================================
   COUPONS
   ===================================================================== */
function couponDesc(c) {
  return c.discount_type === 'percent' ? `${+c.discount_value}% off` : c.discount_type === 'flat' ? `${money(c.discount_value)} off` : `+${+c.discount_value} extra days`;
}
function viewCoupons(page) {
  const t = todayIST();
  const cState = c => !c.is_active ? ['cancelled', 'Inactive'] : (c.valid_until && c.valid_until < t) ? ['expired', 'Expired'] : (c.max_uses && c.used_count >= c.max_uses) ? ['expired', 'Used up'] : (c.valid_from && c.valid_from > t) ? ['upcoming', 'Not started'] : ['active', 'Active'];
  page.innerHTML = `
  <div class="page-head"><div><h2>Coupons</h2><p>Discounts for monthly / yearly plans, and extra days for trials</p></div><button class="btn primary" id="addCp"><i class="fas fa-plus"></i> Create coupon</button></div>
  <div class="card">${S.coupons.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Code</th><th>Benefit</th><th>Plans</th><th>Softwares</th><th>Validity</th><th>Used</th><th>Status</th><th></th></tr></thead><tbody>
    ${S.coupons.map(c => { const [k, l] = cState(c); return `<tr>
      <td><b class="mono">${esc(c.code)}</b>${c.description ? `<div class="small muted">${esc(c.description)}</div>` : ''}</td><td><b>${couponDesc(c)}</b></td>
      <td class="small">${c.plans.map(planLabel).join(', ')}</td>
      <td class="small">${c.software_ids && c.software_ids.length ? c.software_ids.map(id => esc(swById(id)?.name || '?')).join(', ') : 'All'}</td>
      <td class="small">${c.valid_from || c.valid_until ? `${fmtD(c.valid_from)} → ${fmtD(c.valid_until)}` : 'No limit'}</td>
      <td>${c.used_count}${c.max_uses ? ' / ' + c.max_uses : ''}</td><td><span class="badge b-${k}">${l}</span></td>
      <td style="white-space:nowrap;text-align:right"><button class="btn sm ghost" data-cpy="${esc(c.code)}" title="Copy"><i class="fas fa-copy"></i></button> <button class="btn sm ghost" data-cp="${c.id}" title="Edit"><i class="fas fa-pen"></i></button></td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="empty"><i class="fas fa-ticket"></i>No coupons yet</div>`}</div>`;
  $('#addCp').onclick = () => editCoupon(null);
  $$('[data-cp]', page).forEach(b => b.onclick = () => editCoupon(S.coupons.find(c => c.id === b.dataset.cp)));
  $$('[data-cpy]', page).forEach(b => b.onclick = () => copy(b.dataset.cpy));
}
function editCoupon(cp) {
  const isNew = !cp;
  const d = cp ? { ...cp } : { code: '', description: '', discount_type: 'percent', discount_value: 10, plans: ['monthly', 'yearly'], software_ids: null, valid_from: '', valid_until: '', max_uses: '', is_active: true };
  const all = !d.software_ids || !d.software_ids.length;
  const m = openModal({
    title: isNew ? 'Create coupon' : 'Edit coupon ' + esc(cp.code), wide: true,
    body: `<form id="cpf">
      <div class="grid2">
        <div class="field"><label>Coupon code <span class="req">*</span></label><div class="inp-group"><input class="inp mono" name="code" value="${esc(d.code)}" style="text-transform:uppercase" ${isNew ? '' : 'readonly'} placeholder="e.g. DIWALI20">
          ${isNew ? '<button type="button" class="btn ghost" id="cpAuto"><i class="fas fa-wand-magic-sparkles"></i> Auto</button>' : ''}</div></div>
        <div class="field"><label>Description</label><input class="inp" name="description" value="${esc(d.description || '')}" placeholder="e.g. Diwali offer"></div>
        <div class="field"><label>Type</label><select class="inp" name="discount_type">
          <option value="percent" ${d.discount_type === 'percent' ? 'selected' : ''}>Percentage off (%)</option>
          <option value="flat" ${d.discount_type === 'flat' ? 'selected' : ''}>Flat amount off (₹)</option>
          <option value="extra_days" ${d.discount_type === 'extra_days' ? 'selected' : ''}>Extra days (trial / plan)</option></select></div>
        <div class="field"><label id="cpValLbl">Value</label><input class="inp" type="number" min="1" step="1" name="discount_value" value="${+d.discount_value}"></div>
      </div>
      <div class="field"><label>Valid for plans</label><div style="display:flex;gap:18px;flex-wrap:wrap">${['monthly', 'yearly', 'trial'].map(p => `<label class="check"><input type="checkbox" name="plan_${p}" ${d.plans.includes(p) ? 'checked' : ''}> ${planLabel(p)}</label>`).join('')}</div></div>
      <div class="field"><label>Valid for softwares</label>
        <label class="check" style="margin-bottom:6px"><input type="checkbox" id="cpAll" ${all ? 'checked' : ''}> All softwares (including future ones)</label>
        <div id="cpSw" style="display:${all ? 'none' : 'flex'};gap:14px;flex-wrap:wrap">${S.softwares.map(s => `<label class="check"><input type="checkbox" value="${s.id}" ${!all && d.software_ids.includes(s.id) ? 'checked' : ''}> ${esc(s.name)}</label>`).join('')}</div></div>
      <div class="grid3">
        <div class="field"><label>Valid from</label><input class="inp" type="date" name="valid_from" value="${esc(d.valid_from || '')}"></div>
        <div class="field"><label>Valid until</label><input class="inp" type="date" name="valid_until" value="${esc(d.valid_until || '')}"></div>
        <div class="field"><label>Max uses</label><input class="inp" type="number" min="1" name="max_uses" value="${esc(d.max_uses || '')}" placeholder="Unlimited"></div>
      </div>
      <label class="check"><input type="checkbox" name="is_active" ${d.is_active ? 'checked' : ''}> Active</label>
      ${isNew ? '' : `<p class="hint">Used ${cp.used_count} time(s).</p>`}
    </form>`,
    foot: `${isNew ? '' : '<button class="btn danger" id="cpDel" style="margin-right:auto"><i class="fas fa-trash"></i></button>'}<button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="cpSave">Save coupon</button>`
  });
  const form = $('#cpf', m);
  const lbl = () => { $('#cpValLbl', m).textContent = { percent: 'Discount %', flat: 'Discount ₹', extra_days: 'Extra days' }[form.discount_type.value]; };
  form.discount_type.onchange = () => { lbl(); if (form.discount_type.value === 'extra_days') { form.plan_trial.checked = true; } };
  lbl();
  $('#cpAll', m).onchange = e => $('#cpSw', m).style.display = e.target.checked ? 'none' : 'flex';
  if (isNew) $('#cpAuto', m).onclick = () => { form.code.value = 'NGS' + Math.random().toString(36).slice(2, 8).toUpperCase(); };
  $('#cpSave', m).onclick = async () => {
    const f = Object.fromEntries(new FormData(form));
    const plans = ['monthly', 'yearly', 'trial'].filter(p => form['plan_' + p].checked);
    const swIds = $('#cpAll', m).checked ? null : $$('#cpSw input:checked', m).map(i => i.value);
    const row = {
      description: f.description.trim() || null, discount_type: f.discount_type, discount_value: +f.discount_value,
      plans, software_ids: swIds, valid_from: f.valid_from || null, valid_until: f.valid_until || null,
      max_uses: f.max_uses ? parseInt(f.max_uses) : null, is_active: !!form.is_active.checked
    };
    if (!(row.discount_value > 0)) return toast('Enter a value above 0', 'err');
    if (row.discount_type === 'percent' && row.discount_value > 100) return toast('Percentage cannot be above 100', 'err');
    if (!plans.length) return toast('Select at least one plan', 'err');
    if (swIds && !swIds.length) return toast('Select at least one software', 'err');
    if (row.valid_from && row.valid_until && row.valid_until < row.valid_from) return toast('“Valid until” is before “Valid from”', 'err');
    if (row.discount_type !== 'extra_days' && plans.length === 1 && plans[0] === 'trial') return toast('Trials are free – use “Extra days” type for trial coupons', 'err');
    try {
      if (isNew) {
        row.code = f.code.trim().toUpperCase();
        if (!/^[A-Z0-9_-]{3,30}$/.test(row.code)) return toast('Code: letters, numbers, - and _ (3-30)', 'err');
        await run(sb.from('coupons').insert(row));
      } else await run(sb.from('coupons').update(row).eq('id', cp.id));
      m.close(); toast('Coupon saved'); refresh();
    } catch (e) { toast(errMsg(e), 'err'); }
  };
  if (!isNew) $('#cpDel', m).onclick = async () => {
    if (!await confirmBox(`Delete coupon <b>${esc(cp.code)}</b>?${cp.used_count ? ' Past subscriptions keep the code in their history.' : ''}`, { danger: true, okText: 'Delete' })) return;
    try { await run(sb.from('coupons').delete().eq('id', cp.id)); m.close(); toast('Deleted'); refresh(); } catch (e) { toast(errMsg(e), 'err'); }
  };
}

async function viewActivity(page) {

    <div class="card"><div class="loading" style="min-height:200px"><span class="spin"></span></div></div>`;
  $('#actRef').onclick = () => viewActivity(page);
  let rows = [];
  try { rows = await run(sb.from('activity_log').select('*').order('at', { ascending: false }).limit(300)); } catch (e) { toast(errMsg(e), 'err'); }
  const label = {
    'admin.login': ['fa-user-shield', 'Super admin logged in'], 'customer.login': ['fa-right-to-bracket', 'Customer logged in'],

    'customer.blocked': ['fa-ban', 'Customer blocked'], 'customer.active': ['fa-unlock', 'Customer unblocked'],

  $('.card', page).innerHTML = rows.length ? `<div class="toolbar"><span class="muted small">${loginsToday} customer logins today</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>When</th><th>What</th><th>Customer</th><th>Details</th></tr></thead><tbody>

      <td>${c ? `<a href="#/customer/${c.id}">${esc(c.company_name || c.name)}</a>` : '<span class="muted">—</span>'}</td><td class="small muted">${det(r)}</td></tr>`; }).join('')}
  </tbody></table></div>` : `<div class="empty"><i class="fas fa-wave-square"></i>No activity yet</div>`;
}

    f.customer_code_prefix = (f.customer_code_prefix || 'NGS').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'NGS';
    if (f.base_domain) f.base_domain = f.base_domain.replace(/^https?:\/\//, '').replace(/\/.*$/, '').toLowerCase();
    try { await run(sb.from('settings').update(f).eq('id', 1)); toast('Settings saved'); refresh(); } catch (ex) { toast(errMsg(ex), 'err'); }
  };
  $('#mypw').onsubmit = async e => {
    e.preventDefault();
    const a = $('#np1').value, b = $('#np2').value;
    if (a.length < 8) return toast('Use at least 8 characters', 'err');
    if (a !== b) return toast('Passwords do not match', 'err');
    try { await run(sb.auth.updateUser({ password: a })); toast('Password updated'); e.target.reset(); } catch (ex) { toast(errMsg(ex), 'err'); }
  };
}

/* =====================================================================
   UPDATES (upload new zip to EdgeOne → "Update now" bar)
   ===================================================================== */
async function checkUpdate() {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const { version } = await r.json();
    if (version && version !== APP_VERSION && !$('.update-bar')) {
      const bar = document.createElement('div');
      bar.className = 'update-bar';
      bar.innerHTML = `<span><i class="fas fa-circle-up"></i> New version ${esc(version)} available</span><button class="btn sm primary">Update now</button>`;
      bar.querySelector('button').onclick = async () => {
        try { const regs = await navigator.serviceWorker?.getRegistrations(); for (const reg of regs || []) await reg.update(); const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch (_) { }
        location.reload();
      };
      document.body.appendChild(bar);
    }
  } catch (_) { }
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
setInterval(checkUpdate, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });

sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && S.me) { S.me = null; renderLogin(); } });
boot().then(checkUpdate);
</script>
