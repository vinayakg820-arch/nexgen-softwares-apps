<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexGen Softwares</title><meta name="theme-color" content="#1e1b4b"><link rel="icon" href="icon-192.png">
<style>html,body{margin:0;height:100%;background:#1e1b4b;display:grid;place-items:center;font-family:system-ui;color:#c7d2fe}</style></head>
<body><p>Opening NexGen Softwares…</p>
<script>
// The main link stays the same. Super Admin lives in /admin/, customers in /portal/, each software in its own folder,
// so every one installs and updates as a separate app.
(function () {
  var go = function () { location.replace('portal/' + location.search + location.hash); };
  try {
    // remove the old web app that was installed on the whole site (it made softwares open inside the admin window)
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.filter(function (r) { return new URL(r.scope).pathname === '/'; }).map(function (r) { return r.unregister(); }));
      }).then(go, go);
      setTimeout(go, 1500);
      return;
    }
  } catch (e) { }
  go();
})();
</script></body></html>
