        document.querySelectorAll('table').forEach(function (t) {

          t.querySelectorAll('tbody tr').forEach(function (tr) {
            Array.prototype.forEach.call(tr.children, function (td, i) {
              var l = heads[i] || '';
              if (td.getAttribute('data-label') !== l) td.setAttribute('data-label', l);

      document.addEventListener('DOMContentLoaded', function () {
        new MutationObserver(function () { if (!queued) { queued = true; requestAnimationFrame(label); } })

    function DashboardView({ leads, currentUser }) {
      const [selectedMonth, setSelectedMonth] = useState('All');

      const availableMonths = useMemo(() => {
        const months = new Set();
        leads.forEach(l => {
          if (l.enquiryDate) {
            const [year, month] = l.enquiryDate.split('-');
            if (year && month) months.add(`${year}-${month}`);
          }
        });
        return Array.from(months).sort().reverse();
      }, [leads]);

      const formatMonth = (monthStr) => {
        if (!monthStr) return '';
        const [year, month] = monthStr.split('-');
        const date = new Date(year, parseInt(month) - 1, 1);
        return date.toLocaleString('default', { month: 'short', year: 'numeric' });
      };

      const dashboardLeads = useMemo(() => {
        let filtered = currentUser?.role === 'admin' ? leads : leads.filter(l => l.assignedTo === currentUser?.id);
        if (selectedMonth !== 'All') {
          filtered = filtered.filter(l => l.enquiryDate && l.enquiryDate.startsWith(selectedMonth));
        }
        return filtered;
      }, [leads, currentUser, selectedMonth]);
      
      const totalLeads = dashboardLeads.length;
      const convertedLeads = dashboardLeads.filter(l => l.conversionStatus === 'Converted').length;
      const conversionRate = totalLeads ? ((convertedLeads / totalLeads) * 100).toFixed(1) : 0;
      const pendingCalls = dashboardLeads.filter(l => l.callStatus === 'Pending').length;

      const categoryData = dashboardLeads.reduce((acc, lead) => {
        if (!lead.category) return acc;
        const existing = acc.find(item => item.name === lead.category);
        if (existing) existing.value += 1;
        else acc.push({ name: lead.category, value: 1 });
        return acc;
      }, []);

      const statusData = [
        { name: 'Converted', count: convertedLeads },
        { name: 'In Progress', count: dashboardLeads.filter(l => l.conversionStatus === 'In Progress').length },
        { name: 'Not Converted', count: dashboardLeads.filter(l => l.conversionStatus === 'Not Converted').length },
      ];

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center mb-2 animate-slide-up">
            <h3 className="text-lg font-semibold text-slate-700 hidden sm:block">Performance Overview</h3>
            <div className="relative w-full sm:w-48 ml-auto">
              <select value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} className="w-full pl-3 pr-8 py-2.5 border border-slate-200 rounded-lg appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white shadow-sm font-medium text-slate-700">
                <option value="All">All Time (Months)</option>
                {availableMonths.map((m, i) => (<option key={i} value={m}>{formatMonth(m)}</option>))}
              </select>
              <ChevronDown className="absolute right-3 top-3 h-4 w-4 text-slate-400 pointer-events-none" />
            </div>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            {[
              { title: "Assigned Leads", value: totalLeads, icon: Users, color: "text-blue-600", bg: "bg-blue-50" },
              { title: "Converted Sales", value: convertedLeads, icon: IndianRupee, color: "text-emerald-600", bg: "bg-emerald-50" },
              { title: "Conversion Rate", value: `${conversionRate}%`, icon: TrendingUp, color: "text-indigo-600", bg: "bg-indigo-50" },
              { title: "Pending Calls", value: pendingCalls, icon: Phone, color: "text-amber-600", bg: "bg-amber-50" }
            ].map((stat, i) => (
              <Card key={i} className="p-6 animate-slide-up hover:-translate-y-1 transition-transform duration-300" style={{ animationDelay: `${i * 0.1}s` }}>
                <div className="flex items-center justify-between">
                  <div>
                    <p className="text-sm font-medium text-slate-500">{stat.title}</p>
                    <h3 className="text-2xl font-bold text-slate-800 mt-1">{stat.value}</h3>
                  </div>
                  <div className={`p-3 rounded-full ${stat.bg} ${stat.color}`}><stat.icon className="w-6 h-6" /></div>
                </div>
              </Card>
            ))}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <Card className="p-6 animate-slide-up" style={{ animationDelay: "0.4s" }}>
              <h3 className="text-lg font-semibold text-slate-800 mb-6 flex items-center"><PieChartIcon className="w-5 h-5 mr-2 text-indigo-500" /> Leads by Category</h3>
              <div className="h-64">
                <ResponsiveContainer width="100%" height="100%">
                  <PieChart><Pie data={categoryData} innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value">{categoryData.map((entry, index) => (<Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />))}</Pie><RechartsTooltip /><Legend verticalAlign="bottom" height={36} /></PieChart>
                </ResponsiveContainer>
              </div>
            </Card>
            <Card className="p-6 animate-slide-up" style={{ animationDelay: "0.5s" }}>
              <h3 className="text-lg font-semibold text-slate-800 mb-6 flex items-center"><BarChart className="w-5 h-5 mr-2 text-indigo-500" /> Conversion Status Overview</h3>
              <div className="h-64">
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={statusData} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}><CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" /><XAxis dataKey="name" axisLine={false} tickLine={false} tick={{ fontSize: 12, fill: '#64748b' }} /><YAxis axisLine={false} tickLine={false} tick={{ fontSize: 12, fill: '#64748b' }} /><RechartsTooltip cursor={{ fill: '#f8fafc' }} contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }} /><Bar dataKey="count" fill="#4f46e5" radius={[4, 4, 0, 0]} barSize={40} /></BarChart>
                </ResponsiveContainer>
              </div>
            </Card>
          </div>
        </div>
      );
    }

    function LeadFormModal({ lead, leads, categories, references, onClose, onSave }) {
      const [formData, setFormData] = useState(lead || {
        name: '', phone: '', enquiryDate: new Date().toISOString().split('T')[0], category: '', product: '', reference: '', callStatus: 'Pending', callNotes: '', expectedBuyDate: '', visitedStatus: 'Not Visited', expectedVisitDate: '', buyingConfirmation: 'Pending', buyingWhen: '', notBuyingReason: '', conversionStatus: 'In Progress', assignedTo: null
      });
      const [errors, setErrors] = useState({});

      // Keyboard shortcut for Space Bar / Ctrl + Space to save form
      useEffect(() => {
        const handleKeyDown = (e) => {
          const isInput = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
          // Trigger save if Space is pressed (outside inputs) or Ctrl+Space (anywhere)
          if ((e.key === ' ' && !isInput) || (e.key === ' ' && e.ctrlKey)) {
            e.preventDefault();
            document.getElementById('saveLeadBtn')?.click();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => {
          const updatedData = { ...prev, [name]: value };
          if (name === 'conversionStatus' && value === 'Converted') { updatedData.buyingConfirmation = 'Yes'; if (!updatedData.buyingWhen) updatedData.buyingWhen = 'Bought'; }
          return updatedData;
        });
        if (errors[name]) setErrors(prev => ({ ...prev, [name]: null }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const newErrors = {};
        if (!formData.name.trim()) newErrors.name = 'Name is required';
        if (!formData.phone.trim()) newErrors.phone = 'Mobile Number is required';
        
        // Anti-Duplicate Phone Number Check
        const duplicatePhone = leads.find(l => 
          l.phone.replace(/\s+/g, '') === formData.phone.replace(/\s+/g, '') && 
          l.id !== formData.id
        );
        if (duplicatePhone) {
          newErrors.phone = 'This phone number already exists in the system!';
        }

        if (Object.keys(newErrors).length > 0) { setErrors(newErrors); return; }
        onSave({ ...formData, id: formData.id || Date.now() });
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-start sm:items-center justify-center p-2 sm:p-4 overflow-y-auto">
          <div className="bg-slate-50 rounded-2xl shadow-2xl w-full max-w-4xl flex flex-col max-h-[90vh] animate-pop-in">
            <div className="flex items-center justify-between p-5 border-b border-slate-200 bg-white rounded-t-2xl shrink-0">
              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">{lead ? <Edit2 className="w-5 h-5 text-indigo-500" /> : <Plus className="w-5 h-5 text-indigo-500" />}{lead ? 'Edit Lead Details' : 'Add New Lead'}</h2>
              <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full text-slate-500 transition-colors"><X className="w-5 h-5" /></button>
            </div>
            <div className="p-6 overflow-y-auto custom-scrollbar">
              <form id="leadForm" onSubmit={handleSubmit} className="space-y-6">
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                  <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider flex items-center gap-2 border-b border-slate-100 pb-3 mb-4"><Users className="w-4 h-4 text-indigo-500"/> Customer Profile</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><Input label="Customer Name" name="name" value={formData.name} onChange={handleChange} required placeholder="Enter full name" enableMic={true} autoFocus={true} />{errors.name && <p className="text-red-500 text-xs mt-1">{errors.name}</p>}</div>
                    <div><Input label="Mobile / WhatsApp" name="phone" value={formData.phone} onChange={handleChange} required placeholder="e.g. +91 9876543210" enableMic={true} />{errors.phone && <p className="text-red-500 text-xs mt-1">{errors.phone}</p>}</div>
                  </div>
                </div>
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                  <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider flex items-center gap-2 border-b border-slate-100 pb-3 mb-4"><Info className="w-4 h-4 text-indigo-500"/> Lead Information</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    <Input label="Enquiry Date" name="enquiryDate" type="date" value={formData.enquiryDate} onChange={handleChange} />
                    <Select label="Enquiry Category" name="category" value={formData.category} onChange={handleChange} options={categories} />
                    {formData.category ? (<Input label="Product Looking For" name="product" value={formData.product} onChange={handleChange} placeholder="e.g. Shoes, Service..." />) : (<div className="hidden md:block"></div>)}
                    <Select label="Reference" name="reference" value={formData.reference} onChange={handleChange} options={references} />
                    <Select label="Call Status" name="callStatus" value={formData.callStatus} onChange={handleChange} options={['Pending', 'Made Call', 'Not Received', 'Not Reachable']} />
                    {formData.callStatus === 'Made Call' && (
                      <div><div className="flex items-center justify-between gap-2 mb-1 flex-wrap"><label className="text-sm font-medium text-slate-700">What discussed on Call</label><MicButton onText={(t) => setFormData(f => ({ ...f, callNotes: appendText(f.callNotes, t) }))} /></div><textarea name="callNotes" rows="3" value={formData.callNotes || ''} onChange={handleChange} placeholder="Briefly describe the call..." className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" /></div>
                    )}
                    <Select label="Visited Status" name="visitedStatus" value={formData.visitedStatus} onChange={handleChange} options={['Not Visited', 'Visited']} />
                    {formData.visitedStatus === 'Not Visited' && (
                      <Input label="Expected Visit Date" name="expectedVisitDate" type="date" value={formData.expectedVisitDate || ''} onChange={handleChange} />
                    )}
                  </div>

    // Free voice typing: Android app → Google voice typing; Chrome on computer → built-in speech recognition
    const SPEECH_LANGS = [['mr-IN', 'मराठी'], ['hi-IN', 'हिंदी'], ['en-IN', 'English']];
    const startVoiceTyping = (lang, onText, onDone, toast) => {
      if (window.AndroidBridge && window.AndroidBridge.startSpeech) {
        window.__lmSpeechCb = (type, text) => { window.__lmSpeechCb = null; if (type === 'speech' && text) onText(text); else if (text && toast) toast(text, 'error'); onDone(); };
        window.AndroidBridge.startSpeech(lang);
        return;
      }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR || isNativeApp()) { if (toast) toast('Use the 🎤 on your keyboard to speak (or update the app).', 'error'); onDone(); return; }
      const r = new SR();
      r.lang = lang; r.interimResults = false; r.maxAlternatives = 1;
      r.onresult = (e) => { const t = e.results[0] && e.results[0][0] ? e.results[0][0].transcript : ''; if (t) onText(t); };
      r.onerror = (e) => { if (toast && e.error !== 'no-speech' && e.error !== 'aborted') toast('Mic error: ' + e.error, 'error'); };
      r.onend = onDone;
      try { r.start(); } catch (e) { onDone(); }
    };
    function MicButton({ onText, toast }) {
      const [lang, setLang] = useState(() => lsGet('lm_speech_lang') || 'mr-IN');
      const [listening, setListening] = useState(false);
      const pick = (l) => { setLang(l); lsSet('lm_speech_lang', l); };
      const go = () => { if (listening) return; setListening(true); startVoiceTyping(lang, onText, () => setListening(false), toast); };
      return (
        <div className="flex items-center gap-1.5 flex-wrap">
          <button type="button" onClick={go} className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold text-white ${listening ? 'bg-rose-500 animate-pulse' : 'bg-indigo-600 hover:bg-indigo-700'}`}>
            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3" /><path d="M5 10a7 7 0 0 0 14 0M12 17v5" /></svg>
            {listening ? 'ऐकतोय…' : 'बोलून लिहा'}
          </button>
          {SPEECH_LANGS.map(([code, label]) => (
            <button type="button" key={code} onClick={() => pick(code)} className={`px-2 py-1 rounded-full text-[11px] font-medium border ${lang === code ? 'bg-indigo-50 border-indigo-300 text-indigo-700' : 'border-slate-200 text-slate-500'}`}>{label}</button>
          ))}
        </div>
      );
    }
    const appendText = (prev, t) => (prev && prev.trim() ? prev.trim() + ' ' : '') + t.trim();

                  <p className="text-[11px] text-slate-400 mt-1">"बोलून लिहा" दाबा आणि मराठी / हिंदी / English मध्ये सांगा — free, कोणताही खर्च नाही.</p>

    function LeadsManagerView({ waSettings, products, sends, showToast, leads, categories, references, onAdd, onUpdate, onBulkUpdate, onDelete, currentUser, users }) {
      const isAdmin = currentUser.role === 'admin';
      const [isFormOpen, setIsFormOpen] = useState(false); 
      const [isBulkAssignOpen, setIsBulkAssignOpen] = useState(false);
      const [editingLead, setEditingLead] = useState(null);
      const [viewingLead, setViewingLead] = useState(null); 
      // Call button: mark "Made Call" at once; when the user comes back from the phone call, ask what was discussed
      const [callLead, setCallLead] = useState(null);
      const pendingCallRef = useRef(null);
      const leadsRef = useRef(leads);
      leadsRef.current = leads;
      const latestLead = (id) => leadsRef.current.find(l => String(l.id) === String(id));
      const startCall = (lead) => {
        onUpdate({ ...lead, callStatus: 'Made Call', lastCallAt: new Date().toISOString() });
        pendingCallRef.current = { id: lead.id, left: false };
      };
      useEffect(() => {
        const onVis = () => {
          const pc = pendingCallRef.current;
          if (!pc) return;
          if (document.hidden) { pc.left = true; return; }
          if (pc.left) { pendingCallRef.current = null; const l = latestLead(pc.id); if (l) setCallLead(l); }
        };
        const onBlur = () => { if (pendingCallRef.current) pendingCallRef.current.left = true; };
        const onFocus = () => { setTimeout(() => { if (!document.hidden) onVis(); }, 300); };
        document.addEventListener('visibilitychange', onVis);
        window.addEventListener('blur', onBlur);
        window.addEventListener('focus', onFocus);
        return () => { document.removeEventListener('visibilitychange', onVis); window.removeEventListener('blur', onBlur); window.removeEventListener('focus', onFocus); };
      }, []);
      const saveCallNotes = (status, note) => {
        const lead = latestLead(callLead.id) || callLead;
        const stamp = new Date().toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        const notes = status === 'Made Call' && note ? (stamp + ': ' + note + (lead.callNotes ? '\n' + lead.callNotes : '')) : (lead.callNotes || '');
        onUpdate({ ...lead, callStatus: status, callNotes: notes });
        setCallLead(null);
        showToast(status === 'Made Call' ? 'Call saved' + (note ? ' with notes' : '') : 'Saved: ' + status, 'success');
      };
      const [assigningLead, setAssigningLead] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      const [filterStatus, setFilterStatus] = useState('All');
      const [timelineFilter, setTimelineFilter] = useState('All');
      const [categoryFilter, setCategoryFilter] = useState('All'); // Added Category State
      const [timelineSort, setTimelineSort] = useState('Desc'); // Added Sorting State
      const [monthFilter, setMonthFilter] = useState('All'); // Added Month Filter

      // Derived available months for filtering
      const availableMonths = useMemo(() => {
        const months = new Set();
        leads.forEach(l => {
          if (l.enquiryDate) {
            const [year, month] = l.enquiryDate.split('-');
            if (year && month) months.add(`${year}-${month}`);
          }
        });
        return Array.from(months).sort().reverse();
      }, [leads]);

      const formatMonth = (monthStr) => {
        if (!monthStr) return '';
        const [year, month] = monthStr.split('-');
        const date = new Date(year, parseInt(month) - 1, 1);
        return date.toLocaleString('default', { month: 'short', year: 'numeric' });
      };

      // Keyboard shortcut for 'N' to open New Lead form
      useEffect(() => {
        const handleKeyDown = (e) => {
          const isInput = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
          if (!isInput && e.key.toLowerCase() === 'n' && !isFormOpen && !viewingLead && !assigningLead) {
            e.preventDefault();
            setEditingLead(null);
            setIsFormOpen(true);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isFormOpen, viewingLead, assigningLead]);

      // Security Filtering applied here!
      const filteredLeads = useMemo(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const tomorrowStr = tomorrow.toISOString().split('T')[0];

        let result = leads.filter(l => {
          const matchesSearch = l.name.toLowerCase().includes(searchTerm.toLowerCase()) || l.phone.includes(searchTerm);
          const matchesFilter = filterStatus === 'All' || l.conversionStatus === filterStatus || (filterStatus === 'Pending' && l.conversionStatus === 'In Progress');
          const matchesUser = isAdmin ? true : l.assignedTo === currentUser.id;
          const matchesCategory = categoryFilter === 'All' || l.category === categoryFilter; // Apply Category Filter
          const matchesMonth = monthFilter === 'All' || (l.enquiryDate && l.enquiryDate.startsWith(monthFilter)); // Apply Month Filter
          
          let matchesTimeline = true;
          if (timelineFilter === 'Today') matchesTimeline = l.expectedBuyDate === todayStr;
          else if (timelineFilter === 'Tomorrow') matchesTimeline = l.expectedBuyDate === tomorrowStr;

          return matchesSearch && matchesFilter && matchesUser && matchesTimeline && matchesCategory && matchesMonth;
        });

        // Time-wise Sorting
        result.sort((a, b) => {
          const dateA = new Date(a.expectedBuyDate || a.enquiryDate || 0).getTime();
          const dateB = new Date(b.expectedBuyDate || b.enquiryDate || 0).getTime();
          return timelineSort === 'Asc' ? dateA - dateB : dateB - dateA;
        });

        return result;
      }, [leads, searchTerm, filterStatus, timelineFilter, categoryFilter, monthFilter, timelineSort, currentUser, isAdmin]);

      const handleSave = (data) => { 
        // If a non-admin creates a new lead, auto-assign it to them so it appears in their list
        if (!editingLead && !isAdmin) {
          data.assignedTo = currentUser.id;
        }
        editingLead ? onUpdate(data) : onAdd(data); 
        setIsFormOpen(false); 
      };
      const handleAssignSave = (updatedLead) => { onUpdate(updatedLead); setAssigningLead(null); };

      return (
        <div className="md:h-[calc(100vh-6rem)] flex flex-col space-y-4 animate-slide-up">

            <h2 className="text-xl font-bold text-slate-800">Lead Database</h2>
            <div className="flex gap-2 w-full sm:w-auto [&>button]:flex-1 sm:[&>button]:flex-none">
              {isAdmin && (
                <Button onClick={() => setIsBulkAssignOpen(true)} variant="secondary" icon={Users}>Assignment Of Leads</Button>
              )}
              <Button onClick={() => {setEditingLead(null); setIsFormOpen(true);}} icon={Plus}>Add New Lead (N)</Button>
            </div>
          </div>
          <Card className="flex-1 flex flex-col">
            <div className="p-4 border-b border-slate-100 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 bg-white">
              <div className="grid grid-cols-2 gap-2 sm:flex sm:flex-row flex-wrap sm:gap-3 w-full xl:w-auto flex-1">
                <div className="relative col-span-2 w-full sm:max-w-xs"><input type="text" placeholder="Search by name or phone..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" /><Search className="absolute left-3 top-2.5 h-4 w-4 text-slate-400" /></div>
                <div className="relative w-full sm:w-40"><select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)} className="w-full pl-3 pr-8 py-2 border border-slate-200 rounded-lg appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white"><option value="All">All Leads</option><option value="Pending">Pending</option><option value="Converted">Converted</option><option value="Not Converted">Not Converted</option></select><ChevronDown className="absolute right-3 top-2.5 h-4 w-4 text-slate-400 pointer-events-none" /></div>
                
                {/* NEW: Category Filter Dropdown */}
                <div className="relative w-full sm:w-48"><select value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)} className="w-full pl-3 pr-8 py-2 border border-slate-200 rounded-lg appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white"><option value="All">All Categories</option>{categories.map((cat, i) => (<option key={i} value={cat}>{cat}</option>))}</select><ChevronDown className="absolute right-3 top-2.5 h-4 w-4 text-slate-400 pointer-events-none" /></div>
                
                {/* NEW: Month Filter Dropdown */}

    function UserFormModal({ user, onClose, onSave }) {
      const [formData, setFormData] = useState(user || {
        name: '', phone: '', address: '', loginId: '', password: '', role: 'user'
      });
      const [errors, setErrors] = useState({});

      const generatePassword = () => {
        const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
        let pass = "";
        for (let i = 0; i < 10; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
        setFormData(prev => ({ ...prev, password: pass }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.loginId || (!user && !formData.password)) {
          setErrors({ form: "Name, Login ID, and Password are required." });
          return;
        }
        onSave({ ...formData, id: formData.id || `user-${Date.now()}`, lastModified: Date.now() });
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-start sm:items-center justify-center p-2 sm:p-4 overflow-y-auto">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg flex flex-col animate-pop-in">
            <div className="flex items-center justify-between p-5 border-b border-slate-200">
              <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><UserPlus className="w-5 h-5 text-indigo-500" />{user ? 'Edit User' : 'Add New User'}</h2>
              <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full text-slate-500"><X className="w-5 h-5" /></button>
            </div>
            <div className="p-6">
              <form id="userForm" onSubmit={handleSubmit} className="space-y-4">
                {errors.form && <div className="p-3 bg-red-50 text-red-600 rounded-lg text-sm">{errors.form}</div>}
                <Input label="Full Name" name="name" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} required placeholder="e.g. Rahul Sharma" />
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <Input label="Contact Number" name="phone" value={formData.phone} onChange={(e) => setFormData({...formData, phone: e.target.value})} placeholder="e.g. 9876543210" />
                  <Select label="Role" name="role" value={formData.role} onChange={(e) => setFormData({...formData, role: e.target.value})} options={[{label:'Admin', value:'admin'}, {label:'User', value:'user'}]} />
                </div>
                <Input label="Address" name="address" value={formData.address} onChange={(e) => setFormData({...formData, address: e.target.value})} placeholder="Location / HQ" />
                <div className="pt-4 border-t border-slate-100">
                   <Input label="Login ID (Email/Username)" name="loginId" value={formData.loginId} onChange={(e) => setFormData({...formData, loginId: e.target.value})} required placeholder="e.g. rahul.shop" />
                   <p className="text-xs text-slate-500 mt-1">The user logs in at <b>nexgensoftwares.edgeone.dev</b> with this Login ID and password.</p>
                </div>
                <div>
                  <div className="flex justify-between items-end mb-1.5">
                    <label className="text-sm font-medium text-slate-700">Password <span className="text-red-500">*</span></label>
                    <button type="button" onClick={generatePassword} className="text-xs text-indigo-600 hover:text-indigo-800 font-semibold">Generate Strong</button>
                  </div>
                  <input type="text" placeholder={user ? "Leave blank to keep current password" : ""} value={formData.password || ''} onChange={(e) => setFormData({...formData, password: e.target.value})} className="w-full px-3 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white" required placeholder="Create password" />
                </div>
              </form>
            </div>
            <div className="p-5 border-t border-slate-200 flex justify-end gap-3 bg-slate-50 rounded-b-2xl">
              <Button variant="ghost" onClick={onClose}>Cancel</Button>
              <Button type="submit" form="userForm">{user ? 'Update User' : 'Create User'}</Button>
            </div>
          </div>
        </div>
      );
    }

    function UserManagementView({ users, categories, references, onAddUser, onUpdateUser, onDeleteUser, showToast, currentUser }) {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingUser, setEditingUser] = useState(null);
      const [clients, setClients] = useState([]);
      useEffect(() => { sb.from(TBL.app_clients).select('*').then(({ data }) => { if (data) setClients(data); }); }, []);
      const latestVersion = clients.reduce((m, c) => cmpVer(c.version, m) > 0 ? c.version : m, '0');
      const ago = (t) => { const m = Math.round((Date.now() - new Date(t).getTime()) / 60000); return m < 1 ? 'now' : m < 60 ? m + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };

      const handleSave = (userData) => {
        if (editingUser) onUpdateUser(userData);
        else onAddUser(userData);
        setIsModalOpen(false);
      };

      const handleGenerateAccessCard = (user) => {
        // Core Security Logic: Stamping the generated card so old ones expire
        const updatedUser = { ...user, lastModified: Date.now() };
        onUpdateUser(updatedUser); // Update system memory
        
        const data = { type: 'LEADMASTER_ACCESS_CARD', version: '1.0', user: updatedUser, categories, references };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
        const dlNode = document.createElement('a');
        dlNode.setAttribute("href", dataStr);
        dlNode.setAttribute("download", `AccessCard_${user.name.replace(/\s+/g, '_')}.json`);
        document.body.appendChild(dlNode);
        dlNode.click();
        dlNode.remove();
        showToast(`Access Card downloaded for ${user.name}`, 'success');
      };

      return (
        <div className="md:h-[calc(100vh-6rem)] flex flex-col space-y-4 animate-slide-up">
          <div className="flex flex-wrap gap-3 justify-between items-center">
             <div><h2 className="text-xl font-bold text-slate-800">User Management</h2><p className="text-slate-500 text-sm">Manage team access and generate secure login cards.</p></div>
             <Button onClick={() => {setEditingUser(null); setIsModalOpen(true);}} icon={Plus}>Add New User</Button>
          </div>
          <Card className="flex-1 overflow-x-auto custom-scrollbar">
            <table className="w-full text-left text-sm whitespace-nowrap">
               <thead className="bg-slate-50 text-slate-600 font-semibold border-b border-slate-200">
                  <tr><th className="p-4">User Info</th><th className="p-4">Role</th><th className="p-4">Contact</th><th className="p-4">Login ID</th><th className="p-4">App Version</th><th className="p-4 text-right">Actions</th></tr>
               </thead>
               <tbody className="divide-y divide-slate-100">
                 {users.map((user, i) => (
                    <tr key={user.id} className="hover:bg-slate-50 transition-colors">
                      <td className="p-4"><div className="font-medium text-slate-900">{user.name}</div><div className="text-xs text-slate-500">{user.address || '-'}</div></td>
                      <td className="p-4"><Badge status={user.role} /></td>
                      <td className="p-4"><div className="flex items-center text-slate-700"><Phone className="w-3 h-3 mr-1 text-slate-400"/>{user.phone || '-'}</div></td>
                      <td className="p-4 text-indigo-600 font-medium">{user.loginId}</td>
                      <td className="p-4"><div className="flex flex-col gap-1">
                        {clients.filter(c => c.auth_id === user.authId).length === 0 && <span className="text-xs text-slate-400">Not seen yet</span>}
                        {clients.filter(c => c.auth_id === user.authId).map(c => (
                          <span key={c.platform} className={`text-xs font-medium px-2 py-0.5 rounded-full w-fit ${cmpVer(c.version, latestVersion) < 0 ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>
                            {c.platform === 'android' ? '📱 App' : '💻 Browser'} v{c.version} · {ago(c.last_seen)}{cmpVer(c.version, latestVersion) < 0 ? ' · old' : ''}
                          </span>
                        ))}
                      </div></td>
                      <td className="p-4 text-right">
                         <div className="flex items-center justify-end gap-2">
                           <Button variant="secondary" onClick={() => handleGenerateAccessCard(user)} icon={Key} className="py-1.5 px-3 text-xs bg-slate-50 hover:bg-indigo-50 hover:text-indigo-700 hover:border-indigo-200">Access Card</Button>
                           <button onClick={() => {setEditingUser(user); setIsModalOpen(true);}} className="p-2 text-indigo-600 hover:bg-indigo-50 rounded-lg"><Edit2 className="w-4 h-4" /></button>
                           <button onClick={() => onDeleteUser(user.id)} disabled={user.id === currentUser.id} className="p-2 text-red-600 hover:bg-red-50 rounded-lg disabled:opacity-30"><Trash2 className="w-4 h-4" /></button>
                         </div>
                      </td>
                    </tr>
                 ))}
               </tbody>
            </table>
          </Card>
          {isModalOpen && <UserFormModal user={editingUser} onClose={() => setIsModalOpen(false)} onSave={handleSave} />}
        </div>
      );

    function BackupView({ leads, users, categories, references, tasks, onImport, showToast, currentUser }) {
      const isAdmin = currentUser.role === 'admin';
      const fileInputRef = useRef(null);

      const handleExport = () => {
        try {
          const exportLeads = isAdmin ? leads : leads.filter(l => l.assignedTo === currentUser.id);
          const exportUsers = isAdmin ? users : [currentUser]; // Normal user only exports their own identity safely
          const exportTasks = isAdmin ? tasks : tasks.filter(t => t.assignedTo === currentUser.id);

          const exportData = { 
            type: 'LEADMASTER_BACKUP', 
            version: '1.1', 
            isAdminExport: isAdmin, // Tagging this as the Master Database
            leads: exportLeads, 
            users: exportUsers,
            categories,
            references,
            tasks: exportTasks
          };
          if (window.AndroidBridge && window.AndroidBridge.saveTextFile) {
            const fname = isAdmin ? `LeadMaster_Admin_Backup_${new Date().toISOString().split('T')[0]}.json` : `LeadMaster_MyLeads_${new Date().toISOString().split('T')[0]}.json`;
            window.AndroidBridge.saveTextFile(fname, JSON.stringify(exportData, null, 2));
            return; // the app shows its own 'Saved to Downloads' message
          }
          const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
          const dlNode = document.createElement('a'); 
          dlNode.setAttribute("href", dataStr); 
          const filename = isAdmin ? `LeadMaster_Admin_Backup_${new Date().toISOString().split('T')[0]}.json` : `LeadMaster_MyLeads_${new Date().toISOString().split('T')[0]}.json`;
          dlNode.setAttribute("download", filename);
          document.body.appendChild(dlNode); 
          dlNode.click(); 
          dlNode.remove();
          showToast('Backup successfully downloaded!', 'success');
        } catch (error) { showToast('Failed to generate backup.', 'error'); }
      };

      const handleFileChange = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.type === 'LEADMASTER_BACKUP' && data.leads) {
              onImport(data.leads, data.users || [], !!data.isAdminExport, data.categories, data.references, data.tasks || []);
            } else if (Array.isArray(data)) {
               onImport(data, [], false, null, null, []); // Legacy support
            } else { showToast('Invalid format. File must be a LeadMaster backup.', 'error'); }
          } catch (error) { showToast('Error parsing file.', 'error'); }
          e.target.value = null;
        };
        reader.readAsText(file);
      };

      return (
        <div className="h-full flex flex-col space-y-6 animate-slide-up">

    function ProductivityView({ tasks, users }) {
      const [selectedUserId, setSelectedUserId] = useState(users.length > 0 ? users[0].id : '');

      const monthlyData = useMemo(() => {
        if (!selectedUserId) return [];
        const userTasks = tasks.filter(t => t.assignedTo === selectedUserId);
        const months = {};

        userTasks.forEach(task => {
          const date = new Date(task.createdAt || Date.now());
          const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
          if (!months[monthKey]) months[monthKey] = { name: monthKey, Assigned: 0, Completed: 0, Approved: 0 };
          
          months[monthKey].Assigned += 1;
          if (task.status === 'Completed' || task.status === 'Pending Approval' || task.status === 'Approved') {
            months[monthKey].Completed += 1;
          }
          if (task.status === 'Approved') {
             months[monthKey].Approved += 1;
          }
        });
        
        return Object.values(months).sort((a,b) => a.name.localeCompare(b.name)).map(m => {
           const prodPct = m.Assigned > 0 ? Math.round((m.Completed / m.Assigned) * 100) : 0;
           return { ...m, Productivity: prodPct, monthLabel: new Date(m.name + '-01').toLocaleString('default', { month: 'short', year: 'numeric' }) };
        });
      }, [tasks, selectedUserId]);

      const totalAssigned = monthlyData.reduce((sum, d) => sum + d.Assigned, 0);
      const totalCompleted = monthlyData.reduce((sum, d) => sum + d.Completed, 0);
      const overallProd = totalAssigned > 0 ? Math.round((totalCompleted / totalAssigned) * 100) : 0;

      return (
        <div className="md:h-[calc(100vh-6rem)] flex flex-col space-y-6 animate-slide-up">
          <div className="flex flex-wrap gap-3 justify-between items-center">
             <div>
                <h2 className="text-xl font-bold text-slate-800">Productivity Analytics</h2>
                <p className="text-slate-500 text-sm">Measure task completion and team efficiency over time.</p>
             </div>
             <div className="w-full sm:w-64">
               <Select label="" name="userSelect" value={selectedUserId} onChange={e => setSelectedUserId(e.target.value)} options={users.map(u => ({value: u.id, label: u.name}))} />
             </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
             <Card className="p-6">
               <p className="text-sm font-medium text-slate-500">Total Assigned Tasks</p>
               <h3 className="text-3xl font-bold text-slate-800 mt-2">{totalAssigned}</h3>
             </Card>
             <Card className="p-6">
               <p className="text-sm font-medium text-slate-500">Total Completed</p>
               <h3 className="text-3xl font-bold text-emerald-600 mt-2">{totalCompleted}</h3>
             </Card>
             <Card className="p-6">
               <p className="text-sm font-medium text-slate-500">Overall Productivity %</p>
               <h3 className="text-3xl font-bold text-indigo-600 mt-2">{overallProd}%</h3>
             </Card>
          </div>

          <Card className="p-6 flex-1 min-h-[300px]">
            <h3 className="text-lg font-semibold text-slate-800 mb-6 flex items-center"><Activity className="w-5 h-5 mr-2 text-indigo-500" /> Monthly Performance Breakdown</h3>
            {monthlyData.length > 0 ? (
              <div className="h-full max-h-[350px]">
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={monthlyData} margin={{ top: 20, right: 30, left: 0, bottom: 5 }}>
                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                    <XAxis dataKey="monthLabel" axisLine={false} tickLine={false} tick={{ fontSize: 12, fill: '#64748b' }} />
                    <YAxis axisLine={false} tickLine={false} tick={{ fontSize: 12, fill: '#64748b' }} />
                    <RechartsTooltip cursor={{ fill: '#f8fafc' }} contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }} />
                    <Legend />
                    <Bar dataKey="Assigned" fill="#94a3b8" radius={[4, 4, 0, 0]} />
                    <Bar dataKey="Completed" fill="#10b981" radius={[4, 4, 0, 0]} />
                    <Bar dataKey="Approved" fill="#4f46e5" radius={[4, 4, 0, 0]} />
                  </BarChart>
                </ResponsiveContainer>
              </div>
            ) : (
              <div className="h-full flex items-center justify-center text-slate-500">No task data available for this user.</div>
            )}
          </Card>
        </div>
      );
    }

    function ProductFormModal({ product, onClose, onSave }) {
      const [form, setForm] = useState(() => ({
        name: product ? product.name : '', description: product ? product.description : '',
        price: product ? product.price : '', active: product ? product.active : true
      }));
      const [images, setImages] = useState(product ? product.images : []);
      const [removedPaths, setRemovedPaths] = useState([]);
      const [newFiles, setNewFiles] = useState([]);
      const [saving, setSaving] = useState(false);
      const [error, setError] = useState('');
      const fileRef = useRef(null);
      const MAX_PHOTOS = 6;
      const total = images.length + newFiles.length;
      useEffect(() => () => newFiles.forEach(f => URL.revokeObjectURL(f.preview)), []);

      const addFiles = (e) => {
        const picked = Array.from(e.target.files || []).filter(f => f.type.startsWith('image/'));
        const room = MAX_PHOTOS - total;
        if (picked.length > room) setError('You can add up to ' + MAX_PHOTOS + ' photos per product.');
        setNewFiles(prev => [...prev, ...picked.slice(0, Math.max(0, room)).map(file => ({ file, preview: URL.createObjectURL(file) }))]);
        e.target.value = '';
      };
      const removeExisting = (img) => { setImages(prev => prev.filter(i => i !== img)); if (img.path) setRemovedPaths(prev => [...prev, img.path]); };
      const removeNew = (nf) => { URL.revokeObjectURL(nf.preview); setNewFiles(prev => prev.filter(f => f !== nf)); };

      const submit = async (e) => {
        e.preventDefault();
        if (!form.name.trim()) { setError('Product name is required.'); return; }
        setSaving(true); setError('');
        try {
          await onSave({ id: product ? product.id : null, sort_order: product ? product.sort_order : null, ...form, images, removedPaths, newFiles: newFiles.map(f => f.file) });
          onClose();
        } catch (err) { setError(err.message || String(err)); setSaving(false); }
      };
      const inp = 'w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500';
      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-start sm:items-center justify-center p-2 sm:p-4 overflow-y-auto">
          <form onSubmit={submit} className="bg-white rounded-2xl shadow-2xl w-full max-w-lg animate-pop-in flex flex-col max-h-[92vh] my-2">
            <div className="flex items-center justify-between p-4 border-b border-slate-100">
              <h2 className="text-lg font-semibold text-slate-800">{product ? 'Edit Product' : 'Add Product'}</h2>
              <button type="button" onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full text-slate-500"><X className="w-5 h-5" /></button>
            </div>
            <div className="p-5 space-y-4 overflow-y-auto">
              {error && <div className="p-3 rounded-lg bg-red-50 text-red-700 text-sm border border-red-100">{error}</div>}

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      
      const [users, setUsers] = useState([]);
      const [leads, setLeads] = useState([]);
      const [categories, setCategories] = useState(dummyCategories);
      const [references, setReferences] = useState(dummyReferences);
      const [tasks, setTasks] = useState([]);
      const [loaded, setLoaded] = useState(false);
      const [updateInfo, setUpdateInfo] = useState(null);
      const [updating, setUpdating] = useState(false);
      const [congrats, setCongrats] = useState(null);
      const [notifs, setNotifs] = useState([]);
      const [waStatus, setWaStatus] = useState(null);
      const [webSeq, setWebSeq] = useState(null);
      const [installEvt, setInstallEvt] = useState(null);
      const [pull, setPull] = useState(0);
      const [refreshing, setRefreshing] = useState(false);
      const refreshAll = async () => {
        setRefreshing(true);
        try {
          const { data } = await sb.auth.getSession();
          if (data && data.session) await loadAll(data.session.user, true);
        } catch (e) {}
        if (window.__lmCheckUpdateNow) window.__lmCheckUpdateNow();
        setRefreshing(false);
        showToast('Refreshed • Version ' + APP_VERSION, 'success');
      };
      const refreshRef = useRef(refreshAll);
      refreshRef.current = refreshAll;
      useEffect(() => {
        const standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
        if (!loaded || !(isNativeApp() || standalone)) return;
        const LIMIT = 80;
        let startY = null, dist = 0;
        const atTop = (el) => {
          if (window.scrollY > 0) return false;
          for (let n = el; n && n !== document.body; n = n.parentElement) if (n.scrollTop > 0) return false;
          return true;
        };
        const onStart = (e) => {
          if (e.touches.length !== 1 || e.target.closest('.fixed') || !atTop(e.target)) { startY = null; return; }
          startY = e.touches[0].clientY; dist = 0;
        };
        const onMove = (e) => {
          if (startY === null) return;
          dist = Math.max(0, e.touches[0].clientY - startY);
          if (dist > 0 && window.scrollY === 0) { setPull(Math.min(dist / 2, LIMIT)); if (e.cancelable && dist > 10) e.preventDefault(); }
        };
        const onEnd = () => {
          if (startY === null) return;
          const go = dist / 2 >= LIMIT * 0.8;
          startY = null; dist = 0; setPull(0);
          if (go) refreshRef.current();
        };
        document.addEventListener('touchstart', onStart, { passive: true });
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
        document.addEventListener('touchcancel', onEnd);
        return () => {
          document.removeEventListener('touchstart', onStart); document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onEnd); document.removeEventListener('touchcancel', onEnd);
        };
      }, [loaded]);
      useEffect(() => {
        if (isNativeApp()) return;
        if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
        const onPrompt = (e) => { e.preventDefault(); setInstallEvt(e); };
        const onInstalled = () => { setInstallEvt(null); showToast('LeadMaster is installed on this computer. Open it from the desktop or Start menu.', 'success'); };
        window.addEventListener('beforeinstallprompt', onPrompt);
        window.addEventListener('appinstalled', onInstalled);
        return () => { window.removeEventListener('beforeinstallprompt', onPrompt); window.removeEventListener('appinstalled', onInstalled); };
      }, []);
      const installApp = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} setInstallEvt(null); };
      const [sends, setSends] = useState({});
      const loadSends = async () => {
        const { data, error } = await sb.from(TBL.lead_sends).select('lead_id,item,sent_at');
        if (error || !data) return;
        const map = {};
        data.forEach(r => { (map[r.lead_id] = map[r.lead_id] || {})[r.item] = r.sent_at; });
        setSends(map);
      };
      useEffect(() => {
        const h = async (e) => {
          const { leadId, item } = e.detail;
          const now = new Date().toISOString();
          setSends(prev => ({ ...prev, [leadId]: { ...(prev[leadId] || {}), [item]: now } }));
          await sb.from(TBL.lead_sends).upsert({ lead_id: leadId, item, sent_at: now, sent_by: meRef.current ? meRef.current.id : null }, { onConflict: ON.lead_sends });
        };
        window.addEventListener('lm-wa-sent', h);
        return () => window.removeEventListener('lm-wa-sent', h);
      }, []);
      useEffect(() => {
        const h = (e) => setWebSeq({ ...e.detail, index: 1 });
        window.addEventListener('lm-wa-steps', h);
        return () => window.removeEventListener('lm-wa-steps', h);
      }, []);
      const openNextWebStep = () => {
        if (!webSeq) return;
        openWaStep(webSeq.lead, webSeq.steps[webSeq.index], webSeq.mode, showToast);
        if (webSeq.index + 1 >= webSeq.steps.length) { setWebSeq(null); showToast('Last message opened. Press Send in WhatsApp.', 'success'); }
        else setWebSeq({ ...webSeq, index: webSeq.index + 1 });
      };
      useEffect(() => {
        window.__lmNative = (type, payload) => {
          if (type === 'waProgress') setWaStatus({ title: 'Getting WhatsApp messages ready…', detail: payload });
          else if (type === 'waStep' || type === 'waNext') {
            const [i, n] = String(payload).split('/');
            if (type === 'waStep' && window.__lmWaPlan) { const st = window.__lmWaPlan.steps[Number(i) - 1]; if (st) markSent(window.__lmWaPlan.leadId, st.item); }
            setWaStatus(type === 'waStep'
              ? { title: 'WhatsApp message ' + i + ' of ' + n, detail: 'Press Send in WhatsApp. The next one opens automatically.' }
              : { title: 'Sent ' + i + ' of ' + n, detail: 'Opening the next message…' });
          } else if (type === 'speech' || type === 'speechError') {
            if (window.__lmSpeechCb) window.__lmSpeechCb(type, payload);
          } else if (type === 'waDone') {
            setWaStatus(null);
            if (payload === 'done') showToast('All WhatsApp messages are done.', 'success');
            else if (String(payload).indexOf('error:') === 0) showToast(String(payload).slice(6), 'error');
          } else if (window.__lmUpdateHandler) window.__lmUpdateHandler(type, payload);
        };
      }, []);
      const meRef = useRef(null);
      useEffect(() => { meRef.current = currentUser; }, [currentUser]);
      const [waSettings, setWaSettings] = useState(() => normalizeWaSettings({}));
      const [products, setProducts] = useState([]);
      const siteUrlRef = useRef(DEFAULT_SITE_URL);
      useEffect(() => { siteUrlRef.current = waSettings.siteUrl || DEFAULT_SITE_URL; }, [waSettings]);
      const synced = useRef({ leads: new Map(), tasks: new Map(), categories: '', references: '', whatsapp: '' });

      const [currentView, setCurrentView] = useState('dashboard');
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [toast, setToast] = useState({ message: '', type: '', isExiting: false });

      const loadProducts = async () => {
        const { data, error } = await sb.from(TBL.products).select('*');
        if (!error && data) setProducts(sortProducts(data.map(normalizeProduct)));
      };

      // ---- Load everything from Supabase ----
      const loadAll = async (authUser, keepView = false) => {
        const [p, l, t, s] = await Promise.all([
          sb.from(TBL.profiles).select('*'), sb.from(TBL.leads).select('*'),
          sb.from(TBL.tasks).select('*'), sb.from(TBL.settings).select('*')
        ]);
        const err = p.error || l.error || t.error || s.error;
        if (err) { showToast('Could not load data: ' + err.message, 'error'); return false; }
        const me = p.data.find(x => x.auth_id === authUser.id);
        if (!me) { setNoAccess(true); return false; }
        if (TENANT && TENANT !== me.tenant) { setLeads([]); setTasks([]); setProducts([]); setSends({}); }
        TENANT = me.tenant;
        loadBrand();
        const L = l.data.map(r => r.data), T = t.data.map(r => r.data);
        const cat = normalizeStringList((s.data.find(r => r.key === 'categories') || {}).value, dummyCategories);
        const ref = normalizeStringList((s.data.find(r => r.key === 'references') || {}).value, dummyReferences);
        const waRaw = (s.data.find(r => r.key === 'whatsapp') || {}).value;
        const waObj = normalizeWaSettings(waRaw);
        synced.current = {
          leads: new Map(L.map(o => [String(o.id), JSON.stringify(o)])),
          tasks: new Map(T.map(o => [String(o.id), JSON.stringify(o)])),
          categories: JSON.stringify(cat), references: JSON.stringify(ref), whatsapp: JSON.stringify(waObj)
        };
        setUsers(p.data.map(profileToUser));
        setLeads(L.sort((a, b) => b.id - a.id)); setTasks(T.sort((a, b) => String(b.id).localeCompare(String(a.id))));
        setCategories(cat); setReferences(ref); setWaSettings(waObj);
        loadProducts();
        loadSends();
        setCurrentUser(profileToUser(me)); if (!keepView) setCurrentView('dashboard'); setLoaded(true);
        return profileToUser(me);
      };

      // ---- Push changes to Supabase (diff against last synced snapshot) ----
      const syncTable = async (table, items) => {
        const prev = synced.current[table], next = new Map(items.map(o => [String(o.id), JSON.stringify(o)]));
        const up = items.filter(o => prev.get(String(o.id)) !== next.get(String(o.id)));
        const del = [...prev.keys()].filter(k => !next.has(k));
        synced.current[table] = next;
        if (up.length) { const { error } = await sb.from(TBL[table]).upsert(up.map(o => rowOf(table, o)), { onConflict: ON[table] }); if (error) showToast('Save failed: ' + error.message, 'error'); }
        if (del.length) { const { error } = await sb.from(TBL[table]).delete().in('id', del); if (error) showToast('Delete failed: ' + error.message, 'error'); }
      };
      const syncSetting = async (key, value) => {

      useEffect(() => { if (loaded && currentUser && currentUser.role === 'admin') syncSetting('categories', categories); }, [categories, loaded]);
      useEffect(() => { if (loaded && currentUser && currentUser.role === 'admin') syncSetting('references', references); }, [references, loaded]);
      useEffect(() => { if (loaded && currentUser && currentUser.role === 'admin') syncSetting('whatsapp', waSettings); }, [waSettings, loaded]);

      // ---- Live updates from other users (Supabase Realtime) ----
      useEffect(() => {
        if (!loaded) return;

            setter(prev => prev.filter(o => String(o.id) !== id));
            return;
          }
          const obj = p.new.data, id = String(p.new.id), str = JSON.stringify(obj);
          if (sync.get(id) === str) return;
          const prevStr = sync.get(id);
          sync.set(id, str);
          if (table === 'leads') { try { notifyLeadChange(prevStr ? JSON.parse(prevStr) : null, obj); } catch (e) {} }
          setter(prev => prev.some(o => String(o.id) === id) ? prev.map(o => String(o.id) === id ? obj : o) : [obj, ...prev]);
        };
        const F = 'tenant=eq.' + TENANT;
        const mine = (p) => { const r = p.eventType === 'DELETE' ? p.old : p.new; return !r || !r.tenant || r.tenant === TENANT; };
        const ch = sb.channel('leadmaster-live-' + TENANT)
          .on('postgres_changes', { event: '*', schema: 'public', table: TBL.leads, filter: F }, p => { if (mine(p)) applyRow('leads', setLeads, p); })
          .on('postgres_changes', { event: '*', schema: 'public', table: TBL.tasks, filter: F }, p => { if (mine(p)) applyRow('tasks', setTasks, p); })
          .on('postgres_changes', { event: '*', schema: 'public', table: TBL.settings, filter: F }, p => {
            if (!mine(p)) return;

            if (key === 'categories') setCategories(value);
            else if (key === 'references') setReferences(value);
            else if (key === 'whatsapp') setWaSettings(value);

          .on('postgres_changes', { event: '*', schema: 'public', table: TBL.lead_sends, filter: F }, p => { if (mine(p)) loadSends(); })
          .on('postgres_changes', { event: '*', schema: 'public', table: TBL.profiles, filter: F }, async (p) => {

            const { data } = await sb.from(TBL.profiles).select('*');

          .subscribe();
        return () => { sb.removeChannel(ch); };
      }, [loaded]);

      const [menuOpen, setMenuOpen] = useState(false);

      // Refresh shared settings (message, links, categories) when the tab is opened/revisited and every minute
      useEffect(() => {
        if (!loaded) return;
        const apply = (key, raw) => {
          let value = raw;

          else if (key === 'references') value = normalizeStringList(raw, dummyReferences);
          else if (key === 'whatsapp') value = normalizeWaSettings(raw);
          else return;
          const str = JSON.stringify(value);
          if (synced.current[key] === str) return;
          synced.current[key] = str;
          if (key === 'categories') setCategories(value); else if (key === 'references') setReferences(value); else setWaSettings(value);

        const refresh = async () => {

      }, [loaded]);

      // ---- Pop notifications for leads assigned / edited by someone else ----
      const pushNotif = (n) => {

        playDing();
        systemNotify(n.title, n.body);
      };
      const notifyLeadChange = (prev, lead) => {
        const me = meRef.current;
        if (!me || !lead || (lead.updatedBy && lead.updatedBy === me.id)) return;
        const who = lead.updatedByName ? ' by ' + lead.updatedByName : '';
        const name = lead.name || 'A lead';
        const info = name + (lead.phone ? ' • ' + lead.phone : '');
        const status = name + (lead.conversionStatus ? ' • ' + lead.conversionStatus : '') + (lead.callStatus ? ' • ' + lead.callStatus : '');
        if (me.role !== 'admin') {
          if (lead.assignedTo !== me.id) return;
          if (!prev || prev.assignedTo !== me.id) pushNotif({ kind: 'assigned', title: '🆕 New lead assigned to you', body: info });
          else pushNotif({ kind: 'edited', title: '✏️ Lead updated' + who, body: status });
        } else if (!prev) {
          pushNotif({ kind: 'assigned', title: '🆕 New lead added' + who, body: info });
        } else {
          pushNotif({ kind: 'edited', title: '✏️ Lead updated' + who, body: status });
        }
      };
      const stampLead = (l) => ({ ...l, updatedBy: currentUser ? currentUser.id : null, updatedByName: currentUser ? currentUser.name : '', updatedAt: new Date().toISOString() });

      useEffect(() => {
        if (!loaded || APP_VERSION === 'dev') return;
        sb.auth.getUser().then(({ data }) => {
          if (!data || !data.user) return;

            user_agent: navigator.userAgent.slice(0, 300), last_seen: new Date().toISOString() }, { onConflict: 'auth_id,platform' }).then(() => {});
        });
      }, [loaded]);

      // A device running a newer version tells everyone (Supabase realtime) → others check for the update right away
      useEffect(() => {

      useEffect(() => {

      useEffect(() => {

          let notes = ''; try { notes = JSON.parse(pendingRaw || '{}').notes || ''; } catch (e) {}

          if (!notes && RELEASE_NOTES) setCongrats({ version: APP_VERSION, notes: RELEASE_NOTES });
        }
        lsSet('lm_update_pending', null); lsSet('lm_version', APP_VERSION);
        if (location.search.indexOf('lmv=') > -1) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
      }, []);

      useEffect(() => {
        if (APP_VERSION === 'dev') return;
        const skipped = (v) => lsGet('lm_skip_version') === v + '|' + new Date().toDateString();
        window.__lmUpdateHandler = (type, payload) => {
          if (type === 'update') {
            try { const info = JSON.parse(payload); if (info && info.version && cmpVer(info.version, APP_VERSION) > 0 && !skipped(info.version)) setUpdateInfo(info); } catch (e) {}
          } else if (type === 'updateError') {

          } else if (type === 'updateProgress') {
            showToast(payload, 'info');
          }

        let lastCheck = 0;
        window.__lmCheckUpdateNow = () => { lastCheck = 0; check(); };
        const check = async () => {
          if (document.hidden || Date.now() - lastCheck < 60 * 1000) return;
          lastCheck = Date.now();
          if (isNativeApp()) {
            try {
              if (window.AndroidBridge.checkForUpdateFrom) window.AndroidBridge.checkForUpdateFrom(APP_VERSION, siteUrlRef.current || DEFAULT_SITE_URL);
              else if (window.AndroidBridge.checkForUpdate) window.AndroidBridge.checkForUpdate(APP_VERSION);
            } catch (e) {}
            return;
          }
          try {
            const res = await fetch(location.pathname + '?lmcheck=' + Date.now(), { cache: 'no-store' });
            const html = await res.text();
            const m = html.match(/const APP_VERSION = '([0-9][0-9.]*)'/);
            if (!m || cmpVer(m[1], APP_VERSION) <= 0 || skipped(m[1])) return;
            setUpdateInfo({ version: m[1], notes: notesFromHtml(html) });
          } catch (e) {}
        };
        const first = setTimeout(check, 3000);
        const timer = setInterval(() => { lastCheck = 0; check(); }, 5 * 60 * 1000);
        document.addEventListener('visibilitychange', check);
        return () => { clearTimeout(first); clearInterval(timer); document.removeEventListener('visibilitychange', check); };
      }, []);

          const importedTime = importedUser.lastModified || 0;

        // Apply Valid Credentials

          const existingUserIndex = prev.findIndex(u => u.id === importedUser.id);
          if (existingUserIndex >= 0) {
            const updatedUsers = [...prev];
            updatedUsers[existingUserIndex] = importedUser;
            return updatedUsers;

          return [...prev, importedUser];

        if (importedReferences && importedReferences.length > 0) setReferences(importedReferences);

        setCurrentView('dashboard');
        showToast(`Access Card accepted! Welcome ${importedUser.name}.`, 'success');

      const handleLogout = async () => { try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {} setLoaded(false); setCurrentUser(null); setLeads([]); setTasks([]); setUsers([]); setProducts([]); TENANT = ''; if (window.NexGenShell && window.NexGenShell.logout) window.NexGenShell.logout(); };

      // Data Handlers
      const stripPw = (u) => { const { password, ...rest } = u; return rest; };
      const handleAddUser = async (user) => {
        try { await adminCall({ action: 'create', profile: stripPw(user), password: user.password }); setUsers(prev => [...prev, stripPw(user)]); showToast('User created successfully.', 'success'); }
        catch (e) { showToast('Could not create user: ' + e.message, 'error'); }
      };
      const handleUpdateUser = async (updatedUser) => {
        try { await adminCall({ action: 'update', profile: stripPw(updatedUser), password: updatedUser.password || undefined }); setUsers(prev => prev.map(u => u.id === updatedUser.id ? stripPw(updatedUser) : u)); showToast('User updated successfully.', 'success'); }
        catch (e) { showToast('Could not update user: ' + e.message, 'error'); }
      };
      const handleDeleteUser = async (id) => {
        if (id === currentUser.id) { showToast('You cannot delete your own account.', 'error'); return; }
        try { await adminCall({ action: 'delete', id }); setUsers(prev => prev.filter(u => u.id !== id)); showToast('User deleted.', 'error'); }
        catch (e) { showToast('Could not delete user: ' + e.message, 'error'); }
      };

      const handleAddLead = (newLead) => { newLead = stampLead(newLead); setLeads([newLead, ...leads]); showToast('New lead saved.', 'success'); };
      const handleUpdateLead = (updatedLead) => { updatedLead = stampLead(updatedLead); setLeads(leads.map(l => l.id === updatedLead.id ? updatedLead : l)); showToast('Lead updated.', 'success'); };
      const handleBulkUpdateLeads = (updatedLeadsArray) => {
        updatedLeadsArray = updatedLeadsArray.map(stampLead);
        setLeads(prev => {
          const newLeads = [...prev];
          updatedLeadsArray.forEach(ul => {
            const idx = newLeads.findIndex(l => l.id === ul.id);
            if (idx > -1) newLeads[idx] = ul;

          return newLeads;
        });
        showToast(`${updatedLeadsArray.length} leads assigned successfully.`, 'success');
      };
      const handleDeleteLead = (id) => { setLeads(leads.filter(l => l.id !== id)); showToast('Lead deleted.', 'error'); };
      
      // Task Handlers
      const handleAddTask = (newTask) => { setTasks([newTask, ...tasks]); showToast('New task created.', 'success'); };
      const handleUpdateTask = (updatedTask) => { setTasks(tasks.map(t => t.id === updatedTask.id ? updatedTask : t)); showToast('Task updated.', 'success'); };
      const handleDeleteTask = (id) => { setTasks(tasks.filter(t => t.id !== id)); showToast('Task deleted.', 'error'); };
      
      // Sync Logic specifically dealing with missing/deleted leads!
      const handleImportLeads = (importedLeads, importedUsers, isAdminExport = false, importedCategories = null, importedReferences = null, importedTasks = []) => {
        setLeads(prevLeads => {
          const importedLeadIds = new Set(importedLeads.map(l => l.id));
          const prevLeadIds = new Set(prevLeads.map(l => l.id)); // Track what the local device currently has
          const leadMap = new Map();

          prevLeads.forEach(l => {
            // Master Delete Synchronization: If an Admin exported this, and the local lead isn't in it, delete it locally.
            if (isAdminExport && !importedLeadIds.has(l.id)) return; 
            leadMap.set(l.id, l);
          });

          importedLeads.forEach(il => {
            // Security: Users only import leads assigned to them.
            if (currentUser.role !== 'admin' && il.assignedTo !== currentUser.id) return; 

            // ANTI-GHOST FIX: If Admin is importing a User's backup, IGNORE leads that the Admin already deleted!
            // Since users cannot create leads, any lead the user has that the admin DOESN'T have must be dead.
            if (currentUser.role === 'admin' && !isAdminExport && !prevLeadIds.has(il.id)) return;

            leadMap.set(il.id, il);
          });
          return Array.from(leadMap.values()).sort((a,b) => b.id - a.id);
        });

        if (currentUser.role === 'admin' && importedUsers && importedUsers.length > 0) {
          setUsers(prevUsers => {
            const userMap = new Map();
            const importedUserIds = new Set(importedUsers.map(u => u.id));
            
            prevUsers.forEach(u => {
              if (isAdminExport && !importedUserIds.has(u.id)) {
                 if (u.id === currentUser.id) userMap.set(u.id, u); // Prevent suicide
                 return;
              }
              userMap.set(u.id, u);

            importedUsers.forEach(iu => userMap.set(iu.id, iu));
            return Array.from(userMap.values());
          });

          const prevTaskIds = new Set(prevTasks.map(t => t.id));
          const importedTaskIds = new Set(importedTasks.map(t => t.id));

          prevTasks.forEach(t => {

            taskMap.set(it.id, it);

        showToast('System data restored & synced securely!', 'success');
        setCurrentView('leads');

          const path = imgPath(id + '/collage-' + Date.now() + '.jpg');

          if (error) return { url: '', path: '' };
          return { url: sb.storage.from(IMG_BUCKET).getPublicUrl(path).data.publicUrl, path };
        } catch (e) { return { url: '', path: '' }; }

      // Products saved before this version get their combined picture the first time the admin opens the app

        const uploaded = [];
        try {
          for (const file of draft.newFiles) {
            const blob = await compressImage(file);
            const path = imgPath(id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg');
            const { error } = await sb.storage.from(IMG_BUCKET).upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: false });
            if (error) throw new Error('Photo upload failed: ' + error.message);
            uploaded.push({ url: sb.storage.from(IMG_BUCKET).getPublicUrl(path).data.publicUrl, path });
          }
          const images = [...draft.images, ...uploaded];
          const old = products.find(x => x.id === id);
          const photosChanged = !old || draft.newFiles.length > 0 || draft.removedPaths.length > 0;
          let collage = old && !photosChanged ? { url: old.collage_url, path: old.collage_path } : { url: '', path: '' };
          if (images.length > 1 && (photosChanged || !collage.url)) collage = await uploadCollage(id, images);
          const row = { id, name: draft.name.trim(), description: draft.description.trim(), price: String(draft.price || '').trim(),
            images, active: !!draft.active, sort_order: draft.sort_order != null ? draft.sort_order : Date.now(),
            collage_url: collage.url, collage_path: collage.path };
          const { error } = await sb.from(TBL.products).upsert(row, { onConflict: ON.products });
          if (error) throw new Error(error.message);
          const stale = [...draft.removedPaths, ...(old && old.collage_path && old.collage_path !== collage.path ? [old.collage_path] : [])];
          if (stale.length) await sb.storage.from(IMG_BUCKET).remove(stale);
          setProducts(prev => sortProducts([...prev.filter(p => p.id !== id), normalizeProduct(row)]));
          showToast(draft.id ? 'Product updated.' : 'Product added.', 'success');
        } catch (err) {
          if (uploaded.length) await sb.storage.from(IMG_BUCKET).remove(uploaded.map(u => u.path));
          throw err;
        }

      const handleAddCategory = (cat) => { setCategories([...categories, cat]); showToast(`Category added.`, 'success'); };
