          <NotificationStack items={notifs} onClose={(id) => setNotifs(prev => prev.filter(x => x.id !== id))} onOpen={(n) => { setNotifs(prev => prev.filter(x => x.id !== n.id)); setCurrentView('leads'); }} />
          {updateInfo && !congrats && <UpdateModal info={updateInfo} busy={updating} onUpdate={handleUpdateNow} onLater={handleUpdateLater} />}
          {congrats && <CongratsModal version={congrats.version} notes={congrats.notes} onClose={() => setCongrats(null)} />}
          {(pull > 0 || refreshing) && (
            <div className="fixed left-1/2 z-[97] -translate-x-1/2 pointer-events-none" style={{ top: 'calc(env(safe-area-inset-top) + ' + (refreshing ? 64 : 8 + pull * 0.7) + 'px)' }}>
              <div className="w-10 h-10 rounded-full bg-white shadow-lg border border-slate-200 flex items-center justify-center">
                <svg className={'w-5 h-5 text-indigo-600 ' + (refreshing ? 'animate-spin' : '')} style={refreshing ? {} : { transform: 'rotate(' + (pull * 4) + 'deg)', opacity: Math.min(1, pull / 60) }} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
              </div>
            </div>
          )}
          {webSeq && <WebStepsBar seq={webSeq} onNext={openNextWebStep} onStop={() => setWebSeq(null)} />}
          {waStatus && <WaProgressCard status={waStatus} onStop={() => { try { window.AndroidBridge.cancelWhatsAppSequence(); } catch (e) {} setWaStatus(null); }} />}
        </>
      );

      if (!currentUser) {
        return (
          <>
            <Toast {...toast} />
            {overlays}
            <div className="min-h-screen flex items-center justify-center bg-slate-900 p-6">
              {noAccess ? (
                <div className="bg-white rounded-2xl p-6 max-w-sm text-center shadow-2xl">
                  <h2 className="text-lg font-bold text-slate-800">LeadMaster is not set up for this login</h2>
                  <p className="text-sm text-slate-500 mt-2">Ask your admin to add you as a LeadMaster user, or log in with your LeadMaster ID.</p>
                  <button onClick={handleLogout} className="mt-4 px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold">Log in with another account</button>
                </div>
              ) : (
                <div className="text-center"><div className="w-10 h-10 mx-auto rounded-full border-4 border-slate-700 border-t-indigo-400 animate-spin" /><p className="text-slate-400 text-sm mt-4">Opening LeadMaster…</p></div>
              )}
            </div>
          </>
        );
      }

      const isAdmin = currentUser.role === 'admin';

      return (
        <div className={`min-h-screen flex flex-col md:flex-row text-slate-900 ${DIWALI_THEME ? 'bg-gradient-to-br from-amber-50/70 via-slate-50 to-rose-50/60' : 'bg-slate-50'}`}>
          <Toast {...toast} />
          {overlays}
          <DiwaliLights />
          <div className="md:hidden sticky top-0 z-30 flex items-center gap-3 bg-slate-900 text-white px-4 py-3 shadow-lg" style={{ paddingTop: 'max(0.75rem, env(safe-area-inset-top))' }}>
            <button onClick={() => setMenuOpen(true)} aria-label="Open menu" className="p-2 -ml-2 rounded-lg hover:bg-slate-800">
              <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
            </button>
            <span className="font-bold tracking-tight flex-1 flex items-center gap-2 min-w-0">{brand && brand.logo && <img src={brand.logo} alt="" className="w-7 h-7 rounded-md bg-white object-contain shrink-0" />}<span className="truncate">{(brand && brand.company_name) || 'LeadMaster'}</span> <span className="text-[10px] font-medium text-slate-400 shrink-0">v{APP_VERSION}</span></span>
            <span className="text-xs text-slate-400 truncate max-w-[40%]">{currentUser.name}</span>
          </div>
          {menuOpen && <div className="fixed inset-0 bg-black/50 z-40 md:hidden" onClick={() => setMenuOpen(false)} />}
          <div className={`fixed inset-y-0 left-0 w-72 max-w-[85vw] bg-slate-900 text-slate-300 flex flex-col z-50 transition-transform duration-200 md:sticky md:top-0 md:h-screen md:w-64 md:max-w-none md:shrink-0 md:translate-x-0 ${menuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
            <div className="p-6">
              {brand && (brand.company_name || brand.logo) ? (
                <div className="flex items-center gap-3">
                  {brand.logo ? <img src={brand.logo} alt="" className="w-11 h-11 rounded-xl bg-white object-contain p-0.5 shrink-0" /> : <TrendingUp className="w-7 h-7 text-indigo-400 shrink-0" />}
                  <div className="min-w-0"><h1 className="text-lg font-bold text-white leading-tight truncate" title={brand.company_name}>{brand.company_name || 'LeadMaster'}</h1>
                  <p className="text-[11px] text-slate-400">LeadMaster · v{APP_VERSION}</p></div>
                </div>
              ) : (
                <h1 className="text-2xl font-bold text-white flex items-center tracking-tight"><TrendingUp className="w-6 h-6 mr-2 text-indigo-400" /> LeadMaster <span className="text-[10px] font-medium text-slate-400 ml-2">v{APP_VERSION}</span></h1>
              )}
              <div className="mt-4 px-3 py-2 bg-slate-800 rounded-lg border border-slate-700 flex items-center">
                 <div className="w-8 h-8 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold mr-3">{currentUser.name.charAt(0)}</div>
                 <div className="flex-1 overflow-hidden"><p className="text-sm font-medium text-white truncate">{currentUser.name}</p><p className="text-xs text-slate-400 capitalize">{currentUser.role}</p></div>
              </div>
            </div>
            
            <nav className="flex-1 px-4 space-y-2 mt-4 overflow-y-auto custom-scrollbar">
              <button onClick={() => setCurrentView('dashboard')} className={`w-full flex items-center px-4 py-3 rounded-xl transition-all duration-200 ${currentView === 'dashboard' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30' : 'hover:bg-slate-800 hover:text-white'}`}><LayoutDashboard className="w-5 h-5 mr-3" /><span className="font-medium">Dashboard</span></button>
              <button onClick={() => setCurrentView('leads')} className={`w-full flex items-center px-4 py-3 rounded-xl transition-all duration-200 ${currentView === 'leads' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30' : 'hover:bg-slate-800 hover:text-white'}`}><Users className="w-5 h-5 mr-3" /><span className="font-medium">Lead Manager</span></button>
              <button onClick={() => setCurrentView('tasks')} className={`w-full flex items-center px-4 py-3 rounded-xl transition-all duration-200 ${currentView === 'tasks' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30' : 'hover:bg-slate-800 hover:text-white'}`}><ClipboardList className="w-5 h-5 mr-3" /><span className="font-medium">Tasks</span></button>
              
              {isAdmin && (
                <>
                  <div className="pt-4 pb-1"><p className="px-4 text-xs font-bold uppercase tracking-wider text-slate-500">Admin Tools</p></div>
                  <button onClick={() => setCurrentView('users')} className={`w-full flex items-center px-4 py-3 rounded-xl transition-all duration-200 ${currentView === 'users' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30' : 'hover:bg-slate-800 hover:text-white'}`}><UserPlus className="w-5 h-5 mr-3" /><span className="font-medium">User Management</span></button>
                  <button onClick={() => setCurrentView('productivity')} className={`w-full flex items-center px-4 py-3 rounded-xl transition-all duration-200 ${currentView === 'productivity' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30' : 'hover:bg-slate-800 hover:text-white'}`}><Activity className="w-5 h-5 mr-3" /><span className="font-medium">Productivity Analytics</span></button>
                </>
              )}
              
              <div className="pt-4 pb-1"><p className="px-4 text-xs font-bold uppercase tracking-wider text-slate-500">System Tools</p></div>
              <button onClick={() => setCurrentView('backup')} className={`w-full flex items-center px-4 py-3 rounded-xl transition-all duration-200 ${currentView === 'backup' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30' : 'hover:bg-slate-800 hover:text-white'}`}><Database className="w-5 h-5 mr-3" /><span className="font-medium">Backup Data</span></button>
            </nav>

            <div className="p-4 mt-auto border-t border-slate-800 space-y-2">
              {isAdmin && <button onClick={() => setIsSettingsOpen(true)} className="w-full flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all duration-200"><Settings className="w-5 h-5 mr-3" /><span className="font-medium">Settings</span></button>}
              <button onClick={handleLogout} className="w-full flex items-center px-4 py-3 text-red-400 hover:bg-red-500/10 hover:text-red-300 rounded-xl transition-all duration-200"><LogOut className="w-5 h-5 mr-3" /><span className="font-medium">Log Out</span></button>
            </div>
            <div className="p-4 bg-slate-950/50 text-center text-xs border-t border-slate-800/60 pb-6 md:pb-4"><p className="text-slate-400">Powered By <span className="text-indigo-400 font-semibold">NexGen Softwares</span></p><p className="text-slate-500 mt-1">Vinayak Gosavi - <a href="tel:9156103714" className="hover:text-indigo-300 transition-colors">9156103714</a></p><p className="text-slate-600 mt-1">Version {APP_VERSION}</p>{installEvt && <button onClick={installApp} className="mt-2 w-full py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold">⬇ Install App on this computer</button>}</div>
          </div>

          {}
          <div className="flex-1 p-4 md:p-8 overflow-y-auto w-full custom-scrollbar">
            <DiwaliBanner name={currentUser && currentUser.name} />
            {currentView === 'dashboard' ? (
              <div className="max-w-7xl mx-auto"><div className="mb-8"><h2 className="text-2xl font-bold text-slate-800">Dashboard Overview</h2><p className="text-slate-500 mt-1">Track your campaign progress and conversion rates.</p></div><DashboardView leads={leads} currentUser={currentUser} /></div>
            ) : currentView === 'leads' ? (
              <div className="max-w-7xl mx-auto h-full"><LeadsManagerView waSettings={waSettings} products={products} sends={sends} showToast={showToast} leads={leads} categories={categories} references={references} onAdd={handleAddLead} onUpdate={handleUpdateLead} onBulkUpdate={handleBulkUpdateLeads} onDelete={handleDeleteLead} currentUser={currentUser} users={users} /></div>
            ) : currentView === 'users' && isAdmin ? (
              <div className="max-w-7xl mx-auto h-full"><UserManagementView users={users} categories={categories} references={references} onAddUser={handleAddUser} onUpdateUser={handleUpdateUser} onDeleteUser={handleDeleteUser} showToast={showToast} currentUser={currentUser} /></div>
            ) : currentView === 'tasks' ? (
              <div className="max-w-7xl mx-auto h-full"><TasksView tasks={tasks} users={users} currentUser={currentUser} onAddTask={handleAddTask} onUpdateTask={handleUpdateTask} onDeleteTask={handleDeleteTask} /></div>
            ) : currentView === 'productivity' && isAdmin ? (
              <div className="max-w-7xl mx-auto h-full"><ProductivityView tasks={tasks} users={users} /></div>
            ) : currentView === 'backup' ? (
              <div className="max-w-7xl mx-auto h-full"><BackupView leads={leads} users={users} categories={categories} references={references} tasks={tasks} onImport={handleImportLeads} showToast={showToast} currentUser={currentUser} /></div>
            ) : null}
          </div>
          {isSettingsOpen && isAdmin && (<SettingsModal categories={categories} references={references} waSettings={waSettings} onSaveWa={handleSaveWa} products={products} onSaveProduct={handleSaveProduct} onDeleteProduct={handleDeleteProduct} onToggleProduct={handleToggleProduct} onClose={() => setIsSettingsOpen(false)} onAddCategory={handleAddCategory} onDeleteCategory={handleDeleteCategory} onAddReference={handleAddReference} onDeleteReference={handleDeleteReference} />)}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(p) { super(p); this.state = { err: null }; }
      static getDerivedStateFromError(err) { return { err }; }
      render() {
        if (this.state.err) return (<div style={{ padding: 24, fontFamily: 'sans-serif' }}><h2 style={{ fontWeight: 700 }}>Something went wrong</h2><pre style={{ whiteSpace: 'pre-wrap', color: '#b91c1c', margin: '12px 0' }}>{String((this.state.err && this.state.err.message) || this.state.err)}</pre><button onClick={() => location.reload()} style={{ padding: '8px 16px', background: '#4f46e5', color: '#fff', borderRadius: 8 }}>Reload</button></div>);
        return this.props.children;
      }
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
