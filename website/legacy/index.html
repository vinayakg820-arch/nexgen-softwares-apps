<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexGen Softwares</title><meta name="theme-color" content="#1e1b4b"><link rel="icon" href="/logo/mark.svg" type="image/svg+xml">
<link rel="manifest" href="/legacy-manifest.json">
<style>html,body{margin:0;height:100%;background:#1e1b4b;display:grid;place-items:center;font-family:system-ui;color:#c7d2fe;text-align:center}
.s{width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite;margin:14px auto 0}@keyframes r{to{transform:rotate(360deg)}}</style></head>
<body><div><p>Opening NexGen Softwares…</p><div class="s"></div></div>
<script>
// Main link: Super Admin lives in /admin/, customers in /portal/, every software in its own folder (separate apps).
(function () {
  var target = '/portal/' + location.search + location.hash;
  var go = function () { location.replace(target); };
  try {
    // remove the old site-wide service worker
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { if (new URL(r.scope).pathname === '/') r.unregister(); });
      });
    }
    // give the browser a moment to read the manifest above, which shrinks the OLD installed app
    // (it covered the whole site and stopped the softwares from being installed separately)
    var oldApp = window.matchMedia && matchMedia('(display-mode: standalone)').matches;
    var first = !localStorage.getItem('ngs-legacy-fixed');
    localStorage.setItem('ngs-legacy-fixed', String(Date.now()));
    setTimeout(go, oldApp ? 2500 : (first ? 600 : 0));
  } catch (e) { go(); }
})();
</script></body></html>
