<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NexGen Softwares</title>

<style>
:root{
  --bg:#f4f5fb; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e5e7f0;
  --brand:#4f46e5; --brand2:#7c3aed; --brand-soft:#eef2ff; --side:#1e1b4b;
  --ok:#16a34a; --ok-soft:#dcfce7; --warn:#d97706; --warn-soft:#fef3c7;
  --bad:#dc2626; --bad-soft:#fee2e2; --info:#0284c7; --info-soft:#e0f2fe;
  --gray-soft:#f1f5f9; --r:14px; --sh:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- login ---------- */
.login-wrap{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 10% -10%,#c7d2fe 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#ddd6fe 0,transparent 60%),var(--bg)}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(30,27,75,.15);padding:32px 28px}
.brand{display:flex;align-items:center;gap:12px}
.brand>img{width:46px;height:46px;border-radius:12px}
.brand h1 img.wm{height:19px;width:auto;display:block;margin:0 0 3px}
.brand h1{font-size:20px;margin:0;letter-spacing:-.2px}
.brand small{color:var(--muted);font-size:12.5px}
.login-card h2{font-size:17px;margin:26px 0 4px}
.login-card p.sub{margin:0 0 18px;color:var(--muted);font-size:13.5px}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:#334155}
.field label .req{color:var(--bad)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
textarea.inp{min-height:70px;resize:vertical}
.inp-group{display:flex;gap:8px}
.inp-group .inp{flex:1;min-width:0}
.hint{font-size:12px;color:var(--muted)}
.inp::placeholder{text-transform:none;color:#94a3b8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.check input{width:17px;height:17px;accent-color:var(--brand)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer;background:var(--gray-soft);color:var(--ink);white-space:nowrap;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.wa{background:#25d366;color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.icon-btn{border:0;background:transparent;cursor:pointer;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:inherit}
.icon-btn:hover{background:rgba(0,0,0,.06)}

/* ---------- app shell ---------- */
.shell{display:flex;min-height:100%}
.side{width:240px;flex:0 0 240px;background:var(--side);color:#c7d2fe;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{padding:18px 18px 14px;color:#fff}
.side .brand>img{width:34px;height:34px;border-radius:9px}
.side .brand{gap:10px}.side .brand h1 img.wm{height:12.5px;margin:0 0 3px}
.side .brand h1{font-size:15.5px}
.side .brand small{color:#a5b4fc}
.nav{padding:8px 10px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#c7d2fe;font-weight:500;margin-bottom:2px}
.nav a i{width:18px;text-align:center}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:rgba(255,255,255,.12);color:#fff}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:10px 6px}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px}
.side-foot .who{color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none;align-items:center;gap:10px;padding:10px 12px;background:var(--side);color:#fff;position:sticky;top:0;z-index:20}
.topbar .t{font-weight:700;flex:1}
.page{padding:26px 28px 60px;max-width:1240px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-head h2{margin:0;font-size:22px;letter-spacing:-.3px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.drawer-mask{display:none}
@media(max-width:900px){
  .side{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .drawer-mask.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  .topbar{display:flex}
  .page{padding:18px 14px 70px}
}

/* ---------- cards / tables ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid #eef0f6}
.card-pad{padding:18px}
.card h3{margin:0 0 12px;font-size:15.5px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-head h3{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:18px}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px;gap:10px}.stat .ic{width:36px;height:36px;font-size:15px}.stat .v{font-size:17px}}
.stat{padding:16px 18px;display:flex;gap:14px;align-items:center}
.stat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.4px}
.stat .l{color:var(--muted);font-size:12.5px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfe}
.tbl td{padding:11px 14px;border-bottom:1px solid #f1f2f7;vertical-align:middle}
.tbl td:not(:first-child){white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#fafbff}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty i{font-size:28px;display:block;margin-bottom:8px;opacity:.5}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-active{background:var(--ok-soft);color:#15803d}
.b-trial{background:var(--info-soft);color:#0369a1}
.b-expired{background:var(--bad-soft);color:#b91c1c}
.b-cancelled{background:var(--gray-soft);color:#475569}
.b-upcoming{background:#f3e8ff;color:#7e22ce}
.b-soon{background:var(--warn-soft);color:#b45309}
.b-paid{background:var(--ok-soft);color:#15803d}
.b-pending{background:var(--warn-soft);color:#b45309}
.b-partial{background:#ffedd5;color:#c2410c}
.overdue{color:var(--bad);font-weight:700}
.model-seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.model-seg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}.model-seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.lic-box{background:var(--bg);border-radius:12px;padding:12px 12px 0;margin-bottom:12px}
.b-free{background:var(--gray-soft);color:#475569}
.b-blocked{background:var(--bad-soft);color:#b91c1c}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.app-ic{width:34px;height:34px;border-radius:9px;object-fit:cover;flex:0 0 auto;background:var(--gray-soft)}
.app-ic.sm{width:22px;height:22px;border-radius:6px}
.app-ic.lg{width:54px;height:54px;border-radius:14px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar .inp{max-width:280px}
.toolbar select.inp{width:auto}
.seg{display:inline-flex;background:var(--gray-soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---------- software cards ---------- */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.sw-card{padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.sw-card:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c,#4f46e5)}
.sw-card .top{display:flex;gap:12px;align-items:center}
.sw-card h4{margin:0;font-size:15.5px}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prices div{background:#f8fafc;border-radius:10px;padding:8px 10px}
.prices b{display:block;font-size:14.5px}
.prices span{font-size:11.5px;color:var(--muted)}
.sw-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.url{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- wizard ---------- */
.steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--gray-soft);font-size:12px}
.step.on{border-color:var(--brand);color:var(--brand)}
.step.on .n{background:var(--brand);color:#fff}
.step.done{color:var(--ok)}
.step.done .n{background:var(--ok);color:#fff}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:16px}
.pick{border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff;display:flex;gap:12px;align-items:center;transition:border .15s,background .15s}
.pick:hover{border-color:#c7d2fe}
.pick.on{border-color:var(--brand);background:var(--brand-soft)}
.pick .tick{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:11px;flex:0 0 auto}
.pick.on .tick{background:var(--brand);border-color:var(--brand)}
.item{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:#fff}
.item-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.item-head .amt{margin-left:auto;text-align:right}
.item-head .amt b{font-size:18px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
@media(max-width:560px){.plans{grid-template-columns:1fr}}
.plan{border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.plan.on{border-color:var(--brand);background:var(--brand-soft)}
.plan b{display:block}
.plan span{font-size:12.5px;color:var(--muted)}
.coupon-msg{font-size:12.5px;margin-top:6px}
.coupon-msg.good{color:var(--ok)}
.coupon-msg.bad{color:var(--bad)}
.summary{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:0 0 var(--r) var(--r)}
.summary .tot{margin-right:auto}
.summary .tot b{font-size:20px}
.cred{background:linear-gradient(135deg,#1e1b4b,#4338ca);color:#fff;border-radius:16px;padding:20px;margin-bottom:16px}
.cred .k{font-size:12px;color:#c7d2fe;text-transform:uppercase;letter-spacing:.5px}
.cred .v{font-size:18px;font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.cred .grid2>div{margin-bottom:12px}

/* ---------- detail ---------- */
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.avatar{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:0 0 auto}

/* ---------- modal / toast ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto;animation:fade .15s}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .18s}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16.5px}
.modal-body{padding:18px 20px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 32px)}
.toast{background:#0f172a;color:#fff;padding:11px 15px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:pop .2s;max-width:420px}
.toast.err{background:#b91c1c}
.toast.ok i{color:#4ade80}
.spin{width:20px;height:20px;border:3px solid rgba(79,70,229,.2);border-top-color:var(--brand);border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.loading{display:grid;place-items:center;min-height:60vh;gap:12px;color:var(--muted)}
pre.code{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:12px;overflow:auto;font-size:12.5px;line-height:1.5}
.update-bar{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:300;background:#0f172a;color:#fff;border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}

/* ---------- customer launcher ---------- */
.portal{min-height:100%;background:linear-gradient(180deg,#1e1b4b 0,#312e81 260px,var(--bg) 260px)}
.portal-head{max-width:980px;margin:0 auto;padding:22px 18px;display:flex;align-items:center;gap:12px;color:#fff}
.portal-head .brand h1{color:#fff}
.portal-head .brand small{color:#a5b4fc}
.portal-body{max-width:980px;margin:0 auto;padding:10px 18px 60px}
.hello{color:#fff;margin:6px 0 22px}
.hello h2{margin:0;font-size:24px}
.hello p{margin:4px 0 0;color:#c7d2fe}
.launch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.launch{padding:22px;display:flex;flex-direction:column;gap:14px}
.launch .top{display:flex;gap:14px;align-items:center}
.launch h4{margin:0;font-size:17px}
.launch .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px;flex-wrap:wrap}
.opening{position:fixed;inset:0;background:#1e1b4b;color:#fff;display:grid;place-items:center;text-align:center;z-index:500;padding:20px}
.opening img{width:84px;height:84px;border-radius:22px;margin-bottom:16px;background:#fff}
</style>
</head>

<div id="app"><div class="loading"><span class="spin"></span><span>Loading…</span></div></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   NexGen Softwares – Super Admin & Customer Portal
   ===================================================================== */
const APP_VERSION = '2.3.1';
const AREA = /\/admin\//.test(location.pathname) ? 'admin' : 'portal';
const SUPABASE_URL = 'https://nqqbduqqiwpaixmrweef.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eKTOE3ywBI9ye02QFVDmvg_231pdTTJ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'nexgen-portal-auth' }
});

/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const todayIST = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());
const fmtD = d => d ? String(d).slice(0, 10).split('-').reverse().join('-') : '—';
const fmtDT = d => d ? new Date(d).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000);
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const planLabel = p => ({ monthly: 'Monthly', yearly: 'Yearly', trial: 'Trial', licence: 'One-time licence', licence_rec: 'Licence + recurring', recurring: 'Recurring' }[p] || p);
const isLic = p => p === 'licence' || p === 'licence_rec' || p === 'recurring';
const everyTxt = m => +m === 1 ? 'every month' : +m === 12 ? 'every year' : `every ${m} months`;
// short line for a subscription: "Monthly × 3", "One-time licence · 12 months", "Licence ₹5,000 + ₹300 every month"
function planShort(s) {
  const m = s.meta || {};
  if (s.plan === 'trial') return 'Trial';
  if (s.plan === 'licence') return `One-time licence · ${s.periods} months`;
  if (s.plan === 'licence_rec') return `Licence ${money(m.licence_fee)} + ${money(m.recurring_amount)} ${everyTxt(m.cycle_months)}`;
  if (s.plan === 'recurring') return `Recurring ${money(m.recurring_amount)} ${everyTxt(m.cycle_months)}${+m.cycles > 1 ? ' × ' + m.cycles : ''}`;
  return planLabel(s.plan) + ' × ' + s.periods;
}
// reminders: yearly (12+ months) last 30 days · 6 months 15 days · monthly 8 days · trial 3 days
function cycleMonths(s) { const m = s.meta || {}; return s.plan === 'monthly' ? 1 : s.plan === 'yearly' ? 12 : s.plan === 'trial' ? 0 : s.plan === 'licence' ? (+m.valid_months || +s.periods) : (+m.cycle_months || 1); }
function remindDays(s) { const c = cycleMonths(s); return c >= 12 ? 30 : c >= 6 ? 15 : c >= 1 ? 8 : 3; }
const balanceOf = s => s.status === 'cancelled' ? 0 : Math.max(0, Math.round((+s.final_amount - +(s.paid_amount || 0)) * 100) / 100);
const initials = s => (String(s || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('') || '?').toUpperCase();
const digits = s => String(s || '').replace(/\D/g, '');

function toast(msg, type = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<i class="fas ${type === 'err' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), type === 'err' ? 6000 : 3200);
}
function errMsg(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/Invalid login credentials/i.test(m)) return 'Wrong ID or password';
  if (/banned/i.test(m)) return 'This account is blocked. Please contact NexGen Softwares.';
  if (/duplicate key.*coupons_code/i.test(m)) return 'This coupon code already exists';
  if (/duplicate key.*softwares_code/i.test(m)) return 'This software code already exists';
  if (/subscriptions_software_id_fkey/i.test(m)) return 'This software has subscriptions — deactivate it instead of deleting';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'No internet connection';
  return m;
}
async function run(promise) {
  const { data, error } = await promise;
  if (error) throw error;
  return data;
}
function genPassword(len = 10) {
  const U = 'ABCDEFGHJKLMNPQRSTUVWXYZ', L = 'abcdefghijkmnpqrstuvwxyz', D = '23456789', S = '@#$%&*!';
  const all = U + L + D + S, r = new Uint32Array(len);
  crypto.getRandomValues(r);
  const pick = (set, i) => set[r[i] % set.length];
  const out = [pick(U, 0), pick(L, 1), pick(D, 2), pick(S, 3)];
  for (let i = 4; i < len; i++) out.push(pick(all, i));
  for (let i = out.length - 1; i > 0; i--) { const j = r[i] % (i + 1); [out[i], out[j]] = [out[j], out[i]]; }
  return out.join('');
}
function suggestLoginId(base) {
  const w = String(base || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8) || 'NGS';
  return w + (100 + Math.floor(Math.random() * 900));
}
function copy(text) {
  navigator.clipboard?.writeText(text).then(() => toast('Copied'), () => {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); toast('Copied');
  });
}
function waLink(mobile, text) {
  let d = digits(mobile); if (d.length === 10) d = '91' + d;
  return `https://wa.me/${d}?text=${encodeURIComponent(text)}`;
}

function openModal({ title, body, foot = '', wide = false, onMount }) {
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog">
    <div class="modal-head"><h3>${title}</h3><button class="icon-btn" data-close aria-label="Close"><i class="fas fa-xmark"></i></button></div>
    <div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div>`;
  const close = () => mask.remove();
  mask.addEventListener('click', e => { if (e.target === mask || e.target.closest('[data-close]')) close(); });
  document.body.appendChild(mask);
  mask.close = close;
  onMount && onMount(mask, close);
  return mask;
}
function confirmBox(message, { okText = 'Yes', danger = false } = {}) {
  return new Promise(res => {
    const m = openModal({

    $('#cfOk', m).onclick = () => { m.close(); res(true); };
    m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) res(false); });

function subState(s) {
  const t = todayIST();
  if (s.status === 'cancelled') return 'cancelled';
  if (s.end_date < t) return 'expired';
  if (s.start_date > t) return 'upcoming';
  if (s.plan === 'trial') return 'trial';
  return 'active';
}
function stateBadge(s) {
  const st = subState(s), t = todayIST();
  const left = daysBetween(t, s.end_date);
  const lbl = { active: 'Active', trial: 'Trial', expired: 'Expired', cancelled: 'Cancelled', upcoming: 'Upcoming' }[st];
  let html = `<span class="badge b-${st}">${lbl}</span>`;
  if ((st === 'active' || st === 'trial') && left <= remindDays(s) && !renewedAfter(s)) html += ` <span class="badge b-soon">${left === 0 ? 'Ends today' : left + 'd left'}</span>`;
  return html;
}
const payBadge = p => `<span class="badge b-${p}">${{ paid: 'Paid', partial: 'Part paid', pending: 'Pending', free: 'Free' }[p] || p}</span>`;
// paid / balance cell with the promised date
function payCell(s) {
  const bal = balanceOf(s), t = todayIST();
  if (s.payment_status === 'free') return payBadge('free');
  return `${payBadge(s.payment_status)}<div class="small" style="margin-top:3px">Paid <b>${money(s.paid_amount || 0)}</b>${bal > 0 ? ` · <b style="color:var(--bad)">Due ${money(bal)}</b>${s.due_date ? `<div class="${s.due_date < t ? 'overdue' : 'muted'}">by ${fmtD(s.due_date)}${s.due_date < t ? ' (late)' : ''}</div>` : ''}` : ''}</div>`;
}
// a later subscription for the same software already continues this one
const renewedAfter = s => S.subs.some(x => x.customer_id === s.customer_id && x.software_id === s.software_id && x.status !== 'cancelled' && x.end_date > s.end_date);

/* current (latest non-cancelled) subscription for each software of a customer */
function currentSubs(customerId) {
  const map = {};
  S.subs.filter(s => s.customer_id === customerId && s.status !== 'cancelled').forEach(s => {
    const cur = map[s.software_id];
    if (!cur || s.end_date > cur.end_date) map[s.software_id] = s;
  });
  return Object.values(map);
}
function liveSubs(customerId) {
  return currentSubs(customerId).filter(s => ['active', 'trial', 'upcoming'].includes(subState(s)));
}

// read an image file → square PNG/JPEG data URL (max 512px, under ~480 KB)
function readLogo(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Choose an image file (PNG / JPG)'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 512, cv = document.createElement('canvas'); cv.width = cv.height = S;
      const ctx = cv.getContext('2d'), k = Math.min(S / img.width, S / img.height);
      const w = Math.round(img.width * k), h = Math.round(img.height * k);
      ctx.drawImage(img, (S - w) / 2, (S - h) / 2, w, h); URL.revokeObjectURL(url);
      let d = cv.toDataURL('image/png');
      if (d.length > 480000) { const c2 = document.createElement('canvas'); c2.width = c2.height = S; const x = c2.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, S, S); x.drawImage(cv, 0, 0); d = c2.toDataURL('image/jpeg', 0.85); }
      res(d);
    };
    img.onerror = () => rej(new Error('Could not read this image'));
    img.src = url;
  });
}

async function boot() {

  try {

async function enter(me) {
  S.me = me;
  if (me.role === 'super_admin' && AREA !== 'admin') { location.replace('../admin/' + location.hash); return; }
  if ((me.role === 'customer' || me.role === 'member') && AREA === 'admin') { location.replace('../portal/' + location.search + location.hash); return; }
  if (me.role === 'super_admin') {
    await loadAll();
    renderShell();
    route();
    window.NexGenShell && NexGenShell.afterLogin({ suggest: false });
  loadLive().then(drawVersionLines);
  } else if (me.role === 'customer' || me.role === 'member') {
    try { S.settings = await run(sb.from('settings').select('*').eq('id', 1).single()); } catch (_) { }
    renderCustomerPortal(me);
    window.NexGenShell && NexGenShell.guard && NexGenShell.guard();
  } else {
    await sb.auth.signOut();
    renderLogin('This login is not linked to any account. Contact NexGen Softwares.');
  }
}

        await run(sb.auth.signInWithPassword({ email: r.login_email, password: pw }));
        await claimDevice();
        const me = await run(sb.rpc('my_portal', { p_login: true }));
        toast('Password saved. Welcome!');
        await enter(me);
      } catch (ex) { stepSetup(id, st, errMsg(ex)); }
    };
  };

  // step 2b: password
  const stepPw = (id, err) => {
    $('#app').innerHTML = `<div class="login-wrap"><form class="login-card" id="loginForm" autocomplete="on">${head}
      <h2>Enter password</h2>
      <div class="field"><label>Email ID</label>
        <div class="inp-group"><input class="inp" id="lgId" autocomplete="username" value="${esc(id)}" readonly>
        <button type="button" class="btn ghost" id="lgChange">Change</button></div></div>
      <div class="field"><label>Password</label>
        <div class="inp-group"><input class="inp" id="lgPw" type="password" autocomplete="current-password" required>
        <button type="button" class="btn ghost" id="lgEye" aria-label="Show password"><i class="fas fa-eye"></i></button></div></div>
      <div id="lgErr" class="coupon-msg bad" style="margin:-4px 0 12px">${err ? esc(err) : ''}</div>
      <button class="btn primary block" id="lgBtn" type="submit"><i class="fas fa-right-to-bracket"></i> Sign in</button>
      <p class="hint" style="text-align:center;margin:14px 0 0">Forgot your password? Contact NexGen Softwares – we will let you set a new one.</p>
    </form></div>`;
    $('#lgPw').focus();
    $('#lgEye').onclick = () => { const p = $('#lgPw'); p.type = p.type === 'password' ? 'text' : 'password'; };
    $('#lgChange').onclick = () => stepId('', id);
    $('#loginForm').onsubmit = async e => {
      e.preventDefault();
      const btn = $('#lgBtn'), err = $('#lgErr');
      err.textContent = ''; busy(btn, 'Signing in…');
      try {
        const email = await run(sb.rpc('login_email_for', { p_identifier: id }));
        if (!email) throw new Error('No account found with this Email ID');
        await run(sb.auth.signInWithPassword({ email, password: $('#lgPw').value }));
        await claimDevice();
        const me = await run(sb.rpc('my_portal', { p_login: true }));
        await enter(me);
      } catch (ex) {
        err.textContent = /invalid login credentials/i.test(errMsg(ex)) ? 'Wrong Email ID or password.' : errMsg(ex);
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Sign in';
      }
    };
  };
  stepId(error, keepId);
}

function renderCustomerPortal(me) {

  const launchUrl = a => {
    const u = a.app_url || (S.settings.base_domain && a.subdomain ? `https://${a.subdomain}.${S.settings.base_domain}/` : '');
    if (!u) return '';
    try { const x = new URL(u); x.searchParams.set('ngs', c.code); return x.toString(); } catch (_) { return u; }
  };
  const usable = apps.filter(a => ['active', 'trial'].includes(a.state) && launchUrl(a));
  const wanted = new URLSearchParams(location.search).get('app');
  const support = S.settings.support_mobile;

  // auto-open: requested app, or the only software the customer has
  const auto = (wanted && usable.find(a => a.code === wanted)) || (usable.length === 1 && apps.length === 1 ? usable[0] : null);
  if (auto && !sessionStorage.getItem('ngs-stay')) {
    $('#app').innerHTML = `<div class="opening"><div><img src="${esc(iconSrc(auto.icon))}" alt=""><h2 style="margin:0 0 6px">${esc(auto.name)}</h2>

  const card = a => {

      <div class="top"><img class="app-ic lg" src="${esc(iconSrc(a.icon))}" alt=""><div><h4>${esc(a.name)}</h4><div class="muted small">${esc(a.tagline || '')}</div></div></div>
      <div class="meta"><span><span class="badge b-${esc(a.state)}">${stLbl}</span> ${esc(planLabel(a.plan))}</span>

      ${ok && a.days_left <= (a.remind_days || 8) ? `<div class="coupon-msg bad" style="margin:0"><i class="fas fa-hourglass-half"></i> <b>${a.days_left <= 0 ? 'Last day today' : a.days_left + ' day' + (a.days_left === 1 ? '' : 's') + ' left'}</b> – renew to keep using ${esc(a.name)}. Your data stays safe.</div>` : ''}
      ${a.state === 'expired' ? `<div class="small muted"><i class="fas fa-shield-halved"></i> Your data is safe – it opens again as soon as the plan is renewed.</div>` : ''}
      ${a.app_login ? `<div class="small muted">Login ID for this software: <b class="mono">${esc(a.app_login)}</b></div>` : ''}
      ${host ? `<div class="url"><i class="fas fa-link"></i> ${esc(host)}</div>` : ''}

      ${ok && url ? `<a class="btn primary block" href="${esc(url)}" target="_blank" rel="noopener"><i class="fas fa-arrow-up-right-from-square"></i> Open ${esc(a.name)}</a>`
        : ok ? `<button class="btn block" disabled>Link coming soon</button>`

      <button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.25)" id="pLogout"><i class="fas fa-right-from-bracket"></i> Logout</button></div>
    <div class="portal-body">

function changeOwnPassword() {
  const m = openModal({
    title: 'Change password',
    body: `<div class="field"><label>Current password</label><input class="inp" type="password" id="opw" autocomplete="current-password"></div>
      <div class="field"><label>New password</label><input class="inp" type="password" id="npw1" autocomplete="new-password" placeholder="Minimum 6 characters"></div>

    foot: `<button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="pwGo"><i class="fas fa-check"></i> Save</button>`
  });
  $('#pwShow', m).onchange = e => ['#opw', '#npw1', '#npw2'].forEach(q => $(q, m).type = e.target.checked ? 'text' : 'password');

  };
}

let custFilter = { q: '', sw: '', st: 'all' };
function viewCustomers(page) {
  page.innerHTML = `
  <div class="page-head"><div><h2>Customers</h2><p>${S.customers.length} registered</p></div><a class="btn primary" href="#/new"><i class="fas fa-user-plus"></i> Register customer</a></div>

      <select class="inp" id="csw"><option value="">All softwares</option>${S.softwares.map(s => `<option value="${s.id}" ${custFilter.sw === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
      <div class="seg" id="cst">${[['all', 'All'], ['live', 'Active'], ['expired', 'Expired'], ['none', 'No software'], ['blocked', 'Blocked']].map(([k, l]) => `<button data-k="${k}" class="${custFilter.st === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    </div>
    <div id="clist"></div>
  </div>`;
  const draw = () => {
    const q = custFilter.q.toLowerCase().trim();
    const rows = S.customers.filter(c => {
      const cur = currentSubs(c.id);
      if (q && ![c.name, c.company_name, c.mobile, c.customer_code, c.email, c.city].some(v => String(v || '').toLowerCase().includes(q))) return false;
      if (custFilter.sw && !cur.some(s => s.software_id === custFilter.sw)) return false;
      const live = cur.some(s => ['active', 'trial', 'upcoming'].includes(subState(s)));
      if (custFilter.st === 'live' && !live) return false;
      if (custFilter.st === 'expired' && (live || !cur.length)) return false;
      if (custFilter.st === 'none' && cur.length) return false;
      if (custFilter.st === 'blocked' && c.status !== 'blocked') return false;
      return true;
    });
    $('#clist').innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Customer</th><th>Login ID</th><th>Mobile</th><th>Softwares</th><th>Joined</th></tr></thead><tbody>
      ${rows.map(c => `<tr class="click" onclick="location.hash='#/customer/${c.id}'">
        <td><div class="row">${avatarHtml(c, 'width:36px;height:36px;font-size:13px;border-radius:10px')}<div><b>${esc(c.company_name || c.name)}</b>${c.company_name ? `<div class="small muted">${esc(c.name)}</div>` : ''}</div>${c.status === 'blocked' ? '<span class="badge b-blocked">Blocked</span>' : ''}</div></td>
        <td class="mono">${esc(c.customer_code)}</td><td>${esc(c.mobile)}</td>
        <td><div class="chips">${currentSubs(c.id).map(s => { const sw = swById(s.software_id); return `<span class="badge b-${subState(s)}" title="${esc(sw?.name)} – till ${fmtD(s.end_date)}"><img class="app-ic sm" style="width:14px;height:14px;border-radius:4px" src="${esc(iconSrc(sw?.icon))}" alt="">${esc(sw?.name?.split(' ')[0])}</span>`; }).join('') || '<span class="muted small">—</span>'}</div></td>
        <td class="small muted">${fmtD(c.created_at)}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty"><i class="fas fa-users-slash"></i>No customers found</div>`;
  };
  $('#cq').oninput = e => { custFilter.q = e.target.value; draw(); };
  $('#csw').onchange = e => { custFilter.sw = e.target.value; draw(); };
  $('#cst').onclick = e => { const b = e.target.closest('button'); if (!b) return; custFilter.st = b.dataset.k; $$('#cst button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
  draw();
}

let W = null;
function newWizard() {
  return { step: 1, cust: { name: '', mobile: '', email: '', company_name: '', city: '', address: '', gstin: '', notes: '', customer_code: '', logo: null }, password: genPassword(), ownPw: true, items: {}, created: null, createdSubs: [] };
}
function stepsBar(step) {
  const st = (n, l) => `<div class="step ${step === n ? 'on' : step > n ? 'done' : ''}"><span class="n">${step > n ? '<i class="fas fa-check"></i>' : n}</span>${l}</div>`;
  return `<div class="steps">${st(1, 'Customer details')}${st(2, 'Software selection')}${st(3, 'Login details')}</div>`;
}
function viewNewCustomer(page) {
  if (!W || W.step === 3) W = newWizard();
  if (W.step === 1) return wizStep1(page);
  if (W.step === 2) return wizStep2(page);
}
function wizStep1(page) {
  const c = W.cust;
  const f = (k, label, opt = {}) => `<div class="field"><label>${label}${opt.req ? ' <span class="req">*</span>' : ''}</label>
    ${opt.area ? `<textarea class="inp" data-k="${k}">${esc(c[k])}</textarea>` : `<input class="inp" data-k="${k}" type="${opt.type || 'text'}" value="${esc(c[k])}" ${opt.ph ? `placeholder="${esc(opt.ph)}"` : ''} ${opt.im ? `inputmode="${opt.im}"` : ''}>`}</div>`;
  page.innerHTML = `
  <div class="page-head"><div><h2>Register new customer</h2><p>Step 1 of 2 – customer details and login</p></div></div>
  ${stepsBar(1)}
  <form class="card card-pad" id="s1">
    <h3><i class="fas fa-id-card" style="color:var(--brand)"></i> Customer details</h3>
    ${logoPicker('wl', c.logo)}
    <div class="grid2">
      ${f('name', 'Full name', { req: true, ph: 'e.g. Vinayak Gaikwad' })}
      ${f('mobile', 'Mobile', { req: true, type: 'tel', im: 'tel', ph: '10-digit mobile' })}
      ${f('email', 'Email ID (customer logs in with this)', { req: true, type: 'email', ph: 'name@example.com' })}
      ${f('company_name', 'Company name', { ph: 'e.g. Charvi Computers' })}
      ${f('city', 'City')}
      ${f('gstin', 'GSTIN (optional)')}
    </div>
    ${f('address', 'Address', { area: true })}
    <h3 style="margin-top:8px"><i class="fas fa-key" style="color:var(--brand)"></i> Login for the portal</h3>
    <div class="grid2">
      <div class="field"><label>Customer ID</label>
        <div class="inp-group"><input class="inp mono" data-k="customer_code" id="codeInp" value="${esc(c.customer_code)}" placeholder="Leave blank = auto (${esc(S.settings.customer_code_prefix || 'NGS')}1001…)" style="text-transform:uppercase">
        <button type="button" class="btn ghost" id="autoId"><i class="fas fa-wand-magic-sparkles"></i> Auto</button></div>
        <span class="hint">Your reference number for this customer. Login is with the Email ID.</span></div>
      <div class="field"><label>Password</label>
        <label class="row" style="gap:8px;font-weight:600;margin:6px 0"><input type="checkbox" id="pwOwn" ${W.ownPw ? 'checked' : ''}> Customer sets their own password on first login</label>
        <div class="inp-group" id="pwBox" style="${W.ownPw ? 'display:none' : ''}"><input class="inp mono" id="pwInp" value="${esc(W.password)}">
        <button type="button" class="btn ghost" id="autoPw"><i class="fas fa-wand-magic-sparkles"></i> Auto</button></div>
        <span class="hint" id="pwHint">${W.ownPw ? 'They enter their Email ID on the login page, confirm the registered mobile number and choose a password.' : 'Minimum 6 characters. You can share it on WhatsApp at the end.'}</span></div>
    </div>
    ${f('notes', 'Internal notes (only you can see)', { area: true })}
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:6px">
      <button type="button" class="btn ghost" id="s1reset">Clear</button>
      <button class="btn primary" type="submit">Next: Select softwares <i class="fas fa-arrow-right"></i></button>
    </div>
  </form>`;
  $$('#s1 [data-k]').forEach(el => el.oninput = () => { c[el.dataset.k] = el.value; });
  bindLogoPicker(page, 'wl', d => { c.logo = d; });
  $('#pwInp').oninput = e => W.password = e.target.value;
  $('#pwOwn').onchange = e => { W.ownPw = e.target.checked; $('#pwBox').style.display = W.ownPw ? 'none' : ''; $('#pwHint').textContent = W.ownPw ? 'They enter their Email ID on the login page, confirm the registered mobile number and choose a password.' : 'Minimum 6 characters. You can share it on WhatsApp at the end.'; };
  $('#autoId').onclick = () => { c.customer_code = suggestLoginId(c.company_name || c.name); $('#codeInp').value = c.customer_code; };
  $('#autoPw').onclick = () => { W.password = genPassword(); $('#pwInp').value = W.password; };
  $('#s1reset').onclick = () => { W = newWizard(); wizStep1(page); };
  $('#s1').onsubmit = e => {
    e.preventDefault();
    if (!c.name.trim()) return toast('Enter customer name', 'err');
    if (digits(c.mobile).length < 10) return toast('Enter a valid 10-digit mobile number', 'err');
    if (!/^\S+@\S+\.\S+$/.test((c.email || '').trim())) return toast('Enter the customer\'s Email ID – they log in with it', 'err');
    if (S.customers.some(x => (x.email || '').toLowerCase() === c.email.trim().toLowerCase())) return toast('This Email ID is already registered', 'err');
    if (c.customer_code && !/^[A-Za-z0-9_-]{3,30}$/.test(c.customer_code.trim())) return toast('Login ID: only letters, numbers, - and _ (3-30)', 'err');
    if (c.customer_code && S.customers.some(x => x.customer_code === c.customer_code.trim().toUpperCase())) return toast('This Login ID is already taken', 'err');
    if (!W.ownPw && (W.password || '').length < 6) return toast('Password must be at least 6 characters', 'err');
    const dup = S.customers.find(x => digits(x.mobile).slice(-10) === digits(c.mobile).slice(-10));
    const go = () => { W.step = 2; wizStep2(page); };
    if (dup) confirmBox(`A customer with this mobile already exists: <b>${esc(dup.company_name || dup.name)}</b> (${esc(dup.customer_code)}). Register a new customer anyway?`, { okText: 'Yes, continue' }).then(ok => ok && go());
    else go();
  };
}

/* ----- software selection (shared by wizard + "add / renew" for existing customer) ----- */
// renewal of a per-flat software: start from the flats / maintenance / share % used last time
function lastMeta(it, customerId) {
  if (!it.meta || !customerId) return it;
  const prev = (S.subs || S.subscriptions || []).filter(s => s.customer_id === customerId && s.software_id === it.software_id && s.meta).sort((a, b) => (a.created_at < b.created_at ? 1 : -1))[0];
  if (prev) it.meta = { flats: prev.meta.flats || '', base: prev.meta.base || '', percent: prev.meta.percent || '' };
  return it;
}
function blankItem(sw, plan) {
  return { software_id: sw.id, plan: plan || (sw.monthly_price > 0 || sw.yearly_price === 0 ? 'monthly' : 'yearly'), periods: 1, coupon_code: '', quote: null, start_date: '', payment_status: 'paid', payment_mode: 'UPI', meta: sw.pricing_mode === 'per_flat' ? { flats: '', base: '', percent: '' } : null, payment_ref: '', app_login: '', notes: '',
    // licence models
    licence_fee: +sw.licence_price || '', recurring_amount: +sw.monthly_price || '', cycle_months: 1, cycles: 1, lic_months: 12, cover_months: 1,
    // money: full / part / none
    pay: 'full', received: '', due_date: '' };
}
// renew a licence customer: next recurring payment (or a new licence) with last time's amounts
function renewItem(sw, prev, customerId) {
  const m = prev.meta || {};
  if (prev.plan === 'licence_rec' || prev.plan === 'recurring') { const it = blankItem(sw, 'recurring'); it.recurring_amount = m.recurring_amount || it.recurring_amount; it.cycle_months = +m.cycle_months || 1; return it; }
  if (prev.plan === 'licence') { const it = blankItem(sw, 'licence'); it.licence_fee = m.licence_fee || prev.final_amount; it.lic_months = +m.valid_months || prev.periods || 12; return it; }
  return lastMeta(blankItem(sw, prev.plan === 'trial' ? 'monthly' : prev.plan), customerId);
}
const itemMonths = it => it.plan === 'licence' ? (+it.lic_months || 12) : it.plan === 'licence_rec' ? (+it.cover_months || +it.cycle_months || 1) : it.plan === 'recurring' ? (+it.cycle_months || 1) * Math.max(1, +it.cycles || 1) : 0;
// Society Connect style pricing: our share of each flat's monthly maintenance
const perFlat = sw => sw && sw.pricing_mode === 'per_flat';
const flatUnit = it => { const m = it.meta || {}; return Math.round((+m.flats || 0) * (+m.base || 0) * (+m.percent || 0)) / 100; };   // ₹ per month for the whole society
function itemPrice(it) {
  const sw = swById(it.software_id);
  if (isLic(it.plan)) { const a = it.plan === 'recurring' ? (+it.recurring_amount || 0) * Math.max(1, +it.cycles || 1) : (+it.licence_fee || 0); return { list_price: a, discount: 0, final_amount: a, extra_days: 0 }; }
  if (it.quote && it.quote.ok) return it.quote;
  const unit = it.plan === 'trial' ? 0 : perFlat(sw) ? flatUnit(it) * (it.plan === 'yearly' ? 12 : 1) : it.plan === 'monthly' ? +sw.monthly_price : +sw.yearly_price;
  const per = it.plan === 'trial' ? 1 : it.periods;
  return { list_price: unit * per, discount: 0, final_amount: unit * per, extra_days: 0 };
}
function itemDates(it, customerId) {
  const sw = swById(it.software_id), t = todayIST();
  let start = it.start_date;
  if (!start) {
    const last = customerId ? S.subs.filter(s => s.customer_id === customerId && s.software_id === sw.id && s.status === 'active').map(s => s.end_date).sort().pop() : null;
    start = last && last >= t ? addDays(last, 1) : t;
  }
  const extra = (it.quote && it.quote.ok && it.quote.extra_days) || 0;
  let end;
  if (it.plan === 'trial') end = addDays(start, Math.max(sw.trial_days, 1) - 1);
  else if (isLic(it.plan)) { const d = new Date(start + 'T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + itemMonths(it)); end = addDays(d.toISOString().slice(0, 10), -1); }
  else {
    const d = new Date(start + 'T00:00:00Z');
    if (it.plan === 'monthly') d.setUTCMonth(d.getUTCMonth() + it.periods); else d.setUTCFullYear(d.getUTCFullYear() + it.periods);
    end = addDays(d.toISOString().slice(0, 10), -1);
  }
  return { start, end: addDays(end, extra) };
}

const hasLicRec = (customerId, swId) => !!customerId && S.subs.some(s => s.customer_id === customerId && s.software_id === swId && (s.plan === 'licence_rec' || s.plan === 'recurring') && s.status !== 'cancelled');
function licFields(it, sw, dt) {
  const cyc = `<select class="inp" data-f="cycle_months">${[[1, 'Every month'], [3, 'Every 3 months'], [6, 'Every 6 months'], [12, 'Every year']].map(([v, l]) => `<option value="${v}" ${+it.cycle_months === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const num = (f, v, ph, extra = '') => `<input class="inp" type="number" min="0" step="1" data-f="${f}" value="${esc(v)}" placeholder="${ph}" ${extra}>`;
  if (it.plan === 'licence') return `<div class="lic-box"><div class="grid3">
      <div class="field"><label>Licence amount (₹) <span class="req">*</span></label>${num('licence_fee', it.licence_fee, 'e.g. 5000')}</div>
      <div class="field"><label>Valid for (months)</label>${num('lic_months', it.lic_months, '12', 'min="1" max="60"')}<span class="hint">12 = one full year</span></div></div>
    <div class="small muted" style="margin:-4px 0 12px"><i class="fas fa-circle-info"></i> One payment of <b>${money(+it.licence_fee || 0)}</b> – works till <b>${fmtD(dt.end)}</b>. After that: renew the licence or move to a subscription.</div></div>`;
  if (it.plan === 'licence_rec') return `<div class="lic-box"><div class="grid3">
      <div class="field"><label>Licence amount (₹) <span class="req">*</span></label>${num('licence_fee', it.licence_fee, 'e.g. 5000')}</div>
      <div class="field"><label>Then recurring (₹) <span class="req">*</span></label>${num('recurring_amount', it.recurring_amount, 'e.g. 300')}</div>
      <div class="field"><label>Recurring is taken</label>${cyc}</div>
      <div class="field"><label>Licence covers the first (months)</label>${num('cover_months', it.cover_months, '1', 'min="1" max="60"')}<span class="hint">1 = recurring starts from next month</span></div></div>
    <div class="small muted" style="margin:-4px 0 12px"><i class="fas fa-circle-info"></i> <b>${money(+it.licence_fee || 0)}</b> now (till ${fmtD(dt.end)}), then <b>${money(+it.recurring_amount || 0)} ${everyTxt(it.cycle_months)}</b> from <b>${fmtD(addDays(dt.end, 1))}</b> – use <b>Renew</b> each time it is paid.</div></div>`;
  return `<div class="lic-box"><div class="grid3">
      <div class="field"><label>Recurring amount (₹) <span class="req">*</span></label>${num('recurring_amount', it.recurring_amount, 'e.g. 300')}</div>
      <div class="field"><label>Taken</label>${cyc}</div>
      <div class="field"><label>How many at once</label>${num('cycles', it.cycles, '1', 'min="1" max="24"')}<span class="hint">e.g. 3 = three months together</span></div></div>
    <div class="small muted" style="margin:-4px 0 12px"><i class="fas fa-circle-info"></i> ${fmtD(dt.start)} → <b>${fmtD(dt.end)}</b> for <b>${money((+it.recurring_amount || 0) * Math.max(1, +it.cycles || 1))}</b></div></div>`;
}
function payFields(it, amount) {
  const recv = it.pay === 'full' ? amount : it.pay === 'none' ? 0 : Math.min(+it.received || 0, amount);
  return `<div class="grid3">
    <div class="field"><label>Payment</label><select class="inp" data-f="pay">
      <option value="full" ${it.pay === 'full' ? 'selected' : ''}>Full amount received</option>
      <option value="part" ${it.pay === 'part' ? 'selected' : ''}>Part payment received</option>
      <option value="none" ${it.pay === 'none' ? 'selected' : ''}>Not received yet</option></select></div>
    ${it.pay === 'part' ? `<div class="field"><label>Received now (₹)</label><input class="inp" type="number" min="1" step="1" data-f="received" value="${esc(it.received)}" placeholder="e.g. 3000"></div>` : ''}
    ${it.pay !== 'full' ? `<div class="field"><label>Balance ${money(Math.max(0, amount - recv))} – customer will pay by</label><input class="inp" type="date" data-f="due_date" value="${esc(it.due_date)}"></div>` : ''}
    ${it.pay !== 'none' ? `<div class="field"><label>Payment mode</label><select class="inp" data-f="payment_mode">${['UPI', 'Cash', 'Bank transfer', 'Cheque', 'Card', 'Other'].map(m => `<option ${it.payment_mode === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
    <div class="field"><label>Reference / UTR</label><input class="inp" data-f="payment_ref" value="${esc(it.payment_ref)}" placeholder="Optional"></div>` : ''}</div>`;
}
function selectionUI(page, { customerId, title, subtitle, items, onBack, onSubmit, submitText, showSteps, skipText, onSkip }) {
  const active = S.softwares.filter(s => s.is_active);
  const itemCard = it => {
    const sw = swById(it.software_id), p = itemPrice(it), dt = itemDates(it, customerId);
    const plan = (k, label, sub) => `<div class="plan ${it.plan === k ? 'on' : ''}" data-plan="${k}"><b>${label}</b><span>${sub}</span></div>`;
    const q = it.quote;
    return `<div class="item" data-sw="${sw.id}">
      <div class="item-head"><img class="app-ic" src="${esc(iconSrc(sw.icon))}" alt=""><div><b>${esc(sw.name)}</b><div class="small muted">${fmtD(dt.start)} → ${fmtD(dt.end)}</div></div>
        <div class="amt">${p.discount > 0 ? `<div class="small muted" style="text-decoration:line-through">${money(p.list_price)}</div>` : ''}<b>${money(p.final_amount)}</b></div></div>
      <div class="model-seg">${[['sub', 'Subscription'], ['licence_rec', 'Licence + monthly / periodic'], ['licence', 'One-time licence']].concat(it.plan === 'recurring' || hasLicRec(customerId, sw.id) ? [['recurring', 'Recurring payment']] : [])
        .map(([k, l]) => `<button type="button" data-model="${k}" class="${(k === 'sub' ? !isLic(it.plan) : it.plan === k) ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${isLic(it.plan) ? licFields(it, sw, dt) : `<div class="plans">
        ${plan('monthly', perFlat(sw) ? 'Monthly (fixed)' : 'Monthly', (perFlat(sw) ? money(flatUnit(it)) : money(sw.monthly_price)) + ' / month')}
        ${plan('yearly', perFlat(sw) ? 'Yearly (fixed)' : 'Yearly', (perFlat(sw) ? money(flatUnit(it) * 12) : money(sw.yearly_price)) + ' / year')}
        ${plan('trial', 'Trial', sw.trial_days + ' days free')}
      </div>`}
      ${perFlat(sw) && !isLic(it.plan) ? `<div class="grid3" style="background:var(--bg);border-radius:12px;padding:12px 12px 0;margin-bottom:12px">
        <div class="field"><label>Number of flats <span class="req">*</span></label><input class="inp" type="number" min="1" data-m="flats" value="${esc(it.meta.flats)}" placeholder="e.g. 48"></div>
        <div class="field"><label>Monthly maintenance per flat (₹)${it.plan !== 'trial' ? ' <span class="req">*</span>' : ''}</label><input class="inp" type="number" min="0" data-m="base" value="${esc(it.meta.base)}" placeholder="e.g. 1500"></div>
        <div class="field"><label>Our share per flat (%)${it.plan !== 'trial' ? ' <span class="req">*</span>' : ''}</label><input class="inp" type="number" min="0" max="100" step="0.1" data-m="percent" value="${esc(it.meta.percent)}" placeholder="e.g. 2"></div>
        <div class="small muted" style="grid-column:1/-1;margin:-4px 0 12px"><i class="fas fa-calculator"></i> ${+it.meta.base && +it.meta.percent ? `${money(Math.round(+it.meta.base * +it.meta.percent) / 100)} per flat per month × ${+it.meta.flats || 0} flats = <b>${money(flatUnit(it))} / month</b> · <b>${money(flatUnit(it) * 12)} / year</b>` : 'Charge = flats × maintenance × our share %. The customer is the society\'s main member; they add the committee and flats themselves.'}</div>
      </div>` : ''}
      <div class="grid3">
        ${it.plan !== 'trial' && !isLic(it.plan) ? `<div class="field"><label>Number of ${it.plan === 'monthly' ? 'months' : 'years'}</label><input class="inp" type="number" min="1" max="60" data-f="periods" value="${it.periods}"></div>` : ''}
        ${isLic(it.plan) ? '' : `<div class="field"><label>Coupon code</label><div class="inp-group"><input class="inp mono" data-f="coupon_code" value="${esc(it.coupon_code)}" placeholder="Optional" style="text-transform:uppercase"><button type="button" class="btn ghost" data-act="apply">Apply</button></div>
          ${q ? `<div class="coupon-msg ${q.ok ? 'good' : 'bad'}">${q.ok ? `<i class="fas fa-check"></i> ${esc(q.coupon_code)} applied${q.discount > 0 ? ' – you save ' + money(q.discount) : ''}${q.extra_days ? ' – +' + q.extra_days + ' extra days' : ''}` : `<i class="fas fa-xmark"></i> ${esc(q.error)}`}</div>` : ''}</div>`}
        <div class="field"><label>Start date</label><input class="inp" type="date" data-f="start_date" value="${esc(it.start_date || dt.start)}"></div>
      </div>
      ${it.plan !== 'trial' && p.final_amount > 0 ? payFields(it, p.final_amount) : ''}
      <div class="grid2">
        <div class="field"><label>Login ID inside this software (optional)</label><input class="inp" data-f="app_login" value="${esc(it.app_login)}" placeholder="Shown to the customer in the portal"></div>
        <div class="field"><label>Note</label><input class="inp" data-f="notes" value="${esc(it.notes)}" placeholder="Optional"></div>
      </div>
    </div>`;
  };
  const draw = () => {
    const sel = Object.values(items);
    const total = sel.reduce((a, it) => a + itemPrice(it).final_amount, 0);
    page.innerHTML = `
    <div class="page-head"><div><h2>${title}</h2><p>${subtitle}</p></div></div>
    ${showSteps ? stepsBar(2) : ''}
    <div class="card">
      <div class="card-pad">
        <h3><i class="fas fa-layer-group" style="color:var(--brand)"></i> Select softwares</h3>
        ${active.length ? `<div class="pick-grid">${active.map(sw => `<div class="pick ${items[sw.id] ? 'on' : ''}" data-pick="${sw.id}"><img class="app-ic" src="${esc(iconSrc(sw.icon))}" alt=""><div><b>${esc(sw.name)}</b><div class="small muted">${money(sw.monthly_price)}/m · ${money(sw.yearly_price)}/y</div></div><span class="tick"><i class="fas fa-check"></i></span></div>`).join('')}</div>`
        : `<div class="empty">No active software. <a href="#/softwares">Add a software</a> first.</div>`}
        ${sel.map(itemCard).join('')}
      </div>
      <div class="summary">
        <div class="tot"><span class="muted small">${sel.length} software${sel.length === 1 ? '' : 's'} selected · Total</span><br><b>${money(total)}</b></div>
        ${onBack ? `<button class="btn ghost" id="selBack"><i class="fas fa-arrow-left"></i> Back</button>` : ''}
        ${onSkip ? `<button class="btn ghost" id="selSkip">${skipText}</button>` : ''}
        <button class="btn primary" id="selGo" ${sel.length ? '' : 'disabled'}><i class="fas fa-check"></i> ${submitText}</button>
      </div>
    </div>`;
    bind();
  };
  const requote = async (it, silent) => {
    const code = (it.coupon_code || '').trim();
    if (!code) { it.quote = null; return; }
    try { it.quote = await run(sb.rpc('quote_subscription', { p_software_id: it.software_id, p_plan: it.plan, p_periods: it.plan === 'trial' ? 1 : it.periods, p_coupon: code, p_meta: it.meta || null })); }
    catch (e) { it.quote = { ok: false, error: errMsg(e) }; }
    if (!silent && it.quote && !it.quote.ok) toast(it.quote.error, 'err');
  };
  const bind = () => {
    $$('[data-pick]', page).forEach(el => el.onclick = () => {
      const id = el.dataset.pick;
      if (items[id]) delete items[id]; else items[id] = lastMeta(blankItem(swById(id)), customerId);
      draw();
    });
    $$('.item', page).forEach(card => {
      const it = items[card.dataset.sw];
      $$('[data-plan]', card).forEach(p => p.onclick = async () => { it.plan = p.dataset.plan; it.start_date = ''; await requote(it, true); draw(); });
      $$('[data-model]', card).forEach(b => b.onclick = async () => {
        const k = b.dataset.model, sw = swById(it.software_id);
        it.plan = k === 'sub' ? (sw.monthly_price > 0 || sw.yearly_price === 0 ? 'monthly' : 'yearly') : k;
        if (k === 'licence_rec' && !(+it.cover_months)) it.cover_months = it.cycle_months || 1;
        it.coupon_code = ''; it.quote = null; it.start_date = ''; draw();
      });
      $$('[data-f]', card).forEach(inp => {
        const f = inp.dataset.f;
        const ev = (f === 'periods' || f === 'start_date' || inp.tagName === 'SELECT' || inp.type === 'number' || inp.type === 'date') ? 'onchange' : 'oninput';
        inp[ev] = async () => {
          let v = inp.value;
          if (f === 'periods') v = Math.max(1, Math.min(60, parseInt(v) || 1));
          if (f === 'lic_months' || f === 'cover_months') v = Math.max(1, Math.min(60, parseInt(v) || 1));
          if (f === 'cycles') v = Math.max(1, Math.min(24, parseInt(v) || 1));
          if (f === 'cycle_months') { v = +v; if (it.plan === 'licence_rec' && +it.cover_months === +it.cycle_months) it.cover_months = v; }
          if (f === 'coupon_code') { v = v.toUpperCase(); it.quote = null; }
          it[f] = v;
          if (f === 'start_date' && v === itemDates({ ...it, start_date: '' }, customerId).start) it.start_date = '';
          if (f === 'periods') await requote(it, true);
          if (f !== 'coupon_code' && f !== 'payment_ref' && f !== 'app_login' && f !== 'notes') draw();
        };
      });
      $$('[data-m]', card).forEach(inp => inp.onchange = async () => { it.meta[inp.dataset.m] = inp.value; await requote(it, true); draw(); });
      const ap = $('[data-act=apply]', card);
      if (ap) ap.onclick = async () => { ap.disabled = true; await requote(it); if (it.quote?.ok) toast('Coupon applied'); draw(); };
    });
    if (onBack) $('#selBack').onclick = onBack;
    if (onSkip) $('#selSkip').onclick = onSkip;
    $('#selGo').onclick = async () => {
      const sel = Object.values(items);
      for (const it of sel) if (perFlat(swById(it.software_id))) {
        const m = it.meta || {}, nm = swById(it.software_id).name;
        if (!(+m.flats >= 1)) return toast(nm + ': enter the number of flats', 'err');
        if (it.plan !== 'trial' && !(+m.base > 0)) return toast(nm + ': enter the monthly maintenance per flat', 'err');
        if (it.plan !== 'trial' && !(+m.percent > 0 && +m.percent <= 100)) return toast(nm + ': enter our share % per flat', 'err');
      }
      for (const it of sel) {
        const nm = swById(it.software_id).name, amt = itemPrice(it).final_amount;
        if ((it.plan === 'licence' || it.plan === 'licence_rec') && !(+it.licence_fee > 0)) return toast(nm + ': enter the licence amount', 'err');
        if ((it.plan === 'licence_rec' || it.plan === 'recurring') && !(+it.recurring_amount > 0)) return toast(nm + ': enter the recurring amount', 'err');
        if (it.plan !== 'trial' && amt > 0 && it.pay === 'part' && !(+it.received > 0 && +it.received < amt)) return toast(nm + ': part payment must be more than 0 and less than ' + money(amt), 'err');
      }
      for (const it of sel) if ((it.coupon_code || '').trim() && !(it.quote && it.quote.ok)) {
        await requote(it, true);
        if (!it.quote.ok) { draw(); return toast(swById(it.software_id).name + ': ' + it.quote.error, 'err'); }
      }
      const btn = $('#selGo'); btn.disabled = true; btn.innerHTML = '<span class="spin" style="width:16px;height:16px;border-width:2px"></span> Saving…';
      try {
        await onSubmit(sel.map(it => {
          const amt = itemPrice(it).final_amount;
          const o = { ...it, coupon_code: isLic(it.plan) ? null : (it.coupon_code || '').trim() || null, start_date: it.start_date || null, quote: undefined,
            received: it.plan === 'trial' || amt <= 0 ? 0 : it.pay === 'full' ? amt : it.pay === 'none' ? 0 : +it.received || 0,
            due_date: it.pay !== 'full' ? it.due_date || null : null };
          if (it.plan === 'licence') o.periods = +it.lic_months || 12;
          if (it.plan === 'licence_rec') o.periods = +it.cover_months || +it.cycle_months || 1;
          return o;
        }));
      }
      catch (e) { toast(errMsg(e), 'err'); btn.disabled = false; btn.innerHTML = `<i class="fas fa-check"></i> ${submitText}`; }
    };
  };
  draw();
}

function wizStep2(page) {
  selectionUI(page, {
    customerId: null, title: 'Register new customer', subtitle: `Step 2 of 2 – softwares for <b>${esc(W.cust.company_name || W.cust.name)}</b>`,
    items: W.items, showSteps: true, submitText: 'Register customer',
    onBack: () => { W.step = 1; wizStep1(page); },
    skipText: 'Register without software', onSkip: () => finishWizard(page, []),
    onSubmit: list => finishWizard(page, list)
  });
}
async function finishWizard(page, list) {
  try {
    if (!W.created) {
      const p = { ...W.cust, customer_code: W.cust.customer_code.trim().toUpperCase() };
      W.created = await run(sb.rpc('admin_create_customer', { p, p_password: W.ownPw ? null : W.password }));
    }
    if (list.length) W.createdSubs = await run(sb.rpc('admin_add_subscriptions', { p_customer_id: W.created.id, p_items: list }));
  } catch (e) {
    toast(errMsg(e), 'err');
    if (W.created) {   // customer saved but software step failed → let admin retry from the customer page
      await loadAll(); const id = W.created.id; W = null;
      toast('Customer was saved. Add the softwares again from the customer page.', 'err');
      location.hash = '#/add/' + id;
    } else { await loadAll(); wizStep2(page); }
    return;
  }
  await loadAll();
  W.step = 3;
  const createdCust = custById(W.created.id) || W.created;
  showCredentials(page, createdCust, W.ownPw ? '' : W.password, W.createdSubs, true);
  if (W.createdSubs && W.createdSubs.length) activatedPopup(createdCust, W.createdSubs);
}

function credentialsText(c, password, subs) {
  const lines = [`Welcome to ${S.settings.company_name || 'NexGen Softwares'}!`, '', `Name: ${c.name}`];

  }
  lines.push('', 'You can also log in with your mobile number.');
  return lines.join('\n');
}

// Delete: choose Block (keep everything) or Delete permanently (type the Customer ID). Use permanent delete for demo / test customers.
function deleteCustomer(c) {
  const subs = S.subs.filter(s => s.customer_id === c.id), pays = S.payments.filter(p => p.customer_id === c.id);
  const m = openModal({
    title: 'Delete customer?',
    body: `<p style="margin-top:0"><b>${esc(c.company_name || c.name)}</b> (${esc(c.customer_code)}) · ${subs.length} subscription${subs.length === 1 ? '' : 's'} · ${money(pays.reduce((a, p) => a + +p.amount, 0))} received</p>
      <div class="card card-pad" style="margin-bottom:12px;border:2px solid var(--line)">
        <b><i class="fas fa-ban" style="color:var(--warn)"></i> Keep – Block the customer</b>
        <p class="small muted" style="margin:4px 0 10px">They cannot log in. All data, subscriptions and payments stay. You can unblock later.</p>
        <button class="btn ghost" id="dlBlock" ${c.status === 'blocked' ? 'disabled' : ''}>${c.status === 'blocked' ? 'Already blocked' : 'Block instead'}</button></div>
      <div class="card card-pad" style="border:2px solid #fecaca;background:#fff7f7">
        <b><i class="fas fa-trash" style="color:var(--bad)"></i> Delete permanently</b>
        <p class="small muted" style="margin:4px 0 10px">Removes the login, team logins, subscriptions, payments and <b>all data inside their softwares</b>. It also leaves your customer count and revenue. Cannot be undone – best for demo / test customers.</p>
        <div class="field" style="margin-bottom:10px"><label>Type the Customer ID <b class="mono">${esc(c.customer_code)}</b> to confirm</label><input class="inp mono" id="dlCode" autocomplete="off" style="text-transform:uppercase"></div>
        <button class="btn danger" id="dlGo" disabled><i class="fas fa-trash"></i> Delete permanently</button></div>`,
    foot: `<button class="btn ghost" data-close>Cancel</button>`
  });
  $('#dlCode', m).oninput = e => { $('#dlGo', m).disabled = e.target.value.trim().toUpperCase() !== String(c.customer_code).toUpperCase(); };
  $('#dlBlock', m).onclick = async () => {
    try { await run(sb.rpc('admin_set_customer_status', { p_customer_id: c.id, p_status: 'blocked' })); m.close(); toast('Customer blocked – data kept'); refresh(); } catch (e) { toast(errMsg(e), 'err'); }
  };
  $('#dlGo', m).onclick = async () => {
    const btn = $('#dlGo', m); btn.disabled = true;
    try {
      await run(sb.rpc('admin_delete_customer', { p_customer_id: c.id, p_force: true, p_confirm: $('#dlCode', m).value.trim() }));
      m.close(); toast('Customer deleted permanently'); await loadAll(); location.hash = '#/customers';
    } catch (e) { btn.disabled = false; toast(errMsg(e), 'err'); }
  };
}
async function editCustomer(c) {
  let logo = null, logoChanged = false;
  if (c.has_logo) { try { logo = (await run(sb.from('customers').select('logo').eq('id', c.id).single())).logo; } catch (_) { } }
  const f = (k, l, t = 'text') => `<div class="field"><label>${l}</label><input class="inp" name="${k}" type="${t}" value="${esc(c[k] || '')}"></div>`;
  const m = openModal({
    title: 'Edit customer', wide: true,
    body: `<form id="ecf">${logoPicker('el', logo)}<div class="grid2">${f('name', 'Full name *')}${f('mobile', 'Mobile *', 'tel')}${f('email', 'Email', 'email')}${f('company_name', 'Company name')}${f('city', 'City')}${f('gstin', 'GSTIN')}</div>
      <div class="field"><label>Address</label><textarea class="inp" name="address">${esc(c.address || '')}</textarea></div>
      <div class="field"><label>Internal notes</label><textarea class="inp" name="notes">${esc(c.notes || '')}</textarea></div>
      <p class="hint">Login ID (${esc(c.customer_code)}) cannot be changed.</p></form>`,
    foot: `<button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="ecSave">Save</button>`
  });
  bindLogoPicker(m, 'el', d => { logo = d; logoChanged = true; });
  $('#ecSave', m).onclick = async () => {
    const d = Object.fromEntries(new FormData($('#ecf', m)));
    delete d[''];
    if (!d.name.trim() || digits(d.mobile).length < 10) return toast('Name and a valid mobile are required', 'err');
    Object.keys(d).forEach(k => { d[k] = d[k].trim() || null; });
    if (d.gstin) d.gstin = d.gstin.toUpperCase();
    if (logoChanged) d.logo = logo;
    try {
      await run(sb.from('customers').update(d).eq('id', c.id)); m.close(); toast('Saved');
      refresh();
    } catch (e) { toast(errMsg(e), 'err'); }
  };
}
function pwStatus(c) {
  if (c.setup_fails >= 5 && !c.password_set_at) return '<span class="badge b-blocked">Locked – 5 wrong tries</span> <span class="small muted">press “Let customer set new password”</span>';
  if (!c.password_set_at) return '<span class="badge b-pending">Not set yet</span> <span class="small muted">waiting for the customer\'s first login</span>';
  return `<span class="badge b-active">Set by ${c.password_set_by === 'customer' ? 'customer' : 'you'}</span> <span class="small muted">${fmtDT(c.password_set_at)}</span>`;
}
function resetPassword(c) {
  let pw = genPassword();
  const m = openModal({

function markPaid(s) { return receivePayment(s); }
function receivePayment(s) {
  const sw = swById(s.software_id), c = custById(s.customer_id), bal = balanceOf(s);
  const m = openModal({
    title: 'Receive payment',
    body: `<p style="margin-top:0"><b>${esc(c?.company_name || c?.name)}</b> · ${esc(sw?.name)} – ${esc(planShort(s))}<br>
        <span class="small muted">Total ${money(s.final_amount)} · received ${money(s.paid_amount || 0)} · <b style="color:var(--bad)">balance ${money(bal)}</b></span></p>
      <div class="grid2"><div class="field"><label>Amount received now (₹)</label><input class="inp" type="number" min="1" max="${bal}" step="1" id="rpAmt" value="${bal}"></div>
      <div class="field"><label>Date</label><input class="inp" type="date" id="rpDate" value="${todayIST()}"></div>
      <div class="field"><label>Payment mode</label><select class="inp" id="pm">${['UPI', 'Cash', 'Bank transfer', 'Cheque', 'Card', 'Other'].map(x => `<option ${s.payment_mode === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label>Reference / UTR</label><input class="inp" id="pr" placeholder="Optional"></div></div>
      <div class="field" id="rpDueBox" style="display:none"><label>Remaining <span id="rpRest"></span> – customer will pay by</label><input class="inp" type="date" id="rpDue" value="${esc(s.due_date || '')}"></div>`,
    foot: `<button class="btn ghost" data-close>Cancel</button><button class="btn ok" id="pmSave"><i class="fas fa-check"></i> Save payment</button>`
  });
  const upd = () => { const a = +$('#rpAmt', m).value || 0, rest = Math.max(0, bal - a); $('#rpDueBox', m).style.display = rest > 0 ? '' : 'none'; $('#rpRest', m).textContent = money(rest); };
  $('#rpAmt', m).oninput = upd; upd();
  $('#pmSave', m).onclick = async () => {
    const a = +$('#rpAmt', m).value || 0;
    if (a <= 0 || a > bal) return toast('Amount must be between ₹1 and ' + money(bal), 'err');
    try {
      await run(sb.rpc('admin_record_payment', { p_subscription_id: s.id, p_amount: a, p_mode: $('#pm', m).value, p_ref: $('#pr', m).value.trim() || null,
        p_paid_on: $('#rpDate', m).value || null, p_next_due: $('#rpDue', m).value || null }));
      m.close(); await refresh();
      const fresh = S.subs.find(x => x.id === s.id) || s;
      if (balanceOf(fresh) > 0) toast(`${money(a)} received · balance ${money(balanceOf(fresh))}`);
      else activatedPopup(custById(s.customer_id), [fresh], { title: 'Payment received · Fully paid' });
    } catch (e) { toast(errMsg(e), 'err'); }
  };
}
function editSub(s) {
  const sw = swById(s.software_id);
  const m = openModal({
    title: 'Edit subscription – ' + esc(sw?.name), wide: true,
    body: `<div class="grid3">

    foot: `<button class="btn danger" id="esDel" style="margin-right:auto"><i class="fas fa-trash"></i> Delete</button><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="esSave">Save</button>`
  });

let subFilter = { q: '', sw: '', st: 'live' };
function viewSubscriptions(page) {
  page.innerHTML = `
  <div class="page-head"><div><h2>Subscriptions</h2><p>Every plan, trial and renewal</p></div></div>
  <div class="card">
    <div class="toolbar">
      <input class="inp" id="sq" placeholder="Search customer…" value="${esc(subFilter.q)}">
      <select class="inp" id="ssw"><option value="">All softwares</option>${S.softwares.map(s => `<option value="${s.id}" ${subFilter.sw === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
      <div class="seg" id="sst">${[['live', 'Active'], ['trial', 'Trials'], ['soon', 'Renewal due'], ['expired', 'Expired'], ['pending', 'Balance due'], ['all', 'All']].map(([k, l]) => `<button data-k="${k}" class="${subFilter.st === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    </div><div id="slist"></div></div>`;
  const draw = () => {
    const t = todayIST(), q = subFilter.q.toLowerCase().trim();
    const latestIds = new Set(S.customers.flatMap(c => currentSubs(c.id)).map(s => s.id));
    let rows = S.subs.filter(s => {
      const c = custById(s.customer_id), st = subState(s);
      if (q && ![c?.name, c?.company_name, c?.mobile, c?.customer_code].some(v => String(v || '').toLowerCase().includes(q))) return false;
      if (subFilter.sw && s.software_id !== subFilter.sw) return false;
      switch (subFilter.st) {
        case 'live': return st === 'active' || st === 'trial' || st === 'upcoming';
        case 'trial': return st === 'trial';
        case 'soon': return (st === 'active' || st === 'trial') && daysBetween(t, s.end_date) <= remindDays(s) && latestIds.has(s.id);
        case 'expired': return st === 'expired' && latestIds.has(s.id);
        case 'pending': return balanceOf(s) > 0;
      }
      return true;
    }).sort((a, b) => a.end_date.localeCompare(b.end_date));
    const total = rows.reduce((a, s) => a + +s.final_amount, 0), totBal = rows.reduce((a, s) => a + balanceOf(s), 0);
    $('#slist').innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Customer</th><th>Software</th><th>Plan</th><th>Valid</th><th>Amount</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody>
      ${rows.map(s => { const c = custById(s.customer_id), sw = swById(s.software_id); return `<tr>
        <td><a href="#/customer/${s.customer_id}"><b>${esc(c?.company_name || c?.name)}</b></a><div class="small muted mono">${esc(c?.customer_code)}</div></td>
        <td><div class="row"><img class="app-ic sm" src="${esc(iconSrc(sw?.icon))}" alt="">${esc(sw?.name)}</div></td>
        <td>${esc(planShort(s))}${s.coupon_code ? `<div class="small muted"><i class="fas fa-ticket"></i> ${esc(s.coupon_code)}</div>` : ''}</td>
        <td class="small">${fmtD(s.start_date)} →<br>${fmtD(s.end_date)}</td><td><b>${money(s.final_amount)}</b></td><td>${payCell(s)}</td><td>${stateBadge(s)}</td>
        <td style="white-space:nowrap;text-align:right">${balanceOf(s) > 0 ? `<button class="btn sm ok" data-paid="${s.id}">Receive</button> ` : ''}<button class="btn sm primary" data-renew="${s.id}" title="Renew"><i class="fas fa-rotate"></i></button> <button class="btn sm ghost" data-edit="${s.id}" title="Edit"><i class="fas fa-pen"></i></button></td></tr>`; }).join('')}
      </tbody></table></div><div class="toolbar" style="border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end"><span class="muted">${rows.length} entries · Total <b>${money(total)}</b>${totBal ? ` · Balance <b style="color:var(--bad)">${money(totBal)}</b>` : ''}</span></div>`
      : `<div class="empty"><i class="fas fa-inbox"></i>Nothing here</div>`;
    $$('[data-paid]').forEach(b => b.onclick = () => markPaid(S.subs.find(s => s.id === b.dataset.paid)));
    $$('[data-edit]').forEach(b => b.onclick = () => editSub(S.subs.find(s => s.id === b.dataset.edit)));
    $$('[data-renew]').forEach(b => b.onclick = () => { const s = S.subs.find(x => x.id === b.dataset.renew); viewAddSoftware(s.customer_id, s); });
  };
  $('#sq').oninput = e => { subFilter.q = e.target.value; draw(); };
  $('#ssw').onchange = e => { subFilter.sw = e.target.value; draw(); };
  $('#sst').onclick = e => { const b = e.target.closest('button'); if (!b) return; subFilter.st = b.dataset.k; $$('#sst button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
  draw();
}

}
function viewCoupons(page) {

  page.innerHTML = `
  <div class="page-head"><div><h2>Coupons</h2><p>Discounts for monthly / yearly plans, and extra days for trials</p></div><button class="btn primary" id="addCp"><i class="fas fa-plus"></i> Create coupon</button></div>

      <td class="small">${c.plans.map(planLabel).join(', ')}</td>

        <div class="field"><label>Max uses</label><input class="inp" type="number" min="1" name="max_uses" value="${esc(d.max_uses || '')}" placeholder="Unlimited"></div>
      </div>

    foot: `${isNew ? '' : '<button class="btn danger" id="cpDel" style="margin-right:auto"><i class="fas fa-trash"></i></button>'}<button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="cpSave">Save coupon</button>`
  });

  form.discount_type.onchange = () => { lbl(); if (form.discount_type.value === 'extra_days') { form.plan_trial.checked = true; } };
  lbl();

  if (isNew) $('#cpAuto', m).onclick = () => { form.code.value = 'NGS' + Math.random().toString(36).slice(2, 8).toUpperCase(); };

    };

    if (row.valid_from && row.valid_until && row.valid_until < row.valid_from) return toast('“Valid until” is before “Valid from”', 'err');

}

        <p class="small muted" style="margin:0">The panel will restart in a few seconds. Nothing you saved is lost.</p></div>`,
    foot: `<button class="btn ghost" id="updLater">Later</button><button class="btn primary" id="updNow"><i class="fas fa-rotate"></i> Update now</button>`

}
