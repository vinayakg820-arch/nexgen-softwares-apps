    ${(u.apps || []).map(a => `<div class="row" style="align-items:flex-start;gap:12px;margin-top:14px">
      <img class="app-ic" src="${esc(appIcon(a.code))}" alt="">
      <div style="flex:1;min-width:0"><b>${esc(a.name)}</b> ${a.to ? `<span class="small" style="white-space:nowrap">${a.from && a.from !== a.to ? `v${esc(a.from)} → ` : ''}<b style="color:var(--brand)">v${esc(a.to)}</b></span>` : ''}
        <ul class="small" style="margin:6px 0 0;padding-left:18px">${(a.notes || []).map(n => `<li>${esc(n)}</li>`).join('')}</ul></div></div>`).join('')}
    ${(u.apk || []).length ? `<p class="small" style="margin:12px 0 0"><i class="fab fa-android" style="color:var(--ok)"></i> ${u.apk.map(esc).join('<br>')}</p>` : ''}
    ${u.how ? `<p class="small muted" style="margin:10px 0 0"><i class="fas fa-circle-info"></i> <b>How it updates:</b> ${esc(u.how)}</p>` : ''}
  </div>`;
}
// a new ZIP was uploaded since this browser last looked: say which software changed
async function siteNews() {
  if (S.me?.role !== 'super_admin' || !LIVE.site || LIVE.portal !== APP_VERSION || $('.modal-mask')) return;   // only for Super Admin; the panel's own update comes first
  const seen = localStorage.getItem(SEEN_SITE);
  if (seen && vcmp(LIVE.site, seen) <= 0) return;
  const h = await loadHistory();
  const fresh = h.filter(u => vcmp(u.site, LIVE.site) <= 0 && (!seen || vcmp(u.site, seen) > 0)).slice(0, seen ? 10 : 1);
  localStorage.setItem(SEEN_SITE, LIVE.site);
  if (!fresh.length) return;
  const m = openModal({ title: `<i class="fas fa-bullhorn" style="color:var(--brand)"></i> New update uploaded · Website v${esc(LIVE.site)}`,
    body: fresh.map(u => updCard(u)).join(''),
    foot: `<button class="btn ghost" id="updHist">See all updates</button><button class="btn primary" data-close>OK</button>` });
  $('#updHist', m).onclick = () => { m.close(); location.hash = '#/updates'; };
}
async function viewUpdates(page) {
  page.innerHTML = `<div class="page-head"><div><h2>Updates</h2><p>What changed in every website ZIP, for which software, and how it reaches the users</p></div></div><div class="empty"><span class="spin"></span></div>`;
  await loadLive(); const h = await loadHistory();
  const live = S.softwares.slice().sort((a, b) => a.sort_order - b.sort_order).map(sw => `<tr><td><div class="row" style="gap:10px"><img class="app-ic" src="${esc(iconSrc(sw.icon))}" alt=""><b>${esc(sw.name)}</b></div></td><td class="mono"><b>v${esc(LIVE[sw.code] || sw.version || '—')}</b></td></tr>`).join('');
  page.innerHTML = `<div class="page-head"><div><h2>Updates</h2><p>What changed in every website ZIP, for which software, and how it reaches the users</p></div></div>
    <div class="card card-pad" style="margin-bottom:16px"><h3 style="margin-top:0">Live now</h3>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Software</th><th>Version</th></tr></thead><tbody>
      <tr><td><div class="row" style="gap:10px"><img class="app-ic" src="../logo/mark.svg" alt=""><b>NexGen Super Admin</b></div></td><td class="mono"><b>v${esc(LIVE.portal || APP_VERSION)}</b></td></tr>${live}
      <tr><td><b>Website ZIP</b> <span class="small muted">(the file uploaded to EdgeOne)</span></td><td class="mono"><b>v${esc(LIVE.site || '—')}</b></td></tr></tbody></table></div></div>
    <h3>History</h3>${h.length ? h.map(u => updCard(u)).join('') : '<div class="card empty">No update history yet.</div>'}`;
}
// clears only the portal's own old copy, refreshes it from the website and restarts
async function doUpdate(latest) {
  const ov = document.createElement('div');
  ov.className = 'opening';
  ov.innerHTML = `<div><img src="../logo/mark.svg" alt=""><h2 style="margin:0 0 6px">Updating to v${esc(latest || '')}</h2><p style="color:#c7d2fe;margin:0 0 18px">Please wait, the panel will restart…</p><span class="spin" style="border-color:rgba(255,255,255,.25);border-top-color:#fff"></span></div>`;
  document.body.appendChild(ov);
  sessionStorage.setItem(UPD_DONE, JSON.stringify({ from: APP_VERSION, to: latest }));
  localStorage.removeItem(UPD_LATER);
  try {
    const root = new URL('./', location.href);
    const regs = (await navigator.serviceWorker?.getRegistrations()) || [];
    for (const r of regs) if (new URL(r.scope).pathname === root.pathname) await r.unregister();     // portal's own worker only
    for (const k of await caches.keys()) if (k.startsWith('nexgen-' + AREA + '-')) await caches.delete(k);
    await Promise.all(['./', 'index.html', '../nexgen-app.js', 'sw.js', 'manifest.json', '../versions.json']
      .map(u => fetch(u, { cache: 'reload' }).catch(() => { })));
  } catch (_) { }
  setTimeout(() => location.replace(location.pathname + '?updated=' + encodeURIComponent(latest || Date.now()) + location.hash), 900);
}
// after the restart: confirm it worked
function afterUpdateCheck() {
  let info = null; try { info = JSON.parse(sessionStorage.getItem(UPD_DONE) || 'null'); } catch (_) { }
  if (/[?&]updated=/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash);
  if (!info) return false;
  sessionStorage.removeItem(UPD_DONE);
  const ok = !info.to || info.to === APP_VERSION;
  const m = openModal({
    title: '&nbsp;',
    body: `<div style="text-align:center;margin-top:-8px">
      <div style="width:76px;height:76px;border-radius:50%;background:${ok ? 'var(--ok-soft)' : 'var(--warn-soft)'};color:${ok ? 'var(--ok)' : 'var(--warn)'};display:grid;place-items:center;font-size:34px;margin:0 auto 12px"><i class="fas ${ok ? 'fa-check' : 'fa-hourglass-half'}"></i></div>
      <h2 style="margin:0 0 6px;font-size:22px">${ok ? 'Updated successfully' : 'Update not finished yet'}</h2>
      <p class="muted" style="margin:0">${ok ? `NexGen Super Admin is now on <b>v${APP_VERSION}</b>.` : `Still on v${APP_VERSION}. The website may need a minute to show the new files – please try again.`}</p></div>`,
    foot: ok ? `<button class="btn primary" data-close>OK</button>` : `<button class="btn ghost" data-close>Later</button><button class="btn primary" id="updAgain">Try again</button>`
  });
  const head = $('.modal-head', m); if (head) { head.style.borderBottom = '0'; head.querySelector('h3').innerHTML = ''; }
  if (!ok) $('#updAgain', m).onclick = () => { m.close(); doUpdate(info.to); };
  return true;
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
setInterval(() => checkUpdate(false), 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(false); });

sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && S.me) { S.me = null; renderLogin(); } });
boot().then(() => { if (!afterUpdateCheck()) checkUpdate(false); else loadLive().then(() => { drawVersionLines(); const w = setInterval(() => { if (!$('.modal-mask')) { clearInterval(w); siteNews(); } }, 1500); }); });
</script>
</body>
