        function submitClearMonth(event, flatId, month) {
            event.preventDefault();
            if (!hasRight('MANAGE_FLATS')) return;
            const form = event.target;
            const note = form.note.value.trim();
            if (!note) { showToast('Please add a verification note.', 'error'); return; }
            const flat = db.flats.find(f => f.id === flatId);
            const society = db.societies.find(s => s.id === flat.societyId);
            if (!flat || !society || !flat.pendingMonths.includes(month)) { showToast('This month is no longer pending.', 'error'); closeModal(); return; }

            flat.pendingMonths = flat.pendingMonths.filter(m => m !== month);
            flat.pendingAmount = Math.max(0, flat.pendingAmount - society.amount);
            const roleName = currentUser.committeeRole || currentUser.role;
            const now = new Date().toISOString();
            let text = `Removed ${getMonthName(month)} (${formatCurrency(society.amount)}) as paid`;

            if (form.record.checked) {
                const pid = generateId();
                db.payments.push({ id: pid, flatId, societyId: flat.societyId, amount: society.amount, months: [month], mode: 'Cash', cashGivenTo: currentUser.name, status: 'approved', submittedAt: now, approvedBy: currentUser.name, approvedByRole: roleName, approvedAt: now, manualEntry: true, note });
                db.transactions.push({ id: 'txn_' + pid, societyId: flat.societyId, type: 'income', amount: society.amount, description: `Maintenance Paid - Flat ${flat.flatNo} (Cash, verified manually)`, status: 'approved', approvedBy: currentUser.name, approvedByRole: roleName, date: now });
                text += ' and recorded a cash payment';
            }
            logAdjustment(flat, text, note);
            showToast(`${getMonthName(month)} removed from pending dues.`);
            closeModal();
            render();
            openMaintenanceModal(flatId);
        }

        function submitUpdateDues(event, flatId) {
            event.preventDefault();
            const checked = Array.from(document.querySelectorAll('.maint-cb:checked')).map(cb => cb.value);
            
            const flat = db.flats.find(f => f.id === flatId);
            if (flat) {
                const before = [...flat.pendingMonths];
                const removed = before.filter(m => !checked.includes(m)), added = checked.filter(m => !before.includes(m));
                const oldAmt = flat.pendingAmount;
                flat.pendingAmount = parseFloat(document.getElementById('maintTotal').value);
                flat.pendingMonths = checked.sort();
                if (removed.length || added.length || oldAmt !== flat.pendingAmount) {
                    const parts = [];
                    if (removed.length) parts.push('removed ' + removed.map(getMonthName).join(', '));
                    if (added.length) parts.push('added ' + added.map(getMonthName).join(', '));
                    if (oldAmt !== flat.pendingAmount) parts.push(`amount ${formatCurrency(oldAmt)} \u2192 ${formatCurrency(flat.pendingAmount)}`);
                    logAdjustment(flat, 'Edited dues: ' + parts.join('; '), '');
                }
                showToast('Maintenance Details Updated!');
                closeModal();
                render();
            }
        }

        function submitPay(event, flatId, societyId) {
            event.preventDefault();
            const form = event.target;
            const checked = Array.from(document.querySelectorAll('.pay-cb:checked')).map(cb => cb.value);
            const advSelect = document.getElementById('advanceMonthsSelect');
            const advMonthsCount = advSelect ? parseInt(advSelect.value) : 0;
            
            if(checked.length === 0 && advMonthsCount === 0) { 
                showToast('Select at least one month!', 'error'); 
                return; 
            }
            
            const mode = form.mode.value;
            let paymentDetails = { mode };
            
            if (mode === 'UPI' || mode === 'NEFT/IMPS') {
                paymentDetails.refNo = form.refNo.value;
            } else if (mode === 'Cash') {
                paymentDetails.cashGivenTo = form.cashGivenTo.value;
            } else if (mode === 'Cheque') {
                paymentDetails.chequeNo = form.chequeNo.value;
                paymentDetails.bankName = form.bankName.value;
                paymentDetails.chequeDate = form.chequeDate.value;
            }

            const flat = db.flats.find(f => f.id === flatId);
            let finalMonths = [...checked];
            
            if (advMonthsCount > 0) {
                let baseMonth = flat.lastBilledMonth;
                if (checked.length > 0) {
                    const sortedPending = [...checked].sort();
                    if (sortedPending[sortedPending.length-1] > baseMonth) {
                        baseMonth = sortedPending[sortedPending.length-1];
                    }
                }
                
                let [ly, lm] = baseMonth.split('-').map(Number);
                for(let i = 0; i < advMonthsCount; i++) {
                    lm++; if(lm > 12) { lm = 1; ly++; }
                    finalMonths.push(`${ly}-${lm.toString().padStart(2, '0')}`);
                }
            }

            const newPayment = {
                id: generateId(), flatId, societyId, 
                amount: parseFloat(document.getElementById('payTotal').value), 
                months: finalMonths, 
                ...paymentDetails,
                status: 'pending', submittedAt: new Date().toISOString()

                    }
                    rockets = rockets.filter(r => {
                        r.x += r.vx * dt; r.y += r.vy * dt; r.vy += .09 * dt;
                        ctx.fillStyle = `rgba(${r.c},1)`; ctx.beginPath(); ctx.arc(r.x, r.y, 2.2, 0, 7); ctx.fill();
                        ctx.fillStyle = 'rgba(255,200,120,.5)'; ctx.beginPath(); ctx.arc(r.x - r.vx, r.y + 6, 1.4, 0, 7); ctx.fill();
                        if (r.vy >= -.4) { burst(r.x, r.y, r.c); return false; } return true;
                    });
                    sparks = sparks.filter(p => {
                        p.vx *= Math.pow(.965, dt); p.vy = p.vy * Math.pow(.965, dt) + .045 * dt;
                        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
                        if (p.life <= 0) return false;
                        const a = p.flash ? p.life * .35 : (p.tw ? p.life * (.5 + .5 * Math.sin(t / 40 + p.x)) : p.life);
                        ctx.fillStyle = `rgba(${p.c},${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.flash ? p.s * (1.5 - p.life) : p.s * (.6 + .4 * p.life), 0, 7); ctx.fill();
                        return true;
                    });
                    raf = requestAnimationFrame(frame);
                }
                burst(W * .3, H * .22, COLORS[0]); setTimeout(() => alive && burst(W * .72, H * .3, COLORS[1]), 250);   // instant opening pop
                raf = requestAnimationFrame(frame);
                return () => { alive = false; cancelAnimationFrame(raf); window.removeEventListener('resize', size); };
            }

            function init() {
                const prev = lsGet(LS_VER);
                lsSet(LS_VER, CURRENT);
                if (prev && cmp(CURRENT, prev) > 0) { justUpdated = true; whenSplashGone(() => celebrate(CURRENT, NOTES)); }   // just updated
                if (/update-preview/.test(location.hash)) whenSplashGone(() => preview());
                setTimeout(() => check(false), 4000);
                setInterval(() => { if (document.visibilityState === 'visible') check(false); }, CHECK_EVERY);
                document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastCheck > RESUME_GAP) check(false); });
                window.addEventListener('online', () => check(false));
            }
            // demo: open the app with #update-preview to see the popup and celebration without a real release
            function preview() { const v = CURRENT.replace(/(\d+)$/, d => +d + 1); showPrompt({ version: v, notes: NOTES, preview: true }); }

            return { init, check, celebrate, preview, fireworks, whenSplashGone, version: CURRENT, get justUpdated() { return justUpdated; } };
        })();
        AppUpdate.init();

        // ================= DIWALI THEME DECORATIONS =================
        // Everything here only runs while the festival theme is on (see FESTIVE at the top of the file).
        const Diwali = (() => {
            if (!window.FESTIVE || !FESTIVE.diwali) return { on: false };
            const DAY = 864e5, PUJA = Date.parse('2026-11-08T00:00:00+05:30');
            const FEST = { '2026-11-06': 'Dhanteras', '2026-11-07': 'Narak Chaturdashi', '2026-11-08': 'Lakshmi Puja', '2026-11-09': 'Diwali Padwa', '2026-11-10': 'Bhaubeej' };
            const istDate = () => new Date(Date.now() + 5.5 * 36e5).toISOString().slice(0, 10);
            const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
            const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
            const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

            const DEFS = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
                <radialGradient id="dwGlow"><stop offset="0" stop-color="#fff7cc"/><stop offset=".45" stop-color="#fde047" stop-opacity=".75"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
                <linearGradient id="dwFlame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ea580c"/><stop offset=".45" stop-color="#f59e0b"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
                <linearGradient id="dwBowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset=".5" stop-color="#c2410c"/><stop offset="1" stop-color="#7c2d12"/></linearGradient>
                <linearGradient id="dwKan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#db2777"/></linearGradient>
            </defs></svg>`;
            const diya = () => `<svg class="dw-diya" viewBox="0 0 64 64" aria-hidden="true">
                <circle class="dw-glow" cx="32" cy="20" r="20" fill="url(#dwGlow)"/>
                <path class="dw-flame" d="M32 4C39 15 41 22 36.5 28.5C34.5 31.5 29.5 31.5 27.5 28.5C23 22 25 15 32 4Z" fill="url(#dwFlame)"/>
                <path class="dw-flame" d="M32 15C35 20 35.5 24.5 33.6 27.6C32.8 28.8 31.2 28.8 30.4 27.6C28.5 24.5 29 20 32 15Z" fill="#fffbeb"/>
                <path d="M6 34Q32 38 58 34Q56 52 32 56Q8 52 6 34Z" fill="url(#dwBowl)"/>
                <path d="M6 34Q32 39 58 34Q32 30 6 34Z" fill="#7c2d12"/>
                <path d="M12 42Q32 46.5 52 42" stroke="#fde68a" stroke-width="1.8" fill="none" stroke-dasharray=".1 5" stroke-linecap="round"/>
                <circle cx="32" cy="50" r="2.2" fill="#fde68a"/>
            </svg>`;
            const kandil = cls => {   // star-shaped akash kandil
                const pts = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? 11 : 25, a = -Math.PI / 2 + i * Math.PI / 5; pts.push((30 + r * Math.cos(a)).toFixed(1) + ',' + (52 + r * Math.sin(a)).toFixed(1)); }
                const tails = [['#fbbf24', 22], ['#f472b6', 30], ['#fde68a', 38]].map(([c, x]) => `<path d="M${x} 74 q-3 14 0 28 q3 12 0 22" stroke="${c}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`).join('');
                return `<svg class="dw-kandil ${cls}" viewBox="0 0 60 130" aria-hidden="true">
                    <line x1="30" y1="0" x2="30" y2="27" stroke="#fcd34d" stroke-width="1.2"/>${tails}
                    <polygon points="${pts.join(' ')}" fill="url(#dwKan)" stroke="#fde68a" stroke-width="1.3" stroke-linejoin="round"/>
                    <circle class="dw-glow" cx="30" cy="53" r="8" fill="url(#dwGlow)"/></svg>`;
            };
            const sparks = n => Array.from({ length: n }, (_, i) => `<span class="dw-spark" style="left:${8 + Math.random() * 84}%;top:${10 + Math.random() * 80}%;animation-delay:${(-i * .7).toFixed(1)}s"></span>`).join('');

            function chipText() {
                const fest = FEST[istDate()];
                if (fest) return `Today: ${fest}`;
                if (Date.now() < PUJA) { const d = Math.ceil((PUJA - Date.now()) / DAY); return `Lakshmi Puja in ${d} day${d > 1 ? 's' : ''}`; }
                return 'Hope you had a bright Diwali';
            }
            function societyName() {
                try { const u = typeof currentUser !== 'undefined' && currentUser; const s = u && u.societyId && db.societies.find(x => x.id === u.societyId); return s && s.name; } catch (e) { return null; }
            }
            function bannerHtml() {
                const soc = societyName();
                return `<div class="dw-banner" role="note">${sparks(6)}
                    <div class="dw-diyas">${diya()}${diya()}</div>
                    <div style="min-width:0">
                        <h3>शुभ दीपावली · Happy Diwali</h3>
                        <p>Wishing ${soc ? 'everyone at ' + esc(soc) : 'you and your family'} a festival full of light, joy and prosperity.</p>
                        <span class="dw-chip">🪔 ${chipText()}</span>
                    </div>
                    <button class="dw-x" aria-label="Hide Diwali greeting" onclick="Diwali.hideBanner()">&times;</button>
                </div>`;
            }

            function decorate() {
                if (!document.querySelector('.dw-toran')) {
                    document.body.insertAdjacentHTML('beforeend', DEFS + '<div class="dw-toran" aria-hidden="true"></div>');
                }
                const main = document.querySelector('#app > main');
                if (main && !main.querySelector('.dw-banner') && lsGet('sm_dw_hide') !== istDate()) main.insertAdjacentHTML('afterbegin', bannerHtml());
                const top = document.querySelector('#app .landing #top');
                if (top && !top.querySelector('.dw-kandil')) {
                    top.insertAdjacentHTML('afterbegin', kandil('k1') + kandil('k2'));
                    const rv = top.querySelector('.rv'); if (rv) rv.insertAdjacentHTML('afterbegin', '<span class="dw-pill">🪔 शुभ दीपावली · Happy Diwali</span>');
                }
            }
            function hideBanner() {
                lsSet('sm_dw_hide', istDate());
                const b = document.querySelector('.dw-banner'); if (b) { b.style.transition = 'opacity .3s, transform .3s'; b.style.opacity = '0'; b.style.transform = 'scale(.97)'; setTimeout(() => b.remove(), 300); }
            }

            function greet(kind) {
                if (document.getElementById('cg-wrap')) return;
                const soc = societyName();
                const w = document.createElement('div'); w.id = 'cg-wrap'; w.className = 'dw-greet';
                w.setAttribute('role', 'dialog'); w.setAttribute('aria-modal', 'true'); w.setAttribute('aria-labelledby', 'dw-gt');
                w.innerHTML = `<canvas aria-hidden="true"></canvas>
                    <div id="cg-card">
                        <div class="dw-greet-diyas">${diya()}${diya()}${diya()}</div>
                        <h2 id="dw-gt" class="dw-greet-title">शुभ दीपावली</h2>
                        <p class="cg-up" style="animation-delay:.4s;font-size:1.25rem;font-weight:700;margin:.2rem 0 0;color:#fde68a">${kind === 'puja' ? 'Happy Lakshmi Puja!' : 'Happy Diwali!'}</p>
                        <p class="cg-up cg-sub" style="animation-delay:.6s;margin-top:.75rem">May this festival of lights fill ${soc ? 'every home at ' + esc(soc) : 'your home'} with joy, peace and prosperity.</p>
                        <p class="cg-up" style="animation-delay:.75s;margin:.75rem 0 0;font-size:.8rem;color:#fdba74">— Team SocietyConnect</p>
                        <button id="cg-ok" class="upd-btn cg-up" style="animation-delay:.9s;margin-top:1.5rem">Thank you 🙏</button>
                    </div>`;
                document.body.appendChild(w);
                if (navigator.vibrate) try { navigator.vibrate([40, 60, 40]); } catch (e) {}
                const stop = AppUpdate.fireworks(w.querySelector('canvas'));
                w.querySelector('#cg-ok').onclick = () => { stop(); w.style.transition = 'opacity .35s'; w.style.opacity = '0'; setTimeout(() => w.remove(), 360); };
            }
            function maybeGreet() {
                if (AppUpdate.justUpdated) return;   // the update celebration already played this time; greet on the next open
                const isPuja = FEST[istDate()] === 'Lakshmi Puja';
                const kind = isPuja && !lsGet('sm_dw26_puja') ? 'puja' : (!lsGet('sm_dw26_greet') ? 'welcome' : null);
                if (!kind) return;
                AppUpdate.whenSplashGone(() => {
                    if (document.getElementById('cg-wrap')) return;
                    greet(kind); lsSet('sm_dw26_greet', '1'); if (kind === 'puja') lsSet('sm_dw26_puja', '1');
                });
            }

            const app = document.getElementById('app');
            if (app) new MutationObserver(() => requestAnimationFrame(decorate)).observe(app, { childList: true });
            decorate(); maybeGreet();
            return { on: true, decorate, hideBanner, greet };
        })();
        // =============================================================
        // =============================================================
        window.__appBooted = true;   // main script loaded fine (see startup check at the top of <body>)
    </script>
</body>
