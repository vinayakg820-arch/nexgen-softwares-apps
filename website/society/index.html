    <script>
        // ===== Festival theme switch =====
        // Diwali theme runs from 30 Oct 2026 to the end of 16 Nov 2026 (India time), then the normal look returns by itself.
        // Preview any time: add ?theme=diwali (or ?theme=normal) to the app address.
        window.FESTIVE = (() => {
            const START = Date.parse('2026-10-30T00:00:00+05:30'), END = Date.parse('2026-11-17T00:00:00+05:30');
            const force = (location.search.match(/[?&]theme=(diwali|normal)/) || [])[1];
            const now = Date.now(), on = force ? force === 'diwali' : (now >= START && now < END);
            if (on) {
                document.documentElement.classList.add('diwali');
                const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = '#7c2d12';
            }
            return { diwali: on, start: START, end: END };
        })();
    </script>

    <style>

        /* ===== Dues summary + cleared flats ===== */

        .dues-card[role=button] { cursor: pointer; } .dues-card[role=button]:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -14px rgba(15,23,42,.35); }

        tr.flat-cleared { background: linear-gradient(90deg, rgba(16,185,129,.16), rgba(16,185,129,.05) 45%, rgba(16,185,129,.02)); box-shadow: inset 4px 0 0 #10b981; }
        tr.flat-cleared:hover { background: linear-gradient(90deg, rgba(16,185,129,.22), rgba(16,185,129,.08) 45%, rgba(16,185,129,.03)); }
        .cleared-badge { display: inline-flex; align-items: center; gap: .25rem; margin-top: .3rem; padding: .1rem .45rem; border-radius: 9999px; font-size: .62rem; font-weight: 800; letter-spacing: .04em; color: #047857; background: #d1fae5; border: 1px solid #a7f3d0; }

            .mbar-btn:active { background: #eef2ff; color: #4f46e5; }

            /* bottom navigation */
            .bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: rgba(255,255,255,.97); -webkit-backdrop-filter: saturate(1.6) blur(12px); backdrop-filter: saturate(1.6) blur(12px);
                    border-top: 1px solid #e2e8f0; box-shadow: 0 -6px 20px -12px rgba(15,23,42,.25); padding: .3rem .25rem calc(.3rem + env(safe-area-inset-bottom)); justify-content: space-around; }
            .bnav-item { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: .1rem; padding: .25rem 0 .2rem; border: 0; background: none; color: #64748b; font-size: .66rem; font-weight: 600; -webkit-user-select: none; user-select: none; }
            .bnav-ic { position: relative; width: 3.6rem; height: 1.95rem; border-radius: 9999px; display: grid; place-items: center; font-size: 1.12rem; transition: background .2s, color .2s; }

            .bnav-badge { position: absolute; top: -.2rem; right: .45rem; min-width: 1.1rem; height: 1.1rem; padding: 0 .28rem; border-radius: 9999px; background: #ef4444; color: #fff; font-size: .62rem; font-weight: 800; line-height: 1.1rem; text-align: center; box-shadow: 0 0 0 2px #fff; }

            main.app-main { padding-top: 1rem !important; padding-bottom: calc(5.5rem + env(safe-area-inset-bottom)) !important; }

            .dues-card { padding: .6rem .65rem !important; border-radius: .85rem; }
            .dues-label { font-size: .6rem; gap: .25rem; letter-spacing: 0; }

            .dues-amount, .dues-pending .dues-amount, .dues-cleared .dues-amount { font-size: 1.05rem !important; margin-top: .15rem; }
            .dues-of { font-size: .75rem; }

            /* tables -> cards */
            #app table.mt, #app table.mt tbody { display: block; width: 100%; }
            #app table.mt thead { display: none; }
            #app table.mt tr { display: flex; flex-direction: column; background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem; padding: .65rem .9rem; margin-bottom: .65rem; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
            #app table.mt tr.flat-cleared { background: linear-gradient(90deg, rgba(16,185,129,.13), rgba(16,185,129,.04) 60%, #fff); box-shadow: inset 4px 0 0 #10b981, 0 1px 2px rgba(15,23,42,.05); border-color: #a7f3d0; }
            #app table.mt td { display: block; overflow: hidden; padding: .45rem 0 !important; border: 0; text-align: right; white-space: normal !important; font-size: .875rem; line-height: 1.4; min-width: 0 !important; }
            #app table.mt td::before { content: attr(data-label); float: left; max-width: 45%; margin-right: .75rem; text-align: left; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: #94a3b8; padding-top: .15rem; }
            #app table.mt td.mt-title { order: -1; text-align: left; font-size: 1.02rem; font-weight: 700; color: #0f172a; padding-bottom: .55rem !important; margin-bottom: .2rem; border-bottom: 1px solid #f1f5f9; }
            #app table.mt td.mt-title::before { display: none; }
            #app table.mt td.mt-title .cleared-badge { display: inline-flex; width: auto; margin: 0 0 0 .5rem; vertical-align: middle; }
            #app table.mt td.mt-title span.block { display: inline-block; margin-left: .5rem; }
            #app table.mt td .act-ubar { margin-left: auto; max-width: 60%; }
            #app table.mt td span[class*="rounded"], #app table.mt td span[class*="px-"] { display: inline-block; white-space: nowrap; margin: .12rem 0 .12rem .25rem; }
            #app table.mt td .mt-cap { display: inline-block; text-transform: capitalize; }

        /* ===== First-time app guide ===== */
        .tour { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 140; animation: fadeIn .25s ease; }
        .tour.out { opacity: 0; transition: opacity .25s; }
        .tour-spot { position: fixed; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(15,23,42,.66); transition: all .35s cubic-bezier(.4,0,.2,1); pointer-events: none; }
        .tour-spot:not(.none)::after { content: ''; position: absolute; top: -4px; right: -4px; bottom: -4px; left: -4px; border-radius: 16px; border: 2px solid #a5b4fc; animation: tourPulse 1.6s ease-out infinite; }
        @keyframes tourPulse { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.08); } }
        .tour-card { position: fixed; width: min(360px, calc(100vw - 24px)); background: #fff; border-radius: 1.1rem; padding: 1rem 1rem .85rem; box-shadow: 0 24px 60px -16px rgba(15,23,42,.6); transition: left .3s ease, top .3s ease; }
        .tour-card.pop { animation: tourPop .3s cubic-bezier(.34,1.56,.64,1); }
        @keyframes tourPop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
        .tour-card[data-arrow]::before { content: ''; position: absolute; left: calc(var(--ax, 50%) - 8px); width: 16px; height: 16px; background: #fff; transform: rotate(45deg); border-radius: 3px; }
        .tour-card[data-arrow="up"]::before { top: -7px; } .tour-card[data-arrow="down"]::before { bottom: -7px; }
        .tour-head { display: flex; align-items: center; gap: .65rem; margin-bottom: .45rem; }
        .tour-ic { width: 2.3rem; height: 2.3rem; flex: none; border-radius: .75rem; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .tour-title { font-weight: 800; color: #0f172a; font-size: 1.02rem; line-height: 1.25; }
        .tour-text { font-size: .875rem; color: #475569; line-height: 1.5; }
        .tour-foot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-top: .9rem; }

        .tour-btns { display: flex; align-items: center; gap: .35rem; flex: none; }
        .tour-skip { padding: .5rem .7rem; border: 0; background: none; color: #64748b; font-weight: 600; font-size: .85rem; cursor: pointer; }
        .tour-back { width: 2.4rem; height: 2.4rem; border-radius: .7rem; border: 1px solid #e2e8f0; background: #fff; color: #475569; cursor: pointer; }
        .tour-next { padding: .55rem 1.05rem; min-height: 2.4rem; border-radius: .7rem; border: 0; background: #4f46e5; color: #fff; font-weight: 700; font-size: .875rem; cursor: pointer; box-shadow: 0 6px 14px -6px rgba(79,70,229,.8); }
        .tour-next:hover { background: #4338ca; }
        @media (prefers-reduced-motion: reduce) { .tour-spot, .tour-card { transition: none; } .tour-spot::after, .tour-card.pop { animation: none !important; } }

        /* ===== Payment screenshot reader ===== */
        .ocr-box { margin-top: 0; }
        .ocr-pick { display: flex; align-items: center; gap: .8rem; padding: .75rem .9rem; border: 2px dashed #a5b4fc; border-radius: .9rem; background: #eef2ff; color: #3730a3; cursor: pointer; font-size: .9rem; line-height: 1.3; }
        .ocr-pick:hover, .ocr-pick:active { background: #e0e7ff; border-color: #6366f1; }
        .ocr-ic { width: 2.4rem; height: 2.4rem; flex: none; border-radius: .7rem; display: grid; place-items: center; background: #4f46e5; color: #fff; font-size: 1rem; }
        .ocr-sub { font-size: .75rem; color: #6366f1; }
        .ocr-thumb { margin-top: .6rem; max-height: 140px; border-radius: .6rem; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px -2px rgba(15,23,42,.2); cursor: zoom-in; }

        .ocr-msg.busy { background: #f1f5f9; color: #334155; }

        input.ocr-filled { border-color: #10b981 !important; background: #f0fdf4 !important; box-shadow: 0 0 0 3px rgba(16,185,129,.18); }

        /* ===== Notifications card ===== */
        .push-card { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; background: linear-gradient(135deg, #eef2ff, #f5f3ff); border: 1px solid #c7d2fe; border-radius: 1rem; padding: .9rem 1rem; margin-bottom: 1.25rem; }
        .push-ic { width: 2.6rem; height: 2.6rem; border-radius: .8rem; display: grid; place-items: center; flex: none; color: #fff; background: linear-gradient(135deg, #6366f1, #8b5cf6); box-shadow: 0 6px 16px -6px rgba(99,102,241,.7); animation: pushRing 2.8s ease-in-out infinite; transform-origin: 50% 10%; }
        @keyframes pushRing { 0%,70%,100% { transform: rotate(0); } 75% { transform: rotate(12deg); } 80% { transform: rotate(-10deg); } 85% { transform: rotate(7deg); } 90% { transform: rotate(-4deg); } }
        .push-actions { display: flex; gap: .5rem; margin-left: auto; }
        .push-on { padding: .55rem 1.1rem; border-radius: .6rem; background: #4f46e5; color: #fff; font-weight: 600; font-size: .875rem; border: 0; cursor: pointer; }
        .push-on:hover { background: #4338ca; }
        .push-later { padding: .55rem .9rem; border-radius: .6rem; background: #fff; color: #475569; font-weight: 600; font-size: .875rem; border: 1px solid #e2e8f0; cursor: pointer; }
        @media (max-width: 640px) { .push-actions { width: 100%; } .push-actions button { flex: 1; } }
        @media (prefers-reduced-motion: reduce) { .push-ic { animation: none; } }

        /* ===== Developer activity ===== */
        .act-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem; padding: .9rem 1rem; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
        .act-label { font-size: .75rem; font-weight: 700; color: #475569; display: flex; align-items: center; gap: .4rem; }
        .act-num { font-size: 1.6rem; font-weight: 800; color: #0f172a; line-height: 1.2; margin-top: .25rem; }
        .act-sub { font-size: .7rem; color: #94a3b8; margin-top: .1rem; }
        .act-dot { width: .55rem; height: .55rem; border-radius: 9999px; background: #cbd5e1; display: inline-block; flex: none; }
        .act-dot.on { background: #10b981; box-shadow: 0 0 0 0 rgba(16,185,129,.6); animation: actPulse 1.8s ease-out infinite; }
        @keyframes actPulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.55); } 100% { box-shadow: 0 0 0 7px rgba(16,185,129,0); } }
        .act-role { display: inline-block; font-size: .65rem; font-weight: 700; padding: .05rem .4rem; border-radius: .3rem; text-transform: capitalize; margin-top: .15rem; }
        .act-role.com { background: #eef2ff; color: #4338ca; } .act-role.res { background: #f1f5f9; color: #475569; }
        .act-rank { width: 1.4rem; height: 1.4rem; border-radius: 9999px; display: inline-grid; place-items: center; font-size: .7rem; font-weight: 800; flex: none; color: #fff; }
        .act-rank.r1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); } .act-rank.r2 { background: linear-gradient(135deg, #cbd5e1, #94a3b8); } .act-rank.r3 { background: linear-gradient(135deg, #fdba74, #c2410c); }
        .act-ubar { height: 5px; border-radius: 9999px; background: #eef2ff; overflow: hidden; margin-top: .3rem; }
        .act-ubar i { display: block; height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #6366f1, #22d3ee); }
        tr.act-none { background: #fffafa; }
        .act-bars { display: flex; align-items: flex-end; gap: 3px; height: 90px; }
        .act-bar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; }
        .act-bar i { display: block; width: 100%; max-width: 14px; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, #818cf8, #6366f1); }
        .act-bar span { font-size: .55rem; color: #94a3b8; height: .9rem; line-height: .9rem; }
        @media (prefers-reduced-motion: reduce) { .act-dot.on, .cleared-badge i { animation: none; } }

        /* ===== App update popup + celebration ===== */
        #upd-wrap { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 120; display: flex; align-items: flex-end; justify-content: center; padding: 1rem; padding-bottom: calc(1rem + env(safe-area-inset-bottom)); background: rgba(2,6,23,.55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fadeIn .25s ease; }
        @media (min-width: 640px) { #upd-wrap { align-items: center; } }
        #upd-card { box-sizing: border-box; width: 100%; max-width: 24rem; border-radius: 1.5rem; overflow: hidden; color: #fff; background: radial-gradient(500px 220px at 85% -20%, #6366f1 0%, transparent 60%), radial-gradient(400px 220px at -10% 120%, #0891b2 0%, transparent 60%), #0b1024; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 80px -20px rgba(0,0,0,.7); animation: updIn .5s cubic-bezier(.16,1,.3,1); }
        @keyframes updIn { from { opacity: 0; transform: translateY(40px) scale(.96); } to { opacity: 1; transform: none; } }

    <script>
        // Startup check, written in old-style JavaScript on purpose so it runs on every phone.
        // If the app has not started after 12 s (slow/blocked network or a very old browser), show help + Retry instead of an endless loading screen.
        window.__appBooted = false;

            var sp = document.getElementById('splash'); if (!sp || document.getElementById('boot-help')) return;
            var bar = sp.querySelector('.bar'); if (bar) bar.style.display = 'none';
            var box = document.createElement('div'); box.id = 'boot-help';
            box.setAttribute('style', 'position:absolute;left:16px;right:16px;bottom:5%;text-align:center;color:#e2e8f0;font-size:14px;line-height:1.55');
            box.innerHTML = 'The app is taking longer than usual to start.<br>Please check your internet connection and tap Retry.' +

                '<br><button type="button" onclick="location.reload()" style="margin-top:14px;padding:11px 28px;border:0;border-radius:999px;background:#fff;color:#0f172a;font-weight:700;font-size:15px">Retry</button>';
            sp.appendChild(box);

    <div id="app" class="flex-1 flex flex-col w-full h-full min-h-screen relative"></div>

    <script>
        // Data lives in Supabase. This object is just the in-memory working copy, filled after login.
        const db = {
            settings: {},
            users: [], societies: [], flats: [], payments: [],
            transactions: [], complaints: [], coupons: [], subPayments: []
        };

        let currentUser = null;
        let currentView = 'login'; 
        let devActiveTab = 'societies'; // societies, subscriptions, coupons, activity
        let flatFilter = 'all';          // flats tab: all | due | cleared
        let activityMonth = null, activityData = null, activityLoading = false, activityError = '', activitySoc = 'all', activityView = 'all';
        let selectedSocietyId = null;
        let activeTab = 'flats'; 
        let activeFlatTab = 'my_account';
        let pendingApprovalData = null; 
        let pendingToggleData = null; 
        let pendingComplaintId = null;
        let ledgerFilterMonth = 'all';

        const generateId = () => Math.random().toString(36).substring(2, 11);
        const formatCurrency = (amount) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(amount || 0);
        const formatDate = (dateString) => new Date(dateString).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
        const formatRole = (role) => {
            if(!role) return '';
            return role.charAt(0).toUpperCase() + role.slice(1).replace('_', ' ');
        };
        
        const getCurrentMonthStr = () => {
            const now = new Date();
            return `${now.getFullYear()}-${(now.getMonth() + 1).toString().padStart(2, '0')}`;
        };

        const getMonthName = (yyyy_mm) => {
            if(!yyyy_mm) return '';
            const [y, m] = yyyy_mm.split('-');
            const date = new Date(y, m - 1);
            return date.toLocaleString('default', { month: 'short' }) + ' ' + y;
        };

        // natural sort for flat numbers: wing letters A→Z, then numbers as numbers (C1-108 before C1-201, 99 before 1001)
        const flatSorter = new Intl.Collator('en', { numeric: true, sensitivity: 'base' });
        const compareFlatNo = (a, b) => flatSorter.compare(String(a.flatNo || '').trim(), String(b.flatNo || '').trim());

        const generateMonths = (startMonth, endMonth) => {
            if(!startMonth) startMonth = endMonth; 
            const result = [];
            let [sy, sm] = startMonth.split('-').map(Number);
            const [ey, em] = endMonth.split('-').map(Number);
            while (sy < ey || (sy === ey && sm <= em)) {
                result.push(`${sy}-${sm.toString().padStart(2, '0')}`);
                sm++;
                if (sm > 12) { sm = 1; sy++; }
            }
            return result;
        };

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = error => reject(error);
            reader.onload = () => {
                if (!file.type.startsWith('image/')) return resolve(reader.result);
                const img = new Image();
                img.onerror = () => resolve(reader.result);
                img.onload = () => {
                    const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
                    const c = document.createElement('canvas');
                    c.width = Math.round(img.width * scale);
                    c.height = Math.round(img.height * scale);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    resolve(file.type === 'image/png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.72));
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        });

        function getSubscriptionStatus(soc) {
            if (!soc.subscription || !soc.subscription.active) return { state: 'inactive', days: 0 };
            
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const due = new Date(soc.subscription.nextDueDate);
            due.setHours(0,0,0,0);
            
            const diffTime = due - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays > 10) return { state: 'active', days: diffDays };
            if (diffDays > 0 && diffDays <= 10) return { state: 'warning', days: diffDays };
            if (diffDays <= 0 && diffDays >= -10) return { state: 'overdue', days: Math.abs(diffDays) };
            return { state: 'suspended', days: Math.abs(diffDays) };
        }

        function simulateAutoCleanups() {
            const now = new Date().getTime();
            db.payments.forEach(p => {   // payment screenshots are kept 45 days (enough to verify), then removed to keep the app light
                if (p.proofImage && (now - new Date(p.submittedAt).getTime()) > 45 * 864e5) { delete p.proofImage; p.proofAutoDeleted = true; }
            });
            db.complaints.forEach(c => {
                if (c.images && c.images.length > 0) {
                    const raisedTime = new Date(c.raisedAt).getTime();
                    if ((now - raisedTime) > (15 * 24 * 60 * 60 * 1000)) {
                        c.images = []; 
                        c.imagesAutoDeleted = true;
                    }
                }
            });
            db.transactions.forEach(t => {
                if (t.billImages && t.billImages.length > 0) {
                    const raisedTime = new Date(t.date).getTime();
                    if ((now - raisedTime) > (30 * 24 * 60 * 60 * 1000)) {
                        t.billImages = [];
                        t.imagesAutoDeleted = true;
                    }
                }
            });
        }

        function processAutoBilling() {
            const currentMonth = getCurrentMonthStr();
            db.flats.forEach(flat => {
                if(flat.status === 'inactive') return;
                const society = db.societies.find(s => s.id === flat.societyId);
                if(!society || society.status === 'inactive') return;

                if (!flat.lastBilledMonth) flat.lastBilledMonth = society.establishedMonth || currentMonth; 
                
                if (flat.lastBilledMonth < currentMonth) {
                    let [ly, lm] = flat.lastBilledMonth.split('-').map(Number);
                    lm++; if(lm > 12) { lm = 1; ly++; }
                    const nextMonthToBill = `${ly}-${lm.toString().padStart(2, '0')}`;
                    
                    if (nextMonthToBill <= currentMonth) {
                        const monthsToBill = generateMonths(nextMonthToBill, currentMonth);
                        monthsToBill.forEach(m => {
                            if(!flat.pendingMonths.includes(m)) {
                                flat.pendingMonths.push(m);
                                flat.pendingAmount += society.amount;
                            }
                        });
                        flat.lastBilledMonth = currentMonth;
                        flat.pendingMonths.sort();
                    }
                }
            });
        }

        function calculateSocietyBalance(societyId) {
            const society = db.societies.find(s => s.id === societyId);
            if (!society) return 0;
            
            let balance = parseFloat(society.initialBalance || 0);
            const txns = db.transactions.filter(t => t.societyId === societyId && t.status === 'approved');
            
            txns.forEach(t => {
                if (t.type === 'income') balance += parseFloat(t.amount);
                else if (t.type === 'expense') balance -= parseFloat(t.amount);
            });
            return balance;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = type === 'success' ? 'bg-green-500' : (type === 'error' ? 'bg-red-500' : 'bg-blue-500');
            toast.className = `${colors} text-white px-4 py-3 rounded shadow-lg flex items-center gap-3 fade-in max-w-sm transition-opacity duration-300`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function handleLogin(event) {
            event.preventDefault();
            const form = event.target;
            login(form.email.value, form.password.value);
        }

        function enterApp(user, restored) {
                currentUser = user;
                if (user.role === 'developer') { currentView = 'dev_dashboard'; selectedSocietyId = null; devActiveTab = 'societies'; }
                else if (user.role === 'committee') { currentView = 'society_dashboard'; selectedSocietyId = user.societyId; activeTab = 'flats'; }
                else if (user.role === 'flat_owner') { currentView = 'flat_dashboard'; selectedSocietyId = user.societyId; activeFlatTab = 'my_account'; }
                
                showToast(restored ? `Welcome back, ${user.name}!` : `Welcome, ${user.name}!`);
                Activity.opened();
                Push.sync();
                AppTour.maybeStart();
                setTimeout(() => openDeepLink(location.href), 0);
                simulateAutoCleanups();
                processAutoBilling(); 
                render();
            try { localStorage.setItem('sm_session', JSON.stringify({ token: sessionToken, user_id: user.id })); } catch (e) {}
        }

        function clearSavedSession() { try { localStorage.removeItem('sm_session'); } catch (e) {} }

        async function login(email, password) {
            let r;
            try { r = await sbRpc('app_login', { p_email: email, p_password: password }); }
            catch (e) { showToast('Cannot reach server: ' + e.message, 'error'); return; }
            if (!r) { showToast('Invalid ID or Password!', 'error'); return; }

            sessionToken = r.token;
            try { await pullAll(); }
            catch (e) {
                sessionToken = null; resetLocalData();
                showToast(/SESSION_EXPIRED/.test(e.message) ? 'Your account is deactivated. Contact Admin.' : 'Could not load data: ' + e.message, 'error');
                return;
            }
            const user = db.users.find(u => u.id === r.user_id);
            if (user) {
                if(user.status === 'inactive') {
                    showToast('Your account is deactivated. Contact Admin.', 'error');
                    sessionToken = null; resetLocalData();
                    return;
                }
                
                if (user.societyId) {
                    const soc = db.societies.find(s => s.id === user.societyId);
                    if(soc && soc.status === 'inactive') {
                        showToast('Your society is currently inactive.', 'error');
                        sessionToken = null; resetLocalData();
                        return;
                    }
                }

                enterApp(user);
            } else {
                sessionToken = null; resetLocalData();
                showToast('Invalid ID or Password!', 'error');
            }
        }

            clearTimeout(persistTimer);

            sessionToken = null;

            const total = inSoc.reduce((t, u) => t + (u.seconds || 0), 0);
            const isNow = activityMonth === getCurrentMonthStr();
            const monthLbl = getMonthName(activityMonth);

            const cards = `
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
                    <div class="act-card"><p class="act-label"><span class="act-dot on"></span> Online now</p><p class="act-num">${isNow ? online.length : '—'}</p><p class="act-sub">${isNow ? 'using the app right now' : 'live only for this month'}</p></div>
                    <div class="act-card"><p class="act-label"><i class="fas fa-user-check text-indigo-500"></i> Active in ${monthLbl.split(' ')[0]}</p><p class="act-num">${active.length}<span class="text-base text-slate-400 font-semibold"> / ${inSoc.length}</span></p><p class="act-sub">opened the app this month</p></div>
                    <div class="act-card"><p class="act-label"><i class="fas fa-clock text-amber-500"></i> Total time</p><p class="act-num">${fmtDur(total)}</p><p class="act-sub">avg ${fmtDur(active.length ? total / active.length : 0)} per active user</p></div>
                    <div class="act-card"><p class="act-label"><i class="fas fa-user-slash text-red-500"></i> Not opened</p><p class="act-num text-red-600">${never.length}</p><p class="act-sub">no time in ${monthLbl}</p></div>
                </div>`;

            // per-society overview
            const socs = db.societies.map(soc => {
                const m = people.filter(u => u.societyId === soc.id), t = m.reduce((a, u) => a + (u.seconds || 0), 0);
                const top = m.slice().sort((a, b) => b.seconds - a.seconds)[0];
                return { soc, m, t, on: m.filter(u => u.online).length, act: m.filter(u => u.seconds > 0).length, top };
            }).sort((a, b) => b.t - a.t);
            const socHtml = `
                <h3 class="text-sm font-bold text-slate-700 mb-3">Societies</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 mb-6">${socs.map(x => `
                    <button onclick="activitySoc='${activitySoc === x.soc.id ? 'all' : x.soc.id}'; render();" class="text-left bg-white border ${activitySoc === x.soc.id ? 'border-indigo-500 ring-2 ring-indigo-100' : 'border-slate-200'} rounded-xl p-4 shadow-sm hover:border-indigo-300 transition-colors">
                        <div class="flex items-start justify-between gap-2">
                            <p class="font-bold text-slate-800 leading-tight">${x.soc.name}</p>
                            <span class="shrink-0 inline-flex items-center gap-1.5 text-xs font-semibold px-2 py-1 rounded-full ${isNow && x.on ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'}"><span class="act-dot ${isNow && x.on ? 'on' : ''}"></span>${isNow ? x.on + ' online' : 'offline'}</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 mt-3 text-center">
                            <div class="bg-slate-50 rounded-lg py-2"><p class="text-[11px] text-slate-500">Members</p><p class="font-bold text-slate-800">${x.m.length}</p></div>
                            <div class="bg-slate-50 rounded-lg py-2"><p class="text-[11px] text-slate-500">Active</p><p class="font-bold text-slate-800">${x.act}</p></div>
                            <div class="bg-slate-50 rounded-lg py-2"><p class="text-[11px] text-slate-500">Time</p><p class="font-bold text-slate-800">${fmtDur(x.t)}</p></div>
                        </div>
                        <p class="text-xs text-slate-500 mt-3 truncate">${x.top && x.top.seconds ? `<i class="fas fa-crown text-amber-500 mr-1"></i>Most active: <b class="text-slate-700">${x.top.name}</b> (${fmtDur(x.top.seconds)})` : 'No activity yet this month'}</p>
                    </button>`).join('') || '<p class="text-slate-500 text-sm">No societies yet.</p>'}
                </div>`;

            // daily usage bars
            const daily = activityData.daily || [];
            const [yy, mm] = activityMonth.split('-').map(Number), dim = new Date(yy, mm, 0).getDate();
            const byDay = {}; daily.forEach(d => { byDay[String(d.day).slice(8, 10)] = d; });
            const maxS = Math.max(1, ...daily.map(d => d.seconds));
            const barsHtml = activitySoc === 'all' ? `
                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm mb-6">
                    <div class="flex justify-between items-baseline mb-3"><h3 class="text-sm font-bold text-slate-700">Daily time in ${monthLbl}</h3><span class="text-xs text-slate-400">all societies</span></div>
                    <div class="act-bars">${Array.from({ length: dim }, (_, i) => { const dd = String(i + 1).padStart(2, '0'), d = byDay[dd]; const h = d ? Math.max(4, Math.round(d.seconds * 100 / maxS)) : 0;
                        return `<div class="act-bar" title="${i + 1} ${monthLbl.split(' ')[0]}: ${d ? fmtDur(d.seconds) + ' · ' + d.users + ' people' : 'no use'}"><i style="height:${h}%"></i><span>${(i + 1) % 5 === 1 || i + 1 === dim ? i + 1 : ''}</span></div>`; }).join('')}</div>
                </div>` : '';

            // people list
            let list = inSoc.slice();
            if (activityView === 'online') list = list.filter(u => u.online);
            if (activityView === 'never') list = list.filter(u => !u.seconds);
            list.sort((a, b) => activityView === 'never' ? String(a.name).localeCompare(b.name) : (b.online - a.online) * (activityView === 'online' ? 1 : 0) || b.seconds - a.seconds || String(a.name).localeCompare(b.name));
            const maxU = Math.max(1, ...inSoc.map(u => u.seconds || 0));
            const seg = (v, label, n) => `<button onclick="activityView='${v}'; render();" class="px-3 py-1.5 rounded-full text-xs font-semibold border ${activityView === v ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">${label} <span class="opacity-75">${n}</span></button>`;
            const rows = list.map((u, i) => {
                const role = u.role === 'committee' ? `<span class="act-role com">${u.committeeRole ? String(u.committeeRole).replace(/_/g, ' ') : 'Committee'}</span>` : `<span class="act-role res">Resident${flatNo(u.flatId) ? ' · ' + flatNo(u.flatId) : ''}</span>`;
                const rank = activityView !== 'never' && u.seconds && i < 3 ? `<span class="act-rank r${i + 1}">${i + 1}</span>` : '';
                return `<tr class="border-b border-slate-100 ${!u.seconds ? 'act-none' : ''}">
                    <td class="px-4 py-3"><span class="inline-flex items-center gap-2 whitespace-nowrap text-xs ${u.online ? 'text-emerald-700 font-semibold' : 'text-slate-500'}"><span class="act-dot ${u.online ? 'on' : ''}"></span>${lastSeenText(u)}</span></td>
                    <td class="px-4 py-3"><div class="flex items-center gap-2">${rank}<div><p class="font-semibold text-slate-800 whitespace-nowrap">${u.name || '—'}${u.status === 'inactive' ? ' <span class="text-[10px] text-red-500 font-bold">INACTIVE</span>' : ''}</p>${role}</div></div></td>
                    <td class="px-4 py-3 text-sm text-slate-600 whitespace-nowrap">${socName(u.societyId)}</td>
                    <td class="px-4 py-3 min-w-[9rem]"><p class="font-bold text-slate-800 text-sm">${u.seconds ? fmtDur(u.seconds) : '<span class="text-red-500 font-semibold">Not opened</span>'}</p>${u.seconds ? `<div class="act-ubar"><i style="width:${Math.max(3, Math.round(u.seconds * 100 / maxU))}%"></i></div>` : ''}</td>
                    <td class="px-4 py-3 text-sm text-slate-600 text-center">${u.days || '—'}</td>
                    <td class="px-4 py-3 text-sm text-slate-600 text-center">${u.opens || '—'}</td>
                    <td class="px-4 py-3 text-xs text-slate-500 whitespace-nowrap">${u.device ? `<i class="fas ${u.device === 'iPhone' ? 'fa-mobile-alt' : u.device === 'Android' ? 'fa-mobile-alt' : 'fa-laptop'} mr-1"></i>${u.device}` : '—'}</td>
                </tr>`; }).join('');
            const listHtml = `
                <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
                    <h3 class="text-sm font-bold text-slate-700">People ${activitySoc !== 'all' ? `in ${socName(activitySoc)} <button onclick="activitySoc='all'; render();" class="ml-1 text-xs font-semibold text-indigo-600 hover:underline">show all</button>` : ''}</h3>
                    <div class="flex flex-wrap gap-2">${seg('all', 'Most time first', inSoc.length)}${isNow ? seg('online', 'Online now', online.length) : ''}${seg('never', 'Not opened', never.length)}</div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"><div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse" data-title-col="2">
                        <thead><tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="px-4 py-3 font-medium">Status</th><th class="px-4 py-3 font-medium">Name</th><th class="px-4 py-3 font-medium">Society</th>
                            <th class="px-4 py-3 font-medium">Time in ${monthLbl.split(' ')[0]}</th><th class="px-4 py-3 font-medium text-center">Days</th><th class="px-4 py-3 font-medium text-center">Opens</th><th class="px-4 py-3 font-medium">Device</th>
                        </tr></thead>
                        <tbody>${rows || `<tr><td colspan="7" class="px-4 py-10 text-center text-slate-500 text-sm">${activityView === 'online' ? 'Nobody is online right now.' : activityView === 'never' ? 'Everyone has opened the app this month. 🎉' : 'No people found.'}</td></tr>`}</tbody>
                    </table>
                </div></div>
                <p class="text-[11px] text-slate-400 mt-3"><i class="fas fa-info-circle mr-1"></i>Time counts only while the app is on screen and in use (it pauses after 5 minutes without a touch). "Online" means active in the last 2 minutes. Tracking started with app version 2.5.0, so earlier days show no data.</p>`;
            return head + cards + socHtml + barsHtml + listHtml;
        }

                            </td>

            } else if (devActiveTab === 'coupons') {
                let cpnsHtml = '';
                db.coupons.forEach(c => {
                    cpnsHtml += `
                        <div class="bg-white p-4 rounded-xl border border-slate-200 flex justify-between items-center shadow-sm">

                    <p class="text-slate-500 text-sm">Manage societies, billing, and global settings.</p>
                </div>
                ${tabsHtml}
                <div class="fade-in">${contentHtml}</div>
            `);
        }

        function renderSocietyDashboard() {
            const society = db.societies.find(s => s.id === selectedSocietyId);
            if(!society) return renderLayout('<p>Society not found</p>');

            const tabs = [
                { id: 'flats', name: 'Flats', icon: 'fa-home', right: 'MANAGE_FLATS' },
                { id: 'committee', name: 'Committee', icon: 'fa-users', right: 'MANAGE_COMMITTEE' },
                { id: 'requests', name: 'Approvals', icon: 'fa-file-invoice-dollar', right: 'APPROVE_PAYMENTS' },
                { id: 'ledger', name: 'Ledger', icon: 'fa-book', right: 'MANAGE_LEDGER' },
                { id: 'complaints', name: 'Complaints', icon: 'fa-headset', right: 'ANY' }

            let navTabs = '';
            tabs.forEach(tab => {
                if(tab.id === 'ledger' && currentUser.role === 'committee' && !hasRight('MANAGE_LEDGER') && !hasRight('ADD_EXPENSE')) return;
                else if (tab.right !== 'ANY' && tab.id !== 'ledger' && currentUser.role === 'committee' && !hasRight(tab.right)) return;

                const isActive = activeTab === tab.id;

        // Subscription Logic helpers
        function calculateSubPreview(socId) {
            const soc = db.societies.find(s => s.id === socId);
            const baseAmount = soc.amount;
            
            const plan = document.getElementById('subPlan').value;
            const flats = parseInt(document.getElementById('subFlats').value) || 0;
            const devPct = parseFloat(document.getElementById('subPercent').value) || 0;
            const couponId = document.getElementById('subCoupon').value;
            
            let amount = baseAmount * (devPct / 100) * flats;
            if (plan === 'yearly') amount = amount * 12;
            
            if (couponId) {
                const coupon = db.coupons.find(c => c.id === couponId);
                if (coupon) {
                    if (coupon.type === 'percent') {
                        amount = amount - (amount * (coupon.value / 100));
                        document.getElementById('subPreviewAmount').innerText = formatCurrency(amount);
                    } else if (coupon.type === 'free_months') {
                        document.getElementById('subPreviewAmount').innerHTML = `${formatCurrency(amount)} <span class="text-sm font-bold text-green-600 block mt-1">+ ${coupon.value} Months Free</span>`;
                    }
                }
            } else {
                document.getElementById('subPreviewAmount').innerText = formatCurrency(amount);
            }
        }

        function calculatePaySubPreview(socId) {
            const soc = db.societies.find(s => s.id === socId);
            const sub = soc.subscription;
            const couponId = document.getElementById('paySubCoupon').value;
            const display = document.getElementById('paySubAmountDisplay');
            const modeContainer = document.getElementById('paySubModeContainer');
            const submitBtn = document.getElementById('paySubSubmitBtn');

            document.getElementById('fundRefNo').required = false;

            if (couponId) {
                const coupon = db.coupons.find(c => c.id === couponId);
                if (coupon) {
                    if (coupon.type === 'percent') {
                        const amt = sub.calculatedAmount - (sub.calculatedAmount * (coupon.value / 100));
                        display.innerText = formatCurrency(amt);
                        modeContainer.classList.remove('hidden');
                        submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> Complete Payment & Renew';
                        toggleFundFields(document.getElementById('paySubMode').value); 
                    } else if (coupon.type === 'free_months') {
                        display.innerText = '₹ 0 (Free Trial)';
                        modeContainer.classList.add('hidden');
                        document.getElementById('fundRefNo').required = false;
                        document.getElementById('fundCashTo').required = false;
                        document.getElementById('fundChequeNo').required = false;
                        document.getElementById('fundBankName').required = false;
                        submitBtn.innerHTML = '<i class="fas fa-gift"></i> Apply Coupon & Extend Due Date';
                    }
                }
            } else {
                display.innerText = formatCurrency(sub.calculatedAmount);
                modeContainer.classList.remove('hidden');
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> Complete Payment & Renew';
                toggleFundFields(document.getElementById('paySubMode').value);
            }
        }

        function submitConfigureSub(event, socId) {
            event.preventDefault();
            const form = event.target;
            const soc = db.societies.find(s => s.id === socId);
            
            const plan = form.plan.value;
            const flatCount = parseInt(form.flatCount.value);
            const devPercentage = parseFloat(form.devPercentage.value);
            let nextDueDate = form.nextDueDate.value;
            
            let amount = soc.amount * (devPercentage / 100) * flatCount;
            if (plan === 'yearly') amount = amount * 12;
            
            const couponId = form.couponId.value;
            let appliedFreeMonths = 0;
            let couponCode = '';

            if (couponId) {
                const coupon = db.coupons.find(c => c.id === couponId);
                if (coupon) {
                    if (coupon.type === 'percent') {
                        amount = amount - (amount * (coupon.value / 100));
                        couponCode = coupon.code;
                    } else if (coupon.type === 'free_months') {
                        appliedFreeMonths = coupon.value;
                        couponCode = coupon.code;
                    }
                }
            }

            let finalDueDate = new Date(nextDueDate);
            if (appliedFreeMonths > 0) {
                finalDueDate.setMonth(finalDueDate.getMonth() + appliedFreeMonths);
                db.subPayments.push({
                    id: generateId(),
                    societyId: socId,
                    amount: 0,
                    date: new Date().toISOString(),
                    plan: plan,
                    details: `Initial Setup Coupon: ${couponCode} (${appliedFreeMonths} Months Free)`
                });
            }
            
            soc.subscription = {
                active: true,
                plan, flatCount, devPercentage, nextDueDate: finalDueDate.toISOString().split('T')[0],
                calculatedAmount: amount
            };
            
            showToast('Subscription Configured!');
            closeModal();
            render();
        }

        function submitSubPayment(event, socId) {
            event.preventDefault();
            const form = event.target;
            const soc = db.societies.find(s => s.id === socId);
            const sub = soc.subscription;
            
            const couponId = form.couponId ? form.couponId.value : undefined;
            let appliedCoupon = null;
            let finalAmount = sub.calculatedAmount;
            let extensionMonths = sub.plan === 'yearly' ? 12 : 1;

            if (couponId) {
                appliedCoupon = db.coupons.find(c => c.id === couponId);
                if (appliedCoupon) {
                    if (appliedCoupon.type === 'percent') {
                        finalAmount = finalAmount - (finalAmount * (appliedCoupon.value / 100));
                    } else if (appliedCoupon.type === 'free_months') {
                        finalAmount = 0;
                        extensionMonths = appliedCoupon.value; 
                    }
                }
            }

            let refDetails = '';
            if (appliedCoupon && appliedCoupon.type === 'free_months') {
                refDetails = `Coupon Applied: ${appliedCoupon.code} (${appliedCoupon.value} Months Free)`;
            } else {
                const mode = form.mode.value;
                refDetails = mode;
                if (appliedCoupon && appliedCoupon.type === 'percent') refDetails += ` (Coupon: ${appliedCoupon.code})`;
                
                if (mode === 'UPI' || mode === 'Bank Transfer') refDetails += ` (Ref: ${form.refNo.value})`;
                else if (mode === 'Cheque') refDetails += ` (Chq: ${form.chequeNo.value} ${form.bankName.value})`;
                else if (mode === 'Cash') refDetails += ` (Given to: ${form.cashGivenTo.value})`;
            }
            
            db.subPayments.push({
                id: generateId(),
                societyId: socId,
                amount: finalAmount,
                date: new Date().toISOString(),
                plan: sub.plan,
                details: refDetails
            });
            
            // Advance next due date
            const oldDate = new Date(sub.nextDueDate);
            oldDate.setMonth(oldDate.getMonth() + extensionMonths);
            sub.nextDueDate = oldDate.toISOString().split('T')[0];
            
            let msg = '';
            if (appliedCoupon && appliedCoupon.type === 'free_months') {
                msg = `*Subscription Extended - ${soc.name}*\n\nCoupon ${appliedCoupon.code} applied successfully! Subscription extended by ${appliedCoupon.value} months for free.\n\nNext Due Date: ${formatDate(sub.nextDueDate).split(',')[0]}\n\nThank you for choosing Nexgen Softwares!`;
            } else {
                msg = `*Subscription Receipt - ${soc.name}*\n\nPayment of ${formatCurrency(finalAmount)} received successfully for ${sub.plan.toUpperCase()} plan.\n\nMode: ${refDetails}\nNext Due Date: ${formatDate(sub.nextDueDate).split(',')[0]}\n\nThank you for choosing Nexgen Softwares!`;
            }
            
            showToast('Subscription Renewed!');
            closeModal();
            render();
            
            const phoneNum = db.settings.supportNumber || '918888888888';
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function renderMonthCheckboxes(monthsArray, selectedMonths, isMaintUpdate = false) {
            if(monthsArray.length === 0) return '<p class="text-sm text-slate-400 p-2">No months available.</p>';
            
            const grouped = {};
            monthsArray.forEach(m => {
                const year = m.split('-')[0];
                if(!grouped[year]) grouped[year] = [];
                grouped[year].push(m);
            });
            
            let html = '';
            Object.keys(grouped).sort((a,b)=>a-b).forEach(year => {
                const yearToggleHtml = isMaintUpdate 
                    ? `<label class="text-[10px] text-indigo-600 font-medium cursor-pointer hover:underline flex items-center gap-1"><input type="checkbox" onchange="toggleYear(this, '${year}', ${isMaintUpdate})" class="rounded text-indigo-600 focus:ring-0"> Select Year</label>` 
                    : `<span class="text-[10px] text-slate-400">Chronological Selection</span>`;

                html += `
                <div class="mb-4">
                    <div class="flex justify-between items-center border-b border-slate-200 mb-2 pb-1">
                        <h4 class="font-bold text-slate-700 text-xs">${year}</h4>
                        ${yearToggleHtml}
                    </div>
                    <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">`;
                
                grouped[year].sort().forEach(m => {
                    const isChecked = selectedMonths.includes(m);
                    const cbClass = isMaintUpdate ? 'maint-cb' : 'pay-cb';
                    const fn = isMaintUpdate ? 'recalcMaintAmount()' : 'handlePayCheckboxClick(this)';
                    html += `
                        <label class="flex items-center gap-1.5 text-xs p-2 border rounded cursor-pointer hover:bg-slate-50 transition-colors ${isChecked ? 'bg-indigo-50 border-indigo-200' : 'bg-white border-slate-200'}">
                            <input type="checkbox" value="${m}" data-year="${year}" ${isChecked ? 'checked' : ''} onchange="${fn}" class="rounded text-indigo-600 ${cbClass} w-3.5 h-3.5 focus:ring-0">
                            ${getMonthName(m).split(' ')[0]}
                        </label>`;
                });
                html += `</div></div>`;
            });
            return html;
        }

        function handlePayCheckboxClick(clickedCb) {
            const allCbs = Array.from(document.querySelectorAll('.pay-cb'));
            const clickedIndex = allCbs.indexOf(clickedCb);
            
            if (clickedCb.checked) {
                for(let i = 0; i < clickedIndex; i++) allCbs[i].checked = true;
            } else {
                for(let i = clickedIndex + 1; i < allCbs.length; i++) allCbs[i].checked = false;
            }
            
            // Visually update the labels
            allCbs.forEach(cb => {
                const parent = cb.closest('label');
                if(cb.checked) {
                    parent.classList.add('bg-indigo-50', 'border-indigo-200');
                    parent.classList.remove('bg-white', 'border-slate-200');
                } else {
                    parent.classList.remove('bg-indigo-50', 'border-indigo-200');
                    parent.classList.add('bg-white', 'border-slate-200');
                }
            });
            
            const allChecked = allCbs.every(cb => cb.checked);
            const advSelect = document.getElementById('advanceMonthsSelect');
            const advMsg = document.getElementById('advanceLockMsg');
            
            if (advSelect) {
                if (allChecked || allCbs.length === 0) {
                    advSelect.disabled = false;
                    if(advMsg) advMsg.classList.add('hidden');
                } else {
                    advSelect.disabled = true;
                    advSelect.value = "0";
                    if(advMsg) advMsg.classList.remove('hidden');
                }
            }
            recalcPayAmount();
        }

        function recalcMaintAmount() {
            const checkedCount = document.querySelectorAll('.maint-cb:checked').length;
            const input = document.getElementById('maintTotal');
            if(window.currentSocMaintAmount) input.value = checkedCount * window.currentSocMaintAmount;
        }

        function recalcPayAmount() {
            const checkedCount = document.querySelectorAll('.pay-cb:checked').length;
            const advSelect = document.getElementById('advanceMonthsSelect');
            const advMonths = advSelect ? parseInt(advSelect.value) : 0;
            
            const pendingTotal = checkedCount * window.currentSocMaintAmount;
            let advTotal = advMonths * window.currentSocMaintAmount;
            
            const soc = db.societies.find(s => s.id === window.currentSocietyId);
            const discountPct = soc ? (soc.advanceYearlyDiscount || 0) : 0;
            
            const discMsg = document.getElementById('advanceDiscountMsg');
            if (advMonths === 12 && discountPct > 0) {
                const discountAmt = advTotal * (discountPct / 100);
                advTotal = advTotal - discountAmt;
                if (discMsg) discMsg.classList.remove('hidden');
            } else if (discMsg) {
                discMsg.classList.add('hidden');
            }
            
            const total = pendingTotal + advTotal;
            const input = document.getElementById('payTotal');
            if(input) input.value = total;
        }

        // ================= READ REF / UTR FROM A PAYMENT SCREENSHOT =================
        // Runs on the phone itself (Tesseract.js, loaded only when a screenshot is picked). Nothing is sent anywhere.
        function extractTxnRef(text, mode) {
            if (!text) return null;
            const lines = String(text).replace(/\r/g, '').split('\n').map(l => l.replace(/[“”"'`|]/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
            // OCR often confuses letters and digits inside numbers
            const fixDigits = t => t.replace(/[Oo]/g, '0').replace(/[Il|!]/g, '1').replace(/[Ss]/g, '5').replace(/[B]/g, '8').replace(/[Z]/g, '2').replace(/[G]/g, '6');
            const digitShare = t => (t.match(/\d/g) || []).length / Math.max(1, t.length);
            function normalise(tok) {
                let t = tok.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, '');
                if (!t) return '';
                if (/^[A-Za-z]{4}[A-Za-z0-9]{8,}$/.test(t) && digitShare(t.slice(5)) >= 0.7) t = t.slice(0, 5) + fixDigits(t.slice(5));   // NEFT UTR: keep bank code (SBIN, HDFC…)
                else if (digitShare(t) >= 0.7 && /^[A-Za-z0-9]+$/.test(t)) t = fixDigits(t);   // e.g. 4O3O12345678 -> 403012345678
                return t.toUpperCase();
            }
            // join "4304 1234 5678" -> "430412345678" and "SBIN 0123 4567 8901" style groups
            function tokensOf(line) {
                const raw = line.split(/[\s:：#=]+/).filter(Boolean), out = [];
                for (let i = 0; i < raw.length; i++) {
                    out.push(raw[i]);
                    let joined = raw[i];
                    for (let j = i + 1; j < Math.min(raw.length, i + 4); j++) {
                        if (!/^[A-Za-z0-9]{2,6}$/.test(raw[j]) || !/^[A-Za-z0-9]+$/.test(joined)) break;
                        joined += raw[j]; out.push(joined);
                    }
                }
                return out.map(normalise).filter(Boolean);
            }
            const isUpi12 = t => /^\d{12}$/.test(t);
            const isNeft = t => /^[A-Z]{4}[A-Z0-9]{8,18}$/.test(t) && /\d{6,}/.test(t);         // e.g. SBIN324304123456, HDFCN52024103012345
            const isLongId = t => /^[A-Z0-9]{10,30}$/.test(t) && /\d{6,}/.test(t);             // app txn ids: T2410301234..., CICAgK...
            const looksPhone = t => /^[6-9]\d{9}$/.test(t) || /^91[6-9]\d{9}$/.test(t);
            const looksDate = t => /^(19|20)\d{6}$/.test(t);
            const LABELS = [
                { re: /\b(utr|u\.?t\.?r)\b/i, w: 100, name: 'UTR' },
                { re: /upi\s*(ref|reference)|ref(erence)?\.?\s*(no|number|id)?\.?\s*(upi)?/i, w: 95, name: 'UPI Ref No.' },
                { re: /\brrn\b|retrieval/i, w: 95, name: 'RRN' },
                { re: /upi\s*(transaction|txn)\s*id/i, w: 95, name: 'UPI transaction ID' },
                { re: /bank\s*ref/i, w: 90, name: 'Bank Ref' },
                { re: /\b(imps|neft|rtgs)\b.*\b(ref|no|number|id)\b/i, w: 90, name: 'NEFT/IMPS Ref' },
                { re: /(transaction|txn|trans)\.?\s*(id|no|number|ref)/i, w: 60, name: 'Transaction ID' },
                { re: /order\s*id/i, w: 25, name: 'Order ID' }
            ];
            const cands = [];
            const add = (tok, score, label) => { if (!looksPhone(tok) && !looksDate(tok)) cands.push({ ref: tok, score, label }); };
            lines.forEach((line, i) => {
                const lab = LABELS.find(L => L.re.test(line));
                const here = tokensOf(line), next = i + 1 < lines.length ? tokensOf(lines[i + 1]) : [];
                const google = /google\s*transaction/i.test(line);
                [[here, 0], [next, -5]].forEach(([toks, adj]) => toks.forEach(t => {
                    if (lab && !google) {
                        if (isUpi12(t)) add(t, lab.w + 30 + adj, lab.name);
                        else if (isNeft(t)) add(t, lab.w + (mode === 'NEFT/IMPS' ? 25 : 10) + adj, lab.name);
                        else if (isLongId(t)) add(t, lab.w - 20 + adj, lab.name);
                    }
                }));
                // unlabelled 12-digit numbers are still very likely the UPI ref
                here.forEach(t => { if (isUpi12(t)) add(t, 40, 'Reference'); });
            });
            if (!cands.length) return null;
            // a full NEFT code (SBIN324305123456) beats any shorter piece of itself (324305123456)
            cands.forEach(c => { if (isNeft(c.ref)) cands.forEach(o => { if (o !== c && o.ref.length < c.ref.length && c.ref.endsWith(o.ref)) c.score = Math.max(c.score, o.score + 1); }); });
            cands.sort((a, b) => b.score - a.score || b.ref.length - a.ref.length);
            return cands[0];
        }
        const PayOCR = (() => {
            const LIB = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
            let proof = null, autoRef = null, run = 0, workerP = null;
            const el = id => document.getElementById(id);
            function status(html, kind) { const b = el('ocrStatus'); if (b) b.innerHTML = html ? `<div class="ocr-msg ${kind || ''}">${html}</div>` : ''; }
            function loadLib() {
                if (window.Tesseract) return Promise.resolve();
                return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = LIB; sc.async = true; sc.onload = res; sc.onerror = () => rej(new Error('Could not load the screenshot reader. Check internet and try again.')); document.head.appendChild(sc); });
            }
            function worker(progress) {
                if (!workerP) workerP = loadLib().then(() => Tesseract.createWorker('eng', 1, { logger: m => { if (m && m.status === 'recognizing text' && progress.cb) progress.cb(m.progress); } }))
                    .catch(e => { workerP = null; throw e; });
                return workerP;
            }
            const progress = { cb: null };
            function loadImage(file) {
                return new Promise((res, rej) => { const url = URL.createObjectURL(file); const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('This file is not a readable image.')); im.src = url; });
            }
            function prepare(im) {
                // 1) small copy kept as proof for the committee
                const ps = Math.min(1, 1100 / Math.max(im.naturalWidth, im.naturalHeight));
                const pc = document.createElement('canvas'); pc.width = Math.round(im.naturalWidth * ps); pc.height = Math.round(im.naturalHeight * ps);
                pc.getContext('2d').drawImage(im, 0, 0, pc.width, pc.height);
                const proofUrl = pc.toDataURL('image/jpeg', 0.72);
                // 2) clean black-on-white copy for reading (dark-mode screenshots are inverted)
                const os = Math.min(2, Math.max(1, 1400 / im.naturalWidth));
                const oc = document.createElement('canvas'); oc.width = Math.round(im.naturalWidth * os); oc.height = Math.round(im.naturalHeight * os);
                const g = oc.getContext('2d'); g.drawImage(im, 0, 0, oc.width, oc.height);
                const d = g.getImageData(0, 0, oc.width, oc.height), px = d.data; let sum = 0;
                for (let i = 0; i < px.length; i += 4) { const y = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]; px[i] = px[i + 1] = px[i + 2] = y; sum += y; }
                const dark = sum / (px.length / 4) < 110;
                if (dark) for (let i = 0; i < px.length; i += 4) px[i] = px[i + 1] = px[i + 2] = 255 - px[i];
                g.putImageData(d, 0, 0);
                return { proofUrl, canvas: oc };
            }
            async function pick(input) {
                const file = input.files && input.files[0]; if (!file) return;
                const id = ++run; autoRef = null;
                const ref = el('payRefNo'); if (ref) ref.classList.remove('ocr-filled');
                try {
                    if (!/^image\//.test(file.type || 'image/')) throw new Error('Please choose an image (screenshot).');
                    status('<i class="fas fa-circle-notch fa-spin"></i> Reading screenshot…', 'busy');
                    const im = await loadImage(file);
                    const { proofUrl, canvas } = prepare(im); proof = proofUrl;
                    const pv = el('ocrPreview'); if (pv) pv.innerHTML = `<img src="${proofUrl}" alt="Payment screenshot" class="ocr-thumb" onclick="viewImageKeep(this.src)">`;
                    progress.cb = p => { if (id === run) status(`<i class="fas fa-circle-notch fa-spin"></i> Reading screenshot… ${Math.round(p * 100)}%`, 'busy'); };
                    const w = await worker(progress);
                    const { data } = await w.recognize(canvas);
                    if (id !== run) return;
                    const modeSel = document.querySelector('#payForm select[name=mode]');
                    const found = extractTxnRef(data && data.text, modeSel ? modeSel.value : 'UPI');
                    if (found && ref) {
                        ref.value = found.ref; autoRef = found.ref; ref.classList.add('ocr-filled');
                        status(`<i class="fas fa-check-circle"></i> Found <b>${found.label}</b>: <b class="font-mono">${found.ref}</b> — filled in. Please check it matches the screenshot.`, 'ok');
                    } else status('<i class="fas fa-info-circle"></i> Couldn’t find the Ref / UTR number in this screenshot. Please type it in.', 'warn');
                } catch (e) { if (id === run) status(`<i class="fas fa-info-circle"></i> ${e.message || 'Could not read the screenshot.'} You can type the Ref No.`, 'warn'); }
            }
            function reset() { proof = null; autoRef = null; run++; progress.cb = null; }
            return { pick, reset, proof: () => proof, autoRef: () => autoRef };
        })();

                soc.status = (soc.status || 'active') === 'active' ? 'inactive' : 'active';
                showToast(`Society marked as ${soc.status}!`);
            } else if (type === 'flat') {

                flat.status = (flat.status || 'active') === 'active' ? 'inactive' : 'active';
                const user = db.users.find(u => u.flatId === id);
                if(user) user.status = flat.status;
                showToast(`Flat marked as ${flat.status}!`);
            } else if (type === 'delete_flat') {
                if (!hasRight('MANAGE_FLATS')) { closeModal(); pendingToggleData = null; return; }
                const flat = db.flats.find(f => f.id === id);
                if (flat) {
                    db.flats = db.flats.filter(f => f.id !== id);
                    db.users = db.users.filter(u => u.flatId !== id);            // owner's login
                    db.payments = db.payments.filter(p => p.flatId !== id);      // payment records & pending requests
                    db.complaints = db.complaints.filter(c => c.flatId !== id);  // complaints
                    // ledger (transactions) is kept on purpose so the society balance stays correct
                    showToast(`Flat ${flat.flatNo} deleted`);

        function executeApproval() {
            if(!pendingApprovalData) return;
            const roleName = currentUser.committeeRole || currentUser.role;

            if (pendingApprovalData.type === 'payment') {
                const { paymentId, status } = pendingApprovalData;
                const payment = db.payments.find(p => p.id === paymentId);
                
                if (payment) {
                    const flat = db.flats.find(f => f.id === payment.flatId);
                    const society = db.societies.find(s => s.id === payment.societyId);

                    payment.status = status;
                    payment.approvedBy = currentUser.name;
                    payment.approvedByRole = roleName;
                    if (status === 'approved' && payment.proofImage) {   // screenshot is no longer needed once approved: delete it to save storage
                        delete payment.proofImage;
                        payment.proofRemovedOnApproval = true;
                    }
                    payment.approvedAt = new Date().toISOString();

                    if (status === 'rejected') {
                        if (flat && society) {
                            const rejectedPending = payment.months.filter(m => m <= flat.lastBilledMonth);
                            flat.pendingAmount += (rejectedPending.length * society.amount);
                            flat.pendingMonths = [...new Set([...flat.pendingMonths, ...rejectedPending])].sort();
                        }
                    } else if (status === 'approved') {
                        if (flat && society) {
                            const sortedPaid = [...payment.months].sort();
                            if (sortedPaid.length > 0) {
                                const latestPaid = sortedPaid[sortedPaid.length - 1];
                                if (latestPaid > flat.lastBilledMonth) {
                                    flat.lastBilledMonth = latestPaid;
                                }
                            }
                        }

                        let modeDetails = '';
                        if (payment.mode === 'UPI' || payment.mode === 'NEFT/IMPS') modeDetails = `(Ref: ${payment.refNo})`;
                        else if (payment.mode === 'Cash') modeDetails = `(Cash to: ${payment.cashGivenTo})`;
                        else if (payment.mode === 'Cheque') modeDetails = `(Chq: ${payment.chequeNo})`;

                        db.transactions.push({
                            id: 'txn_' + payment.id,
                            societyId: payment.societyId,
                            type: 'income',
                            amount: payment.amount,
                            description: `Maintenance Paid - Flat ${flat ? flat.flatNo : 'Unknown'} ${modeDetails}`,
                            requestedBy: flat ? flat.ownerName : 'Owner',
                            approvedBy: currentUser.name,
                            approvedByRole: roleName,
                            status: 'approved',
                            date: new Date().toISOString()
                        });
                    }
                    showToast(`Payment ${status}!`);
                }
            } else if (pendingApprovalData.type === 'expense') {
                const { txnId, status } = pendingApprovalData;
                const txn = db.transactions.find(t => t.id === txnId);
                if (txn) {
                    txn.status = status;
                    txn.approvedBy = currentUser.name;
                    txn.approvedByRole = roleName;
                    txn.date = new Date().toISOString(); 
                    showToast(`Expense ${status}!`);
                }
            } else if (pendingApprovalData.type === 'complaint_approve') {
                const { id } = pendingApprovalData;
                const complaint = db.complaints.find(c => c.id === id);
                if (complaint) {
                    complaint.status = 'approved';
                    complaint.approvedBy = currentUser.name;
                    complaint.approvedByRole = roleName;
                    showToast('Complaint Approved for resolution!');
                }
            }

            closeModal();
            pendingApprovalData = null;
            render();
        }

        function downloadLedgerCSV(societyId) {
            const society = db.societies.find(s => s.id === societyId);
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Date,Type,Description,Requested By,Approved By,Amount\r\n";
            
            if (society.initialBalance > 0) {
                csvContent += `System Opening,Income,Initial Bank Balance,System,System,${society.initialBalance}\r\n`;
            }

            const txns = db.transactions.filter(t => t.societyId === societyId && t.status === 'approved').sort((a,b) => new Date(a.date) - new Date(b.date));
            txns.forEach(t => {
                const date = formatDate(t.date).replace(/,/g, '');
                const type = t.type === 'income' ? 'Income' : 'Expense';
                const desc = `"${t.description.replace(/"/g, '""')}"`;
                const req = `"${t.requestedBy}"`;
                const app = `"${t.approvedBy}"`;
                const amt = t.type === 'income' ? t.amount : `-${t.amount}`;
                csvContent += `${date},${type},${desc},${req},${app},${amt}\r\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${society.name}_Ledger.csv`);
            document.body.appendChild(link);
            link.click();
            link.remove();

                        </div>

            const nameEl = document.getElementById(nameId);

            const phone = phoneEl.value.trim();

                return;
            }
            
            const firstName = name.split(' ')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
            const last4Digits = phone.slice(-4);
            const generatedId = firstName + last4Digits;
            const generatedPass = firstName.charAt(0).toUpperCase() + firstName.slice(1) + '@' + Math.floor(1000 + Math.random() * 9000);

        async function submitEditSociety(event) {
            event.preventDefault();
            const form = event.target;
            const soc = db.societies.find(s => s.id === selectedSocietyId);
            if (!soc) return;

            const btn = document.getElementById('btnEditSoc');
            const ogBtn = btn.innerHTML;
            btn.innerHTML = 'Saving...';
            btn.disabled = true;

            try {
                let estChanged = '';
                if (currentUser && currentUser.role === 'developer' && form.estMonth) {
                    const est = String(form.estMonth.value || '').trim();
                    if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(est)) throw new Error('Established month must look like 2026-01');
                    if (est > getCurrentMonthStr()) throw new Error('Established month cannot be in the future');
                    if (est !== soc.establishedMonth) { estChanged = `Established month: ${soc.establishedMonth ? getMonthName(soc.establishedMonth) : 'not set'} \u2192 ${getMonthName(est)}`; soc.establishedMonth = est; }
                }

                soc.name = form.name.value;
                soc.amount = parseFloat(form.amount.value);
                soc.upi = form.upi.value;
                soc.bankDetails = form.bank.value;
                soc.websiteUrl = form.websiteUrl.value;

                if (form.logoFile.files.length > 0) {
                    if (form.logoFile.files[0].size > 5 * 1024 * 1024) throw new Error("Logo exceeds 5MB");
                    soc.logo = await toBase64(form.logoFile.files[0]);
                }
                
                soc.advanceYearlyDiscount = parseFloat(form.advanceYearlyDiscount.value) || 0;

                if (!soc.signatures) soc.signatures = {};
                
                if (form.sigChairman.files.length > 0) {
                    if (form.sigChairman.files[0].size > 5 * 1024 * 1024) throw new Error("Signature exceeds 5MB");
                    soc.signatures.chairman = await toBase64(form.sigChairman.files[0]);
                }
                if (form.sigTreasurer.files.length > 0) {
                    if (form.sigTreasurer.files[0].size > 5 * 1024 * 1024) throw new Error("Signature exceeds 5MB");
                    soc.signatures.treasurer = await toBase64(form.sigTreasurer.files[0]);
                }
                if (form.sigSecretary.files.length > 0) {
                    if (form.sigSecretary.files[0].size > 5 * 1024 * 1024) throw new Error("Signature exceeds 5MB");
                    soc.signatures.secretary = await toBase64(form.sigSecretary.files[0]);
                }

                showToast(estChanged ? 'Society updated. ' + estChanged : 'Society settings updated!');
                closeModal();
                render();
            } catch (err) {
                showToast(err.message || 'Error uploading images', 'error');
                btn.innerHTML = ogBtn;
                btn.disabled = false;
            }
        }

            flat.adjustments = flat.adjustments || [];
